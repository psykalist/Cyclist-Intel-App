name: Refresh Rider Photos (manual)

# Manual-only. Runs `fetch_missing_photos.py` -- fills any missing rider photo
# and REPLACES non-rendering ProCyclingStats photos with CyclingFlash CDN URLs
# (the ~330 riders, incl. Bob Jungels, that showed a blank avatar).
#
# Must run on the self-hosted runner: cyclingflash.com is not reachable from
# GitHub-hosted Actions IPs (see the reachability note in scrape.yml), and the
# script scrapes cyclingflash profile pages.
#
# "Never lose a photo": the script itself aborts if the renderable-photo count
# would drop, and the commit step below double-checks that rider_photos.json
# never comes out with fewer entries than origin already has before pushing.

on:
  workflow_dispatch:

# Serializes against the other scrape/health workflows so two jobs never
# commit/push to main at the same time -- see the note in update-data.yml.
concurrency:
  group: uci-calendar-git-write
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  fix-photos:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Same PATH-discovery dance as the other self-hosted workflows -- the
      # runner service has no interactive user profile, so it only sees the
      # machine-wide PATH. See scrape.yml for the full explanation.
      - name: Locate Python and add it to PATH
        shell: powershell
        run: |
          $found = $null

          try {
            $viaPy = & py -3 -c "import sys; print(sys.executable)" 2>$null
            if ($LASTEXITCODE -eq 0 -and $viaPy) { $found = Split-Path $viaPy }
          } catch {}

          if (-not $found) {
            foreach ($exe in @('python.exe','python3.exe')) {
              try {
                $whereOut = & where.exe $exe 2>$null
                if ($LASTEXITCODE -eq 0 -and $whereOut) {
                  foreach ($line in ($whereOut -split "`r?`n")) {
                    if ($line -and (Test-Path $line) -and ((Get-Item $line).Length -gt 0)) {
                      $found = Split-Path $line
                      break
                    }
                  }
                }
              } catch {}
              if ($found) { break }
            }
          }

          if (-not $found) {
            $regRoots = @(
              'HKLM:\SOFTWARE\Python\PythonCore',
              'HKLM:\SOFTWARE\WOW6432Node\Python\PythonCore',
              'HKCU:\SOFTWARE\Python\PythonCore'
            )
            foreach ($root in $regRoots) {
              if (Test-Path $root) {
                $versions = Get-ChildItem $root -ErrorAction SilentlyContinue | Sort-Object Name -Descending
                foreach ($v in $versions) {
                  $ip = Get-ItemProperty -Path (Join-Path $v.PSPath 'InstallPath') -ErrorAction SilentlyContinue
                  $dir = $ip.'(default)'
                  if ($dir -and (Test-Path (Join-Path $dir 'python.exe'))) { $found = $dir.TrimEnd('\'); break }
                }
              }
              if ($found) { break }
            }
          }

          if (-not $found) {
            $candidates = @()
            $candidates += Get-ChildItem "C:\Program Files\Python*" -Directory -ErrorAction SilentlyContinue
            $candidates += Get-ChildItem "C:\Program Files (x86)\Python*" -Directory -ErrorAction SilentlyContinue
            $candidates += Get-ChildItem "C:\Users\*\AppData\Local\Programs\Python\Python*" -Directory -ErrorAction SilentlyContinue
            $candidates += Get-ChildItem "C:\Python*" -Directory -ErrorAction SilentlyContinue
            $candidates += Get-ChildItem "C:\ProgramData\chocolatey\lib\python*\tools" -Directory -ErrorAction SilentlyContinue
            $match = $candidates | Where-Object { Test-Path (Join-Path $_.FullName "python.exe") } | Sort-Object FullName -Descending | Select-Object -First 1
            if ($match) { $found = $match.FullName }
          }

          if (-not $found) {
            Write-Error "Could not locate python.exe via py launcher, where.exe, registry, or filesystem search. Install Python 'for all users', or add its folder to this runner's system PATH manually."
            exit 1
          }
          Write-Host "Found Python at: $found"
          Add-Content -Path $env:GITHUB_PATH -Value $found
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $found "Scripts")

      - name: Configure git + pull latest
        shell: cmd
        run: |
          git config user.name "Cyclist Intel App Bot"
          git config user.email "uci-bot@users.noreply.github.com"
          git pull --rebase origin main || git pull origin main

      # Snapshot origin's photo count BEFORE the scrape, so the commit step can
      # refuse to push a rider_photos.json that has fewer entries than we started
      # with -- a belt-and-braces "never lose a photo" guard on top of the one
      # inside fetch_missing_photos.py.
      - name: Snapshot current photo count
        shell: python
        run: |
          import json, os
          n = len(json.load(open('rider_photos.json', encoding='utf-8'))) if os.path.exists('rider_photos.json') else 0
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'PHOTOS_BEFORE={n}\n')
          print(f'rider_photos.json entries before run: {n}')

      - name: Fill missing + replace broken (PCS) photos
        shell: cmd
        run: python fetch_missing_photos.py

      - name: Commit and push if photos changed (guarded against shrink)
        shell: python
        run: |
          import json, os, subprocess
          from datetime import datetime, timezone

          before = int(os.environ.get('PHOTOS_BEFORE', '0'))
          after  = len(json.load(open('rider_photos.json', encoding='utf-8')))
          if after < before:
              raise SystemExit(
                  f'ABORT: rider_photos.json shrank {before} -> {after}. '
                  f'Refusing to commit (would lose photos).'
              )

          subprocess.run(['git', 'add', 'rider_photos.json', 'data.json'], check=True)
          diff = subprocess.run(['git', 'diff', '--staged', '--quiet'])
          if diff.returncode != 0:
              ts = datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M UTC')
              subprocess.run(['git', 'commit', '-m', f'data: refresh rider photos {ts}'], check=True)
              result = subprocess.run(['git', 'push', 'origin', 'main'])
              if result.returncode != 0:
                  subprocess.run(['git', 'pull', '--rebase', 'origin', 'main'], check=True)
                  subprocess.run(['git', 'push', 'origin', 'main'], check=True)
              print(f'Pushed to GitHub ({before} -> {after} photos)')
          else:
              print('No photo changes to commit')
