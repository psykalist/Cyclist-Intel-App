name: Health Check & Auto-Repair

# Runs:
#   - Whenever heal.py pushes status.json from your local machine
#   - Every 6 hours on schedule (catches cases where local machine is off)
#   - Manually from the Actions tab

on:
  push:
    paths:
      - 'status.json'
    branches:
      - main
  # Run right after either scrape workflow finishes (success OR failure) --
  # this is what actually catches "scraper reported success but silently
  # found nothing new" instead of waiting up to 6h for the next cron tick.
  # See scrape_log.json / possible_parser_drift below for what it checks.
  workflow_run:
    workflows:
      - 'Update UCI Race Data'
      - 'Full Scrape - Calendar & Teams (manual)'
    types:
      - completed
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours -- catches cases the above misses
  workflow_dispatch:
    inputs:
      force_scrape:
        description: 'Force re-run scraper even if data is fresh'
        required: false
        default: 'false'

# Serializes this workflow against update-data.yml and scrape.yml so they
# never commit/push to main at the same time -- see the matching note in
# update-data.yml for the incident this fixes.
concurrency:
  group: uci-calendar-git-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # so the notify step can open/update/close an alert issue

jobs:
  health-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      # -- Setup ---------------------------------------------------------------
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config --global user.name  'UCI Calendar Bot'
          git config --global user.email 'uci-bot@users.noreply.github.com'

      - name: Pull latest (avoid stale checkout)
        run: git pull --rebase origin main || git pull origin main

      # -- Read current status -------------------------------------------------
      - name: Read status.json
        id: status
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import datetime, timezone

          overall    = "unknown"
          age_hours  = 999
          data_valid = False
          missing_sp = 999

          if os.path.exists("status.json"):
              try:
                  s = json.load(open("status.json"))
                  overall    = s.get("overall", "unknown")
                  d          = s.get("data", {})
                  age_hours  = d.get("data_age_hours", 999)
                  data_valid = "data_size_kb" in d and d.get("data_size_kb", 0) > 200
                  missing_sp = d.get("specialties_missing", 0)
                  print(f"status.json: overall={overall}, age={age_hours}h, valid={data_valid}")
              except Exception as e:
                  print(f"Could not parse status.json: {e}")
                  overall = "error"
          else:
              print("No status.json found -- treating as unknown")
              overall = "unknown"

          # A live race updates (at minimum) daily -- scrape.yml runs at 11am
          # and 5pm UTC. 26h of slack made sense when nothing was live, but
          # during a Grand Tour it let a full missed stage look "fresh" for
          # over a day (the 2026-07-07 stage-4 incident: 24.6h old and this
          # check still said "skip, data is fresh"). Tighten to 8h whenever
          # data.json actually has a live race; keep the old lenient window
          # for the off-season case where nothing's actually running.
          live_count = 0
          if os.path.exists("data.json"):
              try:
                  live_count = len(json.load(open("data.json")).get("live", []))
              except Exception:
                  pass
          stale_threshold = 8 if live_count > 0 else 26
          print(f"live_count={live_count} -> stale_threshold={stale_threshold}h")

          force = os.environ.get("FORCE_SCRAPE", "false").lower() == "true"
          need_scrape = (
              force
              or overall in ("error", "unknown")
              or age_hours > stale_threshold
              or not data_valid
          )

          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
              out.write(f"age_hours={age_hours}\n")
              out.write(f"need_scrape={'true' if need_scrape else 'false'}\n")

          print(f"need_scrape={need_scrape}")
          EOF
        env:
          FORCE_SCRAPE: ${{ github.event.inputs.force_scrape }}

      # -- Validate data.json --------------------------------------------------
      - name: Validate data.json
        run: |
          python - <<'EOF'
          import json, sys, os, subprocess
          errors = []

          if not os.path.exists("data.json"):
              errors.append("data.json missing")
          else:
              size_kb = os.path.getsize("data.json") // 1024
              try:
                  data = json.load(open("data.json"))
                  print(f"data.json: {size_kb} KB, valid JSON")
                  if size_kb < 200:
                      errors.append(f"data.json too small: {size_kb} KB")
              except json.JSONDecodeError as e:
                  errors.append(f"data.json invalid JSON: {e}")

          if errors:
              print("Attempting restore from previous commit...")
              commits = subprocess.run(
                  ["git", "log", "--oneline", "-20"], capture_output=True, text=True
              ).stdout.splitlines()
              for line in commits:
                  sha = line.split()[0]
                  msg = " ".join(line.split()[1:])
                  if "heal:" in msg or "status" in msg.lower():
                      continue
                  r2 = subprocess.run(["git", "show", f"{sha}:data.json"], capture_output=True)
                  if r2.returncode == 0:
                      try:
                          json.loads(r2.stdout)
                          with open("data.json", "wb") as f:
                              f.write(r2.stdout)
                          print(f"Restored data.json from commit {sha}: {msg}")
                          break
                      except:
                          continue
          EOF

      # -- Re-scrape if needed -------------------------------------------------
      - name: Check cyclingflash.com reachability
        if: steps.status.outputs.need_scrape == 'true'
        id: reachability
        run: |
          python - <<'EOF'
          import urllib.request, os
          try:
              req = urllib.request.Request(
                  'https://cyclingflash.com/races.php?category=1&filter=Filter&p=uci&s=latest-results',
                  headers={'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'}
              )
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f'cyclingflash.com reachable -- HTTP {r.status}')
                  reachable = True
          except Exception as e:
              print(f'cyclingflash.com unreachable from GitHub Actions: {e}')
              reachable = False
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'reachable={"true" if reachable else "false"}\n')
          EOF

      - name: Run scraper
        if: steps.status.outputs.need_scrape == 'true' && steps.reachability.outputs.reachable == 'true'
        run: |
          echo "Data needs refresh (age=${{ steps.status.outputs.age_hours }}h)"
          cp data.json data_old.json 2>/dev/null || echo '{}' > data_old.json
          python scraper.py --results-only
          python detect_changes.py data_old.json data.json changelog.json
          rm -f data_old.json

      - name: Skip scraper (cyclingflash.com unreachable from CI)
        if: steps.status.outputs.need_scrape == 'true' && steps.reachability.outputs.reachable == 'false'
        run: echo "cyclingflash.com is not reachable from GitHub Actions -- scrape must run from your local machine."

      - name: Skip scrape (data is fresh)
        if: steps.status.outputs.need_scrape == 'false'
        run: echo "Data is fresh (${{ steps.status.outputs.age_hours }}h old) -- skipping scrape."

      # -- Write CI status.json ------------------------------------------------
      - name: Write CI status.json
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import datetime, timezone

          errors = []
          warnings = []
          info = {}

          if not os.path.exists("data.json"):
              errors.append("data.json missing after scrape")
          else:
              size_kb = os.path.getsize("data.json") // 1024
              info["data_size_kb"] = size_kb
              try:
                  data = json.load(open("data.json"))
                  for key in ("upcoming", "recent", "teams"):
                      n = len(data.get(key, []))
                      info[f"data_{key}"] = n
                      if n == 0:
                          warnings.append(f"data.json has no {key}")
                  info["rider_profiles"] = len(data.get("rider_profiles", {}))
                  live_count = len(data.get("live", []))
                  info["live_races"] = live_count
                  scraped = data.get("scraped_at", "")
                  info["scraped_at"] = scraped
                  if scraped:
                      dt = datetime.fromisoformat(scraped.replace("Z", "+00:00"))
                      age_h = (datetime.now(timezone.utc) - dt).total_seconds() / 3600
                      info["data_age_hours"] = round(age_h, 1)
                      # Tighter window whenever a race is actually live -- see
                      # matching note in the "Read status.json" step above.
                      # Off-season (no live race), keep the old lenient window
                      # since there's genuinely nothing new to miss.
                      err_at  = 20  if live_count > 0 else 168
                      warn_at = 8   if live_count > 0 else 48
                      if age_h > err_at:
                          errors.append(
                              f"data.json is {age_h:.0f}h old ({'a live race is running' if live_count else 'off-season'}) "
                              f"-- run scraper.py locally"
                          )
                      elif age_h > warn_at:
                          warnings.append(
                              f"data.json is {age_h:.0f}h old ({'a live race is running' if live_count else 'off-season'}) "
                              f"-- consider running scraper.py"
                          )
              except json.JSONDecodeError as e:
                  errors.append(f"data.json invalid JSON: {e}")

          if os.path.exists("index.html"):
              sz = os.path.getsize("index.html")
              info["index_html_bytes"] = sz
              if sz < 80_000:
                  errors.append(f"index.html too small: {sz} bytes")
          else:
              errors.append("index.html missing")

          # -- scrape_log.json: catches "scraper exited 0 but is silently
          # blind to real results" -- the class of bug that data_age_hours
          # alone can't see (a stage-4-missing run still looks "fresh" if
          # it ran on schedule, just found nothing). Written by
          # main_results_only() in scraper.py on every --results-only run.
          if os.path.exists("scrape_log.json"):
              try:
                  slog = json.load(open("scrape_log.json"))
                  races = slog.get("races", [])
                  info["scrape_log_run_at"] = slog.get("run_at")
                  fetch_err_races  = [r["slug"] for r in races
                                       if r.get("probe") and not r["probe"].get("fetch_ok")]
                  drift_races      = [r["slug"] for r in races
                                       if r.get("probe") and r["probe"].get("possible_parser_drift")]
                  if fetch_err_races:
                      warnings.append(
                          f"scrape_log.json: could not fetch next-stage probe for {fetch_err_races} "
                          f"-- network/HTTP issue, not necessarily a bug"
                      )
                  if drift_races:
                      for r in races:
                          if r["slug"] in drift_races:
                              p = r["probe"]
                              errors.append(
                                  f"scrape_log.json: possible PARSER DRIFT on {r['slug']} stage "
                                  f"{p['stage_num']} -- page fetched fine ({p.get('response_bytes',0)} "
                                  f"bytes) but no results table matched for {p.get('stall_attempts')} "
                                  f"consecutive runs over {p.get('stall_hours')}h "
                                  f"(since {p.get('stall_since')}). Site markup may have changed."
                              )
              except Exception as e:
                  warnings.append(f"scrape_log.json unreadable: {e}")
          else:
              info["scrape_log_run_at"] = None

          overall = "error" if errors else ("warning" if warnings else "ok")
          status = {
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "source": "ci",
              "overall": overall,
              "errors": errors,
              "warnings": warnings,
              "repairs": [],
              "data": info,
          }
          with open("status.json", "w") as f:
              json.dump(status, f, indent=2)

          print(f"STATUS: {overall.upper()}")
          for e in errors:   print(f"  x {e}")
          for w in warnings: print(f"  ! {w}")

          # Don't sys.exit(1) here -- that would skip the commit and notify
          # steps below (no `if: always()` upstream of them historically
          # meant an error run never even got its status.json committed).
          # Job failure (for the Actions red-X / default GH email) happens
          # in a dedicated last step instead, after commit+notify have run.
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"overall={overall}\n")
          EOF
        id: write_status

      # -- Commit and push -----------------------------------------------------
      - name: Commit and push
        run: |
          git add data.json changelog.json status.json scrape_log.json 2>/dev/null || git add data.json changelog.json status.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "heal(ci): auto-repair ${TIMESTAMP}"
            git push
          fi

      # -- Notify: open/update/close a GitHub Issue on status changes ---------
      # This is the actual "tell me" channel -- GitHub emails repo watchers
      # on issue open/comment by default, which is more reliable than relying
      # on the user's personal Actions-failure-email settings. Dedups against
      # a single open issue by exact title instead of spamming a new one
      # every run; auto-closes with a resolved comment once healthy again.
      - name: Notify via GitHub Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OVERALL: ${{ steps.write_status.outputs.overall }}
        run: |
          python - <<'EOF'
          import json, os, subprocess
          from datetime import datetime, timezone

          overall = os.environ.get("OVERALL", "unknown")
          TITLE = "Health check failing"

          def gh(*args):
              return subprocess.run(["gh", *args], capture_output=True, text=True)

          existing = gh("issue", "list", "--state", "open", "--search", TITLE,
                         "--json", "number,title")
          issue_number = None
          if existing.returncode == 0:
              try:
                  for it in json.loads(existing.stdout or "[]"):
                      if it["title"] == TITLE:
                          issue_number = it["number"]
                          break
              except Exception as e:
                  print(f"could not parse issue list: {e}")

          status   = json.load(open("status.json")) if os.path.exists("status.json") else {}
          errors   = status.get("errors", [])
          warnings = status.get("warnings", [])
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          run_url = (f"{os.environ.get('GITHUB_SERVER_URL','https://github.com')}/"
                     f"{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/"
                     f"{os.environ.get('GITHUB_RUN_ID','')}")

          if overall == "error":
              lines = [f"**Status as of {now}:** ERROR", "", "**Errors:**"]
              lines += [f"- {e}" for e in errors] or ["- (none listed)"]
              if warnings:
                  lines += ["", "**Warnings:**"] + [f"- {w}" for w in warnings]
              lines += ["", f"[View run]({run_url})"]
              body = "\n".join(lines)

              if issue_number:
                  r = gh("issue", "comment", str(issue_number), "--body", body)
                  print(f"Updated existing issue #{issue_number}: {r.returncode}")
              else:
                  r = gh("issue", "create", "--title", TITLE, "--body", body)
                  print(f"Opened new issue: {r.returncode} {r.stdout}")
          elif issue_number:
              gh("issue", "comment", str(issue_number), "--body",
                 f"**Resolved as of {now}** -- status.json now shows `{overall}`.")
              r = gh("issue", "close", str(issue_number))
              print(f"Closed issue #{issue_number}: {r.returncode}")
          else:
              print("Healthy, no open issue to close")
          EOF

      # -- Fail the job if unhealthy (after commit+notify already ran) --------
      # Deliberately last: everything above (status.json commit, GitHub Issue)
      # must happen regardless of health, so this is the only step allowed to
      # actually fail the run.
      - name: Fail job if status is error
        if: always()
        run: |
          if [ "${{ steps.write_status.outputs.overall }}" = "error" ]; then
            echo "Health check status is ERROR -- failing job for visibility."
            exit 1
          fi
