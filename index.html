let statsData   = null;
let statsCurCat = 'palmares';
let statsOpenId = null;

const STAT_CATS = [
  ['palmares',    'Historical'],
  ['riders',      'Riders'],
  ['grandtours',  'Grand Tours'],
  ['monuments',   'Monuments'],
  ['teams',       'Teams'],
  ['nations',     'Nations'],
  ['races',       'Races'],
  ['major-tours', 'Major Tours'],
  ['climbs',      'Climbs'],
  ['gear',        'Gear'],
];

async function loadStats() {
  const el = document.getElementById('sec-stats');
  if (statsData) { if (!statsOpenId) setStatCat(statsCurCat); else renderStats(); return; }
  el.innerHTML = '<div class="stats-loading">⏳ Loading statistics…</div>';
  try {
    const r = await fetch('./pcs_stats.json', {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    statsData = await r.json();
  } catch(e) {
    el.innerHTML = `<div class="stats-loading">⚠️ Could not load stats<br><small>${esc(e.message)}</small></div>`;
    return;
  }
  // Load rider profiles so every rider row can show a national flag
  try { await loadRiderProfiles(); } catch(e) {}
  buildStatsNatLookup();
  setStatCat(statsCurCat); // auto-opens first card
}

function renderStats() {
  const el = document.getElementById('sec-stats');
  if (!statsData) return;
  const stats = statsData.stats || {};

  // Only show categories that have data -- 'palmares' is always shown since it
  // comes from a separate file (palmares.json) loaded lazily on demand, not
  // from pcs_stats.json like every other category here.
  const activeCats = STAT_CATS.filter(([c]) =>
    c === 'palmares' || Object.values(stats).some(s => s.category === c && s.row_count > 0)
  );

  // Fallback if current cat has no data
  if (!activeCats.some(([c]) => c === statsCurCat)) {
    statsCurCat = activeCats[0]?.[0] || 'riders';
  }

  const catBar = `<div class="stats-cat-bar">${
    activeCats.map(([c, label]) =>
      `<button class="stats-cat-btn${c===statsCurCat?' active':''}" onclick="setStatCat('${c}')">${label}</button>`
    ).join('')
  }</div>`;

  if (statsCurCat === 'palmares') {
    el.innerHTML = catBar + '<div id="palmares-body">' + renderPalmaresBody() + '</div>';
    if (!palmaresData) loadPalmaresData();
    return;
  }

  const entries = Object.entries(stats)
    .filter(([, s]) => s.category === statsCurCat && s.row_count > 0)
    .sort((a, b) => a[1].label.localeCompare(b[1].label));

  const cards = entries.map(([id, s]) => {
    const open = id === statsOpenId;
    const chevron = open ? '▲' : '▼';
    const bodyId  = 'sb-' + id.replace(/\W/g,'-');
    const body    = open ? buildStatTable(s) : '';
    return `<div class="stat-card">
  <div class="stat-card-hdr" onclick="toggleStat('${esc(id)}')">
    <div>
      <div class="stat-card-title">${esc(s.label)}</div>
      <div class="stat-card-meta">${s.row_count} entries${s.notes ? ' · ' + esc(s.notes) : ''}</div>
    </div>
    <span style="color:var(--muted);font-size:.8rem">${chevron}</span>
  </div>
  <div class="stat-card-body${open?' open':''}" id="${bodyId}">${body}</div>
</div>`;
  }).join('');

  el.innerHTML = catBar + (cards ||
    '<div class="stats-loading">No data in this category</div>');
}

function setStatCat(cat) {
  statsCurCat = cat;
  statsOpenId = null;
  // Auto-open the first card in the new category
  const stats = (statsData || {}).stats || {};
  const first = Object.entries(stats)
    .filter(([, s]) => s.category === cat && s.row_count > 0)
    .sort((a, b) => a[1].label.localeCompare(b[1].label))[0];
  if (first) statsOpenId = first[0];
  renderStats();
}

function toggleStat(id) {
  statsOpenId = statsOpenId === id ? null : id;
  renderStats();
}

// Slug -> nationality lookup so every rider in the Stats tables gets a flag.
// Combines current team rosters (appData.teams) with the full rider_profiles.json
// set, so historical/all-time riders not on a current roster still resolve.
let statsNatBySlug = null;
function buildStatsNatLookup() {
  const m = {};
  for (const t of (appData.teams || []))
    for (const r of (t.riders || []))
      if (r.slug && (r.nat || r.nat_code)) m[r.slug] = (r.nat || r.nat_code);
  const rp = riderProfilesData || {};
  for (const slug in rp) {
    const n = rp[slug] && (rp[slug].nat || rp[slug].nat_code);
    if (n && !m[slug]) m[slug] = n;
  }
  statsNatBySlug = m;
  return m;
}
function natFor(slug) {
  if (!slug) return '';
  const m = statsNatBySlug || buildStatsNatLookup();
  return m[slug] || '';
}

function buildStatTable(s) {
  const rows = s.rows || [];
  if (!rows.length) return '<p style="padding:10px;color:var(--muted)">No data</p>';

  // Columns: skip internal keys, keep useful ones
  const skip = new Set(['type', 'slug', 'section',
    'rider1_slug','rider2_slug','race_slug','rider_slug']);
  const first = rows[0];
  const cols = Object.keys(first).filter(k => !skip.has(k));

  // Header row
  const ths = cols.map(c => `<th>${esc(c.replace(/_/g,' '))}</th>`).join('');

  // Filter out women's riders
  const WOMEN_SLUGS = new Set(['marianne-vos','annemiek-van-vleuten','anna-van-der-breggen','demi-vollering','lotte-kopecky','elisa-longo-borghini','lorena-wiebes','marlen-reusser','elisa-balsamo','yara-kastelijn','mischa-bredewold','karlijn-swinkels','elise-chabbey','cedrine-kerbaol','franziska-koch','noemi-ruegg','judith-arndt','shari-bossuyt','paula-blasi','femke-de-vries','celia-gery','carys-lloyd','ally-wollaston','petra-stiasny','dominika-wlodarczyk','zoe-backstedt','deska-raya-adya']);
  const filteredRows = rows.filter(r => !r.slug || r.type !== 'rider' || !WOMEN_SLUGS.has(r.slug));
  // Data rows (cap at 50)
  const trs = filteredRows.slice(0, 50).map(r => {
    const tds = cols.map(c => {
      let v = r[c] ?? '';
      // Rider name columns: prepend a national flag + open in-app modal on click
      if (c === 'name' && r.slug && r.type === 'rider') {
        return `<td><span class="stat-name">${flag(natFor(r.slug))}<a href="#" onclick="openRiderModal('${esc(r.slug)}');return false;">${esc(String(v))}</a></span></td>`;
      }
      if ((c === 'rider1_name' || c === 'rider2_name') && r[c.replace('_name','_slug')]) {
        const slug = r[c.replace('_name','_slug')];
        return `<td><span class="stat-name">${flag(natFor(slug))}<a href="#" onclick="openRiderModal('${esc(slug)}');return false;">${esc(String(v))}</a></span></td>`;
      }
      if (c === 'rider_name' && r.rider_slug) {
        return `<td><span class="stat-name">${flag(natFor(r.rider_slug))}<a href="#" onclick="openRiderModal('${esc(r.rider_slug)}');return false;">${esc(String(v))}</a></span></td>`;
      }
      // Unlinked rider/name columns: still show a flag if a slug can be resolved
      const nameCol = (c === 'name' && r.type === 'rider') || c === 'rider_name' || c === 'rider1_name' || c === 'rider2_name';
      if (nameCol) {
        const s2 = r.slug || r.rider_slug || r.rider1_slug || r.rider2_slug || '';
        return `<td><span class="stat-name">${flag(natFor(s2))}<span>${esc(String(v))}</span></span></td>`;
      }
      return `<td>${esc(String(v))}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');

  return `<table class="stat-tbl"><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
}

// ── Palmares / History tab ──────────────────────────────────────────────────────
// Historical winner lists (Grand Tours, Monuments, Major Tours, Championships,
// Top Classics) sourced from procyclingstats.com and stored in palmares.json.
// Loaded lazily -- separate fetch from pcs_stats.json so a slow/failed
// palmares.json load never blocks the rest of the Stats tab, and vice versa.
let palmaresData = null;
let palmaresCurRace = null;
let palmaresCurClass = 'gc'; // 'gc' | 'points' | 'kom' | 'youth' -- only relevant for stage races
const PALMARES_CAT_ORDER = ['grand-tour', 'monument', 'major-tour', 'championship', 'classic'];
const PALMARES_CLASS_LABELS = {gc: 'GC', points: 'Points', kom: 'KOM', youth: 'Young Rider'};

// scrape_palmares.py's newer runs write races as {classifications:{gc,points,kom,youth}},
// but a race scraped before that rewrite (or not yet re-run at all) still has the
// older flat {editions:[...]} shape -- these two helpers read either shape so the
// UI doesn't go blank for races the user hasn't re-scraped yet.
function palmaresEditionsFor(race, cls) {
  if (!race) return [];
  if (race.classifications) return race.classifications[cls] || [];
  return cls === 'gc' ? (race.editions || []) : [];
}
function palmaresEditionCount(race) {
  if (!race) return 0;
  if (race.classifications) return (race.classifications.gc || []).length;
  return race.edition_count || (race.editions || []).length;
}

async function loadPalmaresData() {
  const body = document.getElementById('palmares-body');
  if (body) body.innerHTML = renderPalmaresBody();
  try {
    const r = await fetch('./palmares.json?t=' + Date.now(), {cache: 'no-cache'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    palmaresData = await r.json();
  } catch(e) {
    if (body) body.innerHTML = `<div class="stats-loading">⚠️ Could not load historical results<br><small>${esc(e.message)}</small></div>`;
    return;
  }
  const races = palmaresData.races || {};
  if (!palmaresCurRace || !races[palmaresCurRace]) {
    palmaresCurRace = races['tour-de-france'] ? 'tour-de-france' : Object.keys(races)[0];
  }
  if (body) body.innerHTML = renderPalmaresBody();
}

function renderPalmaresBody() {
  if (!palmaresData) return '<div class="stats-loading">⏳ Loading historical results…</div>';

  const races = palmaresData.races || {};
  const catLabels = palmaresData.category_labels || {};
  const bySlug = Object.entries(races);

  const raceNav = PALMARES_CAT_ORDER.map(cat => {
    const inCat = bySlug.filter(([, r]) => r.category === cat);
    if (!inCat.length) return '';
    const label = catLabels[cat] || cat;
    const btns = inCat.map(([slug, r]) => {
      const has = palmaresEditionCount(r) > 0;
      const active = slug === palmaresCurRace;
      return `<button class="stats-cat-btn${active ? ' active' : ''}"${has ? '' : ' disabled style="opacity:.4;cursor:default"'} onclick="setPalmaresRace('${esc(slug)}')">${esc(r.name)}${has ? '' : ' (soon)'}</button>`;
    }).join('');
    return `<div style="margin-bottom:6px"><div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 4px">${esc(label)}</div><div class="stats-cat-bar" style="margin:0">${btns}</div></div>`;
  }).join('');

  const race = races[palmaresCurRace];
  const isStageRace = !!(race && race.is_stage_race);
  const cls = isStageRace ? palmaresCurClass : 'gc';

  const classBar = isStageRace
    ? `<div class="stats-cat-bar" style="margin:6px 0 10px">${
        Object.entries(PALMARES_CLASS_LABELS).map(([key, label]) =>
          `<button class="stats-cat-btn${key === cls ? ' active' : ''}" onclick="setPalmaresClass('${key}')">${label}</button>`
        ).join('')
      }</div>`
    : '';

  const editions = palmaresEditionsFor(race, cls);

  let tableHtml = '<p style="padding:10px;color:var(--muted)">Select a race above</p>';
  if (race && editions.length) {
    const rows = editions.map(ed => {
      const podiumCells = [1, 2, 3].map(rank => {
        const p = (ed.podium || []).find(x => x.rank === rank);
        if (!p || !p.name) return '<td style="color:var(--muted)">—</td>';
        const flagHtml = flag(p.nat || natFor(p.slug));
        const link = p.slug
          ? `<a href="#" onclick="openRiderModal('${esc(p.slug)}');return false;" style="color:var(--rider-name);text-decoration:underline">${esc(p.name)}</a>`
          : esc(p.name);
        return `<td><span style="display:flex;align-items:center;gap:6px">${flagHtml}${link}</span></td>`;
      }).join('');
      return `<tr><td>${ed.year}</td>${podiumCells}</tr>`;
    }).join('');
    tableHtml = `<table class="stat-tbl"><thead><tr><th>Year</th><th>1st</th><th>2nd</th><th>3rd</th></tr></thead><tbody>${rows}</tbody></table>`;
  } else if (race) {
    tableHtml = `<p style="padding:10px;color:var(--muted)">${
      isStageRace && cls !== 'gc'
        ? 'No recorded ' + esc(PALMARES_CLASS_LABELS[cls]) + ' data for this race yet'
        : "Historical results for this race haven't been backfilled yet"
    }</p>`;
  }

  const meta = race
    ? `<div class="stat-card-meta">${palmaresEditionCount(race)} editions${race.first_edition ? ' · since ' + race.first_edition : ''}</div>`
    : '';
  const raceCard = race
    ? `<div class="stat-card">
  <div class="stat-card-hdr" style="cursor:default">
    <div>
      <div class="stat-card-title">${esc(race.name)}${isStageRace ? ' — ' + esc(PALMARES_CLASS_LABELS[cls]) : ''}</div>
      ${meta}
    </div>
  </div>
  <div class="stat-card-body open">${tableHtml}</div>
</div>`
    : '';

  return raceNav + classBar + raceCard;
}

function setPalmaresRace(slug) {
  palmaresCurRace = slug;
  palmaresCurClass = 'gc';
  const body = document.getElementById('palmares-body');
  if (body) body.innerHTML = renderPalmaresBody();
}

function setPalmaresClass(cls) {
  palmaresCurClass = cls;
  const body = document.getElementById('palmares-body');
  if (body) body.innerHTML = renderPalmaresBody();
}

let appData = {};

async function loadData(force=false) {
  try {
    // Always bust the HTTP cache, not just on manual refresh -- data.json can
    // change several times a day, and a plain './data.json' request can be
    // served straight from the browser's disk cache (within GitHub Pages'
    // Cache-Control window) even though the service worker's fetch handler
    // intends to always hit the network. That silently showed stale race
    // data (e.g. a newly-added race missing) for as long as the cached
    // response stayed valid, with no visible error.
    const url = './data.json?t=' + Date.now();
    const opts = {cache:'no-store'};
    const r = await fetch(url, opts);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    appData = await r.json();
    mergeExtraTeams();   // inject Tour teams missing from data.json (e.g. Q36.5) before any render
    mergeExtraRaces();   // inject Tour de l'Ain (2.1) -- CI never scrapes Europe Tour races
    document.getElementById('last-updated').textContent = `Updated ${appData.scraped_at_human || '—'}`;
    renderDataHealth();
    document.getElementById('loading').style.display = 'none';
    document.querySelectorAll('.section').forEach(s => s.style.display = '');
    renderLive(appData.live || []);
    renderUpcoming(appData.upcoming || []);
    renderRecent(appData.recent || []);
    await Promise.all([loadTourBibs(), riderPhotosReady]);  // bibs + photos ready before teams render
    // A Grand Tour (live or finished) has no startlist array of its own; its
    // Riders list is reconstructed from tour_bibs.json (loaded just above) +
    // team rosters, so re-render live and recent now that bibs are in —
    // otherwise the Riders button/count would be missing on the first paint
    // (these ran before bibs loaded). Teams tab bib visibility also depends on
    // tourBibsActive(), which needs the bibs meta loaded.
    renderLive(appData.live || []);
    renderRecent(appData.recent || []);
    renderTeams(appData.teams || []);
    // Full rider profiles add birth dates + more photos; load in the background
    // and re-render teams once ready so it isn't blocked on the big file.
    loadRiderProfiles().then(() => renderTeams(appData.teams || [])).catch(() => {});
    buildRiderCosts();
    if (currentTab === 'fantasy') renderFantasy();
    const defaultTab = (appData.live||[]).length ? 'live' : 'upcoming';
    showSec(defaultTab, document.getElementById('nav-' + defaultTab));
  } catch(e) {
    document.getElementById('loading').innerHTML =
      `<div style="text-align:center;color:var(--muted)">⚠️ Could not load race data<br><small>${esc(e.message)}</small></div>`;
  }
}

async function refreshData() {
  const btn = document.querySelector('.refresh-btn');
  btn.textContent = '⏳';
  await loadData(true);
  btn.textContent = '↻';
}

function _urlB64ToUint8(b64){
  const pad='='.repeat((4-b64.length%4)%4);
  const b=(b64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b);
  return new Uint8Array([...raw].map(c=>c.charCodeAt(0)));
}

function _notifSupported(){return 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;}

function _updateNotifBtn(){
  const btn=document.getElementById('notif-btn');if(!btn)return;
  if(!_notifSupported()){btn.style.display='none';return;}
  const p=Notification.permission;
  btn.title=p==='granted'?'Notifications on — tap to save subscription file':p==='denied'?'Notifications blocked in browser settings':'Enable push notifications';
  btn.style.color=p==='granted'?'var(--upcoming)':p==='denied'?'var(--live)':'var(--muted)';
  btn.style.borderColor=p==='granted'?'var(--upcoming)':'var(--border)';
}

async function toggleNotifications(){
  if(!_notifSupported()){alert('Push notifications are not supported in this browser or on file:// URLs. Open the app via a web server.');return;}
  const p=await Notification.requestPermission();

  if(p!=='granted'){alert('Notifications blocked — you can re-enable them in your browser settings.');return;}
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();

// ── Background auto-refresh every 30 minutes ─────────────────────────────────
let _lastScrapedAt = '';
async function silentCheck() {
  try {
    const r = await fetch('./data.json?t=' + Date.now(), {cache: 'no-cache'});
    if (!r.ok) return;
    const d = await r.json();
    if (d.scraped_at && d.scraped_at !== _lastScrapedAt) {
      // Detect newly completed stages since last check
      const prevLive = appData.live || [];
      const prevUpcoming = appData.upcoming || [];
      const prevWinners = new Set();
      for(const race of prevLive) for(const s of (race.stages||[])) if(s.winner) prevWinners.add(`${race.slug}-${s.num}`);

      appData = d;
      _lastScrapedAt = d.scraped_at;
      document.getElementById('last-updated').textContent = `Updated ${d.scraped_at_human || '—'}`;
      renderDataHealth();
      renderLive(appData.live || []);
      renderUpcoming(appData.upcoming || []);
      renderRecent(appData.recent || []);

      // Fire in-app notification for each new stage result
      const followed = followLoad();
      const followedSlugs = new Map(followed.map(f => [f.slug, f.name]));
      for(const race of (d.live||[])){
        for(const s of (race.stages||[])){
          const key=`${race.slug}-${s.num}`;
          if(s.winner && !prevWinners.has(key)){
            // Check if winner is a followed rider (match by slug from top10)
            const winnerSlug = (s.top10 && s.top10[0])
              ? (s.top10[0].rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim() : '';
            const followedName = winnerSlug ? followedSlugs.get(winnerSlug) : null;
            if (followedName) {
              _fireInAppNotif(`🌟 ${followedName} wins!`,`${race.name} — Stage ${s.num}`,`followed-stage-${key}`);
            } else {
              _fireInAppNotif(`🏁 ${race.name} — Stage ${s.num}`,`${s.winner} wins`,`stage-${key}`);
            }
          }
        }
      }
      // Also check for followed riders in new top-10 positions (non-stage-win)
      for(const race of (d.live||[])){
        for(const s of (race.stages||[])){
          const key=`${race.slug}-${s.num}`;
          if(!prevWinners.has(key) && s.top10){
            for(let i=1; i<Math.min(s.top10.length,10); i++){
              const r = s.top10[i];
              const rSlug = (r.rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim();
              if(followedSlugs.has(rSlug)){
                _fireInAppNotif(`📍 ${followedSlugs.get(rSlug)} — P${i+1}`,`${race.name} Stage ${s.num}`,`followed-top10-${key}-${rSlug}`);
              }
            }
          }
        }
      }
      // Also notify about races going live today
      for(const race of (d.live||[])){
        const prevRaceSlugs=new Set(prevLive.map(r=>r.slug));
        if(!prevRaceSlugs.has(race.slug)){
          _fireInAppNotif(`🚴 ${race.name} has started`,`${race.total_stages} stages · ${race.category}`,'race-live-'+race.slug);
        }
      }
      // Notify when a startlist becomes newly available for any upcoming race
      const prevSlMap=new Map(prevLive.concat(prevUpcoming).map(r=>[r.slug||r.cf_slug,(r.startlist||[]).length]));
      for(const race of [...(d.live||[]),...(d.upcoming||[])]){
        const key=race.slug||race.cf_slug;
        const prevCount=prevSlMap.get(key)??-1;
        const newCount=(race.startlist||[]).length;
        if(prevCount===0&&newCount>0){
          _fireInAppNotif(`👥 Startlist published`,`${race.name} · ${newCount} riders`,'startlist-'+key);
        }
      }

      showBanner('📡 New race data loaded');
    }
  } catch(e) {}
}

// ── Data update health (expected update time + missing/late detector) ──────────
// scrape.yml runs the results-only scraper at 11:00 & 17:00 UTC daily -- this is
// the reliable core schedule (fires from GitHub Actions regardless of whether
// Cowork or the local machine are running). We use it to predict the next
// expected update and flag when a scheduled slot has passed without fresh data
// landing -- see incident 2026-07-01/02 where data.json went stale 169h with no
// visible signal until someone thought to check GitHub Actions manually.
const UPDATE_SCHEDULE_UTC_HOURS = [11, 17];
const UPDATE_GRACE_MIN = 45; // minutes after a scheduled slot before flagging late
// Matches heal.py's own DATA_WARN_HOURS/DATA_ERROR_HOURS thresholds so the
// in-app badge and the watchdog agree on what counts as a real problem.
const HEALTH_WARN_HOURS = 26;
const HEALTH_ERROR_HOURS = 72;

function fmtDuration(ms) {
  if (ms < 0) ms = 0;
  const mins = Math.floor(ms / 60000);
  const days = Math.floor(mins / 1440);
  const hrs = Math.floor((mins % 1440) / 60);
  const m = mins % 60;
  if (days > 0) return `${days}d ${hrs}h`;
  if (hrs > 0) return `${hrs}h ${m}m`;
  return `${m}m`;
}

function computeUpdateSlots(now) {
  // Candidate slots across yesterday/today/tomorrow so we always have a
  // most-recent-past slot and a soonest-future slot relative to `now`.
  const slots = [];
  for (let dayOffset = -1; dayOffset <= 1; dayOffset++) {
    for (const h of UPDATE_SCHEDULE_UTC_HOURS) {
      slots.push(new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + dayOffset, h, 0, 0)));
    }
  }
  slots.sort((a, b) => a - b);
  let recent = null, next = null;
  for (const s of slots) {
    if (s <= now) recent = s;
    if (s > now && !next) next = s;
  }
  return { recent, next };
}

function computeDataHealth(scrapedAtISO) {
  if (!scrapedAtISO) return null;
  const lastScrape = new Date(scrapedAtISO);
  if (isNaN(lastScrape)) return null;
  const now = new Date();
  const { recent, next } = computeUpdateSlots(now);
  const graceMs = UPDATE_GRACE_MIN * 60000;
  // "Late" means a scheduled slot has already passed (plus grace) but the
  // last successful scrape happened before that slot was due to run.
  const isLate = !!recent && lastScrape < recent && (now - recent) > graceMs;
  const ageMs = now - lastScrape;
  const ageHours = ageMs / 3600000;
  let severity = 'ok';
  if (isLate) severity = ageHours > HEALTH_ERROR_HOURS ? 'error' : 'warn';
  return { lastScrape, recent, next, isLate, severity, ageMs, ageHours };
}

let _healthState = null;
function renderDataHealth() {
  const el = document.getElementById('data-health');
  if (!el) return;
  const h = computeDataHealth(appData.scraped_at);
  _healthState = h;
  if (!h) { el.textContent = ''; el.className = 'data-health'; return; }
  const timeOpts = { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Madrid' };
  if (h.isLate) {
    el.className = 'data-health ' + (h.severity === 'error' ? 'health-error' : 'health-warn');
    el.textContent = ` ⚠ ${fmtDuration(h.ageMs)} since update (expected ~${h.recent.toLocaleTimeString([], timeOpts)})`;
  } else {
    el.className = 'data-health health-ok';
    el.textContent = h.next ? ` · next ~${h.next.toLocaleTimeString([], timeOpts)}` : '';
  }
}

let _healthStatusJson = null;
async function fetchHealthStatus() {
  try {
    const r = await fetch('./status.json?t=' + Date.now(), { cache: 'no-store' });

function buildHealthDetailHTML() {
  const h = _healthState;

    rows += `<div class="hd-row"><span>Update schedule</span><span>~11:00 &amp; 17:00 UTC daily (Madrid time below)</span></div>`;
    rows += `<div class="hd-row"><span>Next expected</span><span>${h.next ? h.next.toLocaleTimeString([], timeOpts) : '—'}</span></div>`;
    rows += `<div class="hd-row"><span>Status</span><span>${h.isLate ? `⚠ overdue since ~${h.recent.toLocaleTimeString([], timeOpts)}` : '✅ on schedule'}</span></div>`;

function followRider(slug, name, nat) {

  followSave(followLoad().filter(f => f.slug !== slug));
  if (currentTab === 'following') renderFollowing();

  if (btn && btn.dataset.slug === slug) {

    btn.classList.remove('following');

  }

function _followRiderStatus(slug) {
  // Returns { raceName, stageNum, pos, winner } or null for the most recent result
  let latest = null;
  for (const race of [...(appData.live || []), ...(appData.recent || [])]) {
    for (const s of (race.stages || [])) {
      const top10 = s.top10 || [];
      const idx = top10.findIndex(r => {
        const rSlug = (r.rider_url || '').replace('/profile/', '').replace(/^\/+/, '').trim();
        return rSlug === slug;
      });
      if (idx >= 0) {
        latest = { raceName: race.name, stageNum: s.num, pos: idx + 1, winner: idx === 0 };
      }
    }
    // Also check single-day races
    const top10 = race.top10 || [];
    const idx = top10.findIndex(r => {
      const rSlug = (r.rider_url || '').replace('/profile/', '').replace(/^\/+/, '').trim();
      return rSlug === slug;
    });
    if (idx >= 0 && !latest) {
      latest = { raceName: race.name, stageNum: null, pos: idx + 1, winner: idx === 0 };
    }
  }
  return latest;
}

function _followInLive(slug) {
  // Is this rider currently listed in any live race (startlist)
  for (const race of (appData.live || [])) {
    const inSl = (race.startlist || []).some(r =>
      (r.slug || (r.rider_url || '').replace('/profile/', '').replace(/^\/+/, '').trim()) === slug
    );
    if (inSl) return race.name;
  }
  return null;
}

// ── Fantasy League ─────────────────────────────────────────────────────────────

const FANTASY_LEAGUE_KEY = 'fantasy_league';
const FANTASY_DRAFT_KEY  = 'fantasy_draft';
const ICLAUDIUS_KEY      = 'iclaudius_teams';  // {raceKey: I Claudius team}
// Squad size varies by race type: one-day races (total_stages===1) get a
// tight 3-rider squad -- the aim is to nail the actual podium, not spread
// bets across 7-8 riders the way a multi-day race rewards. Grand Tours (>=21
// stages) get 8, all other stage races get 7.
function maxSquad(raceKey) {
  const k = raceKey || fantasyGetRace();
  const race = [...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===k);
  const stages = race ? (race.total_stages||0) : 0;
  if (stages === 1) return 3;
  return stages >= 21 ? 8 : 7;
}
const FANTASY_BUDGET_DEFAULT = 100;   // credit budget ceiling — full-strength WorldTour fields land here
const COST_FLOOR    = 4;      // cheapest rider
const COST_CEIL     = 22;     // most expensive rider (sqrt-scaled from race results)
const TRANSFERS_TOTAL = 3;    // free rider swaps per team per race
const STAGE_PTS = {1:25,2:12,3:8,4:3,5:3,6:3,7:3,8:3,9:3,10:3};
const GC_PTS    = {1:50,2:30,3:20,4:8,5:8,6:8,7:8,8:8,9:8,10:8};
const JERSEY_PTS = 15;

let _fPicked = [];
let _fSwapOut = null;
let _riderCosts = {};   // name → credit cost

function buildRiderCosts(){
  // All keys stored as normName() so riderCost() lookup is case/punctuation-insensitive.
  // Both "Firstname Surname" and "SURNAME Firstname" orderings are indexed so PCS startlist
  // names match CyclingFlash result names regardless of word order.
  const scores={};
  const add=(name,pts)=>{if(!name)return;const k=normName(name);scores[k]=(scores[k]||0)+pts;};
  for(const section of ['recent','live','upcoming']){
    for(const race of (appData[section]||[])){
      for(const stage of (race.stages||[])){
        for(const r of (stage.top10||[])) add(r.name,STAGE_PTS[r.rank]||0);
      }
      // Same real-field fix as computePoints() -- see the 2026-07-12 comment
      // there. race.classifications never existed; costs were previously
      // built from stage points only.
      for(const r of (race.gc_top10||[])) add(r.name,GC_PTS[r.rank]||0);
      for(const key of ['points_top10','kom_top10','youth_top10']){
        const lst=race[key]||[];
        if(lst[0]) add(lst[0].name,JERSEY_PTS);
      }
    }
  }
  const maxPts=Math.max(...Object.values(scores),1);
  _riderCosts={};
  for(const [key,pts] of Object.entries(scores)){
    const cost=Math.max(COST_FLOOR,Math.round(COST_FLOOR+(COST_CEIL-COST_FLOOR)*Math.sqrt(pts/maxPts)));
    _riderCosts[key]=cost;
    const rev=key.split(' ').reverse().join(' ');
    if(rev!==key)_riderCosts[rev]=cost;
  }
}

function riderCost(name){ return _riderCosts[normName(name)]||COST_FLOOR; }
// Once a rider is picked onto a squad, fPickRider/fDoSwap stamp a `cost` field
// onto that rider object (frozen at the price on the day they were picked).
// riderCostFor() prefers that frozen value over the live-recomputed price, so a
// rider's in-race results (e.g. a Tour stage win) can't silently inflate an
// already-drafted squad's cost above budget mid-race. A brand-new pick (or a
// pick for a different race) has no frozen cost yet, so it falls back to the
// current live price -- which is exactly the "picked again elsewhere uses
// updated cost" behaviour that's wanted.
function riderCostFor(r){
  if(r&&typeof r==='object'&&typeof r.cost==='number') return r.cost;
  return riderCost((r&&r.name)||r);
}
function squadCost(riders){ return riders.reduce((s,r)=>s+riderCostFor(r),0); }

// A flat 100cr budget is meaningless in a weak field where every rider sits
// near COST_FLOOR (e.g. Tour of Qinghai Lake, where the big WorldTour names
// simply aren't entered) -- there's no real budget decision being made if a
// full squad of "premium" picks still only costs 30cr. Scale the budget to
// roughly 1.4x what an average full squad would cost for THIS race's actual
// confirmed startlist, so allocating your budget stays a meaningful
// constraint regardless of how strong the field is. Only ever scales DOWN
// from the default -- a stacked Grand Tour field should land close to the
// original 100cr anyway, and we don't want to inflate budgets past what
// players are used to.
function raceBudget(raceKey){
  const k=raceKey||fantasyGetRace();
  const race=[...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===k);
  const sl=race&&race.startlist&&race.startlist.length?race.startlist:null;
  if(!sl) return FANTASY_BUDGET_DEFAULT;
  const costs=sl.map(r=>riderCost(r.name)).filter(Number.isFinite);
  if(!costs.length) return FANTASY_BUDGET_DEFAULT;
  const avg=costs.reduce((a,b)=>a+b,0)/costs.length;
  const squadSize=maxSquad(k);
  const scaled=Math.round(avg*squadSize*1.4/5)*5;   // round to nearest 5cr
  return Math.max(COST_FLOOR*squadSize, Math.min(FANTASY_BUDGET_DEFAULT, scaled));
}
// Prefers a squad's own frozen budget (stamped at fCreateTeam() time) over
// the live raceBudget() recompute -- same reasoning as riderCostFor()
// preferring a rider's frozen .cost: without this, a squad drafted when the
// field looked weak (low budget) could later get retroactively penalized
// if new startlist riders push the live-recomputed budget in either
// direction after the fact.
function teamBudget(team,raceKey){
  if(team&&typeof team.budget==='number') return team.budget;
  return raceBudget(raceKey);
}

function costColor(c){
  if(c>=18) return '#ef4444';   // red — premium
  if(c>=12) return '#f97316';   // orange — mid-tier
  if(c>=8)  return '#eab308';   // yellow — value
  return 'var(--muted)';         // grey — budget
}
function costBadge(r){
  const c=riderCostFor(r);
  return '<span style="font-size:.72rem;font-weight:700;color:'+costColor(c)+';background:rgba(0,0,0,.25);border-radius:4px;padding:1px 5px;min-width:22px;text-align:center">'+c+'</span>';
}

const FANTASY_TEAMS_KEY  = 'fantasy_race_teams';   // {raceKey: team}
const FANTASY_ACTIVE_KEY = 'fantasy_active_race';  // currently viewed race key

function _raceKey(r){return r?(r.slug||r.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''):'';}
// "recent" alone isn't reliable -- the scraper can flip a race's status to
// "recent" (purely date-based: end_date < today) in the same run that its
// final stage results haven't been fetched yet yet (observed: Sibiu Cycling
// Tour sitting at status:"recent", stages_completed:3 of 4). Cross-check
// stages_completed against total_stages so "complete" actually means the
// final results are in, not just that the calendar date has passed.
function raceIsComplete(race){
  if(!race) return false;
  const total=race.total_stages||1;
  const done=race.stages_completed||0;
  return race.status==='recent' && done>=total;
}
function _autoRace(){
  const races=[...(appData.live||[]),...(appData.upcoming||[])];
  for(const r of races){const k=_raceKey(r);if(k)return k;}
  return '';
}
function fantasyLoadAll(){try{const s=localStorage.getItem(FANTASY_TEAMS_KEY);if(s)return JSON.parse(s);}catch(e){}return {};}
function fantasySaveAll(d){localStorage.setItem(FANTASY_TEAMS_KEY,JSON.stringify(d));}
function fantasyGetRace(){const k=localStorage.getItem(FANTASY_ACTIVE_KEY)||'';return k||_autoRace();}
function fantasySetRace(k){localStorage.setItem(FANTASY_ACTIVE_KEY,k);}
// One-time migration for squads saved before per-rider cost freezing existed:
// stamp today's live price onto any rider still missing a `.cost` field and
// persist it, so from this point on their price stops moving with the rider's
// live results. (We can't recover the *original* draft-day price for these
// older squads -- appData isn't versioned/dated far enough back for that --
// so this locks in today's number as the new frozen baseline.)
function _freezeMissingCosts(riders){
  let changed=false;
  const out=riders.map(r=>{
    if(r&&typeof r.cost==='number')return r;
    changed=true;
    return {...r,cost:riderCost(r.name)};
  });
  return {riders:out,changed};
}
function fantasyLoad(){
  const d=fantasyLoadAll(),k=fantasyGetRace();
  if(!k)return null;
  const team=d[k]||null;
  if(!team||!Array.isArray(team.riders))return team;
  let dirty=false;
  const {riders,changed}=_freezeMissingCosts(team.riders);
  if(changed){team.riders=riders;dirty=true;}
  // Teams saved before transfers_total existed have no cap stamped — without
  // this they'd either silently allow unlimited swaps (undefined comparisons
  // are always false) or, worse, have no way to fix a squad the cost-freeze
  // migration above just pushed over budget. Stamp the current default so
  // older squads immediately get free transfers to self-correct.
  if(team.transfers_total==null){team.transfers_total=TRANSFERS_TOTAL;team.transfers_used=team.transfers_used||0;dirty=true;}
  // Teams saved before per-race dynamic budgets existed have no frozen
  // .budget. Unlike the cost-freeze migration above (which has no choice but
  // to use today's live price), we DO have a safe choice here: freeze at
  // whichever is bigger, the original flat 100cr default or this squad's own
  // current cost. That guarantees this migration can never retroactively
  // push an old squad over budget the way backfilling live rider costs once
  // did (see the 2026-07 Pogačar incident) -- it only ever grants headroom,
  // never takes it away.
  if(team.budget==null){team.budget=Math.max(FANTASY_BUDGET_DEFAULT,squadCost(team.riders));dirty=true;}
  if(dirty){d[k]=team;fantasySaveAll(d);}
  return team;
}
function fantasySave(t){const d=fantasyLoadAll(),k=fantasyGetRace();if(k){d[k]=t;fantasySaveAll(d);}}
function fantasyDelete(){const d=fantasyLoadAll(),k=fantasyGetRace();if(k){delete d[k];fantasySaveAll(d);}}
function leagueLoad(){
  let l;
  try{l=JSON.parse(localStorage.getItem(FANTASY_LEAGUE_KEY)||'[]');}catch(e){l=[];}
  let anyChanged=false;
  l=l.map(t=>{
    if(!t||!Array.isArray(t.riders))return t;
    const {riders,changed}=_freezeMissingCosts(t.riders);
    if(changed){anyChanged=true;return{...t,riders};}
    return t;
  });
  if(anyChanged)leagueSave(l);
  return l;
}
function leagueSave(l){localStorage.setItem(FANTASY_LEAGUE_KEY,JSON.stringify(l));}
function leagueAdd(t){const l=leagueLoad();l.push(t);leagueSave(l);}
function leagueRemove(i){const l=leagueLoad();l.splice(i,1);leagueSave(l);renderFantasy();}
function draftLoad(){try{return JSON.parse(localStorage.getItem(FANTASY_DRAFT_KEY)||'null');}catch(e){return null;}}
function draftSave(d){localStorage.setItem(FANTASY_DRAFT_KEY,JSON.stringify(d));}
function draftClear(){localStorage.removeItem(FANTASY_DRAFT_KEY);}
function iClaudiusLoadAll(){try{const s=localStorage.getItem(ICLAUDIUS_KEY);if(s)return JSON.parse(s);}catch(e){}return {};}
function iClaudiusSaveAll(d){localStorage.setItem(ICLAUDIUS_KEY,JSON.stringify(d));}
function iClaudiusGet(rk){const d=iClaudiusLoadAll();return rk?d[rk]||null:null;}
function iClaudiusSet(rk,t){const d=iClaudiusLoadAll();if(rk){d[rk]=t;iClaudiusSaveAll(d);}}
function iClaudiusClear(rk){const d=iClaudiusLoadAll();if(rk){delete d[rk];iClaudiusSaveAll(d);}}

const normName = n => (n||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z]/g,' ').replace(/\s+/g,' ').trim();

function getRaceRiders(){
  // Return riders from the active race's startlist, enriched with team roster data where possible.
  // Falls back to full peloton if no startlist exists.
  const raceKey=fantasyGetRace();
  const race=[...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===raceKey);
  const sl=race&&race.startlist&&race.startlist.length?race.startlist:null;
  if(!sl) return getAllRiders();
  // Build a lookup from the full roster for enrichment (photo, slug)
  const rosterMap=new Map();
  for(const team of (appData.teams||[])){
    for(const r of (team.riders||[])){
      if(r.name) rosterMap.set(normName(r.name),{...r,teamName:team.name});
    }
  }
  const riders=[],seen=new Set();
  const startedTeams=new Set();
  for(const r of sl){
    if(!r.name||seen.has(r.name))continue;
    seen.add(r.name);
    const enriched=rosterMap.get(normName(r.name))||{};
    const teamName=enriched.teamName||r.team||'';
    if(teamName) startedTeams.add(teamName);
    riders.push({name:r.name,slug:r.slug||enriched.slug||'',nat:(r.nat||enriched.nat||'').toLowerCase(),photo:enriched.photo||'',teamName});
  }
  // Also surface teammates of confirmed starters who aren't themselves in the
  // scraped startlist yet. The source startlist can lag a team's real
  // announcement (or simply be recorded before every last name trickled in),
  // and without this a rider who's genuinely riding -- possibly a team's own
  // GC leader -- can be completely invisible in the picker with zero
  // explanation. Marked restricted (shows the existing "DNS?" badge, which
  // was already wired into the picker UI but never actually populated by
  // any code path) so it's clear they're not officially confirmed for this
  // specific race and might not score.
  for(const team of (appData.teams||[])){
    if(!startedTeams.has(team.name))continue;
    for(const r of (team.riders||[])){
      if(!r.name||seen.has(r.name))continue;
      seen.add(r.name);
      riders.push({name:r.name,slug:r.slug||'',nat:(r.nat||'').toLowerCase(),photo:r.photo||'',teamName:team.name,restricted:true});
    }
  }
  return riders.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}

function getAllRiders(){
  const riders=[],seen=new Set();
  // 1. Team rosters (full peloton once scraper has run)
  for(const team of (appData.teams||[])){
    for(const r of (team.riders||[])){
      if(r.name&&!seen.has(r.name)){seen.add(r.name);riders.push({name:r.name,slug:r.slug||'',nat:(r.nat||'').toLowerCase(),photo:r.photo||'',teamName:team.name});}
    }
  }
  // 2. Race results — nat_code field holds the country code (e.g. "GB")
  for(const section of ['recent','live','upcoming']){
    for(const race of (appData[section]||[])){
      for(const stage of (race.stages||[])){
        for(const r of (stage.top10||[])){
          const nat=r.nat_code||r.nat||'';
          if(r.name&&!seen.has(r.name)){seen.add(r.name);riders.push({name:r.name,slug:'',nat:nat.toLowerCase(),photo:'',teamName:r.team||''});}
        }
      }
      const cl=race.classifications||{};
      for(const key of ['gc','points','mountain','youth']){
        for(const r of (cl[key]||[])){
          const nat=r.nat_code||r.nat||'';
          if(r.name&&!seen.has(r.name)){seen.add(r.name);riders.push({name:r.name,slug:'',nat:nat.toLowerCase(),photo:'',teamName:r.team||''});}
        }
      }
    }
  }
  return riders.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
}

function computePoints(riderNames,createdAt,raceKey){
  // NOTE: raceKey scopes scoring to a single race. Fantasy teams are drafted
  // per-race (see ARCHITECTURE.md — "teams stored per-race keyed by slug"),
  // so without this filter a squad picks up stage/GC/jersey points from every
  // OTHER race its riders happened to do well in this season — e.g. Team
  // Claudius showing it "already leads" on a race that hasn't started yet,
  // just because its strong riders won stages elsewhere.
  const myNorm=new Set(riderNames.map(normName));
  const cutoff=createdAt?new Date(createdAt):null;
  let pts=0;const breakdown=[];
  const pool=[...(appData.recent||[]),...(appData.live||[])];
  const races=raceKey?pool.filter(race=>_raceKey(race)===raceKey):pool;
  // Lazily built map of normalized team name -> normalized rider names on that
  // team's roster (from appData.teams, the season-wide squad lists). Needed
  // because TTT (team time trial) stage results are recorded by TEAM name in
  // stage.top10 (r.is_ttt === true), not by rider -- e.g. TDF 2026 stage 1.
  // Without this, matching r.name against myNorm directly never matches (a
  // team name isn't a rider name), so a TTT stage win couldn't score any
  // fantasy rider even though the real riders on that team earned it.
  let teamRosterNorm=null;
  function ridersOnTeam(teamNameRaw){
    if(!teamRosterNorm){
      teamRosterNorm=new Map();
      for(const t of (appData.teams||[])){
        teamRosterNorm.set(normName(t.name||''), new Set((t.riders||[]).map(r=>normName(r.name))));
      }
    }
    return teamRosterNorm.get(normName(teamNameRaw))||new Set();
  }
  for(const race of races){
    if(cutoff&&race.end_date){const rd=new Date(race.end_date);if(rd<cutoff)continue;}
    for(const stage of (race.stages||[])){
      for(const r of (stage.top10||[])){
        if(!(r.rank>=1&&r.rank<=10))continue;
        const p=STAGE_PTS[r.rank]||0;
        if(!p)continue;
        if(r.is_ttt){
          const roster=ridersOnTeam(r.name);
          for(const name of riderNames){
            if(roster.has(normName(name))){pts+=p;breakdown.push({race:race.name,label:'Stage '+stage.num+' (TTT)',rank:r.rank,pts:p,rider:name});}
          }
        } else if(myNorm.has(normName(r.name))){
          pts+=p;breakdown.push({race:race.name,label:'Stage '+stage.num,rank:r.rank,pts:p,rider:r.name});
        }
      }
    }
    // 2026-07-12 fix: this used to read race.classifications.{gc,points,
    // mountain,youth} — a shape that never actually exists in data.json (the
    // scraper writes gc_top10/points_top10/kom_top10/youth_top10 directly on
    // the race object, per scraper.py's main_results_only()). That meant GC
    // and jersey points were dead code in production — only stage points
    // ever scored, silently, for as long as this app has existed. Read the
    // real fields instead.
    const gcTop10=race.gc_top10||[];
    for(const r of gcTop10){
      if(r.rank>=1&&r.rank<=10&&myNorm.has(normName(r.name))){
        const p=GC_PTS[r.rank]||0;
        if(p>0){pts+=p;breakdown.push({race:race.name,label:'GC',rank:r.rank,pts:p,rider:r.name});}
      }
    }
    // Yellow jersey holder (GC leader) — jersey bonuses don't stack with Yellow
    const yellowNorm=normName((gcTop10[0]||{}).name||'');
    const sp=(race.points_top10||[])[0];
    if(sp&&myNorm.has(normName(sp.name))&&normName(sp.name)!==yellowNorm){pts+=JERSEY_PTS;breakdown.push({race:race.name,label:'Points Jersey 🟢',rank:1,pts:JERSEY_PTS,rider:sp.name});}
    const km=(race.kom_top10||[])[0];
    if(km&&myNorm.has(normName(km.name))&&normName(km.name)!==yellowNorm){pts+=JERSEY_PTS;breakdown.push({race:race.name,label:'KOM Jersey 🔴',rank:1,pts:JERSEY_PTS,rider:km.name});}
    const yu=(race.youth_top10||[])[0];
    if(yu&&myNorm.has(normName(yu.name))&&normName(yu.name)!==yellowNorm){pts+=JERSEY_PTS;breakdown.push({race:race.name,label:'Youth Jersey ⚪',rank:1,pts:JERSEY_PTS,rider:yu.name});}
  }
  return{total:pts,breakdown};
}

// ── Grand Tour bonus predictions ──────────────────────────────────────────────
// Separate from the squad: predict GC 1st/2nd/3rd and the KOM/Points/Youth
// jersey winners. These riders don't have to be on your drafted squad --
// correct calls score bonus points on top of your squad total regardless
// (you CAN put a jersey favourite in your squad too and score both, that's
// intentional -- rewards nailing the podium/jerseys as its own skill,
// separate from budget-constrained squad building). Grand Tours only
// (total_stages>=21, same threshold maxSquad() uses for an 8-rider squad).
const FANTASY_PREDICTIONS_KEY = 'fantasy_gt_predictions';  // {raceKey: {gc1,gc2,gc3,kom,points,youth,created_at}}
const PREDICTION_SLOTS = [
  {key:'gc1',    label:'🥇 GC Winner',     field:'gc_top10',     rank:1, pts:GC_PTS[1]},
  {key:'gc2',    label:'🥈 GC 2nd',        field:'gc_top10',     rank:2, pts:GC_PTS[2]},
  {key:'gc3',    label:'🥉 GC 3rd',        field:'gc_top10',     rank:3, pts:GC_PTS[3]},
  {key:'kom',    label:'🔴 KOM Jersey',    field:'kom_top10',    rank:1, pts:JERSEY_PTS},
  {key:'points', label:'🟢 Points Jersey', field:'points_top10', rank:1, pts:JERSEY_PTS},
  {key:'youth',  label:'⚪ Youth Jersey',  field:'youth_top10',  rank:1, pts:JERSEY_PTS},
];
function predictionsLoadAll(){try{const s=localStorage.getItem(FANTASY_PREDICTIONS_KEY);if(s)return JSON.parse(s);}catch(e){}return {};}
function predictionsSaveAll(d){localStorage.setItem(FANTASY_PREDICTIONS_KEY,JSON.stringify(d));}
function predictionsGet(raceKey){const d=predictionsLoadAll();return (raceKey&&d[raceKey])||null;}
function predictionsSet(raceKey,obj){
  if(!raceKey)return;
  const d=predictionsLoadAll();
  const prevCreated=(d[raceKey]&&d[raceKey].created_at)||new Date().toISOString();
  d[raceKey]={...obj,created_at:prevCreated};
  predictionsSaveAll(d);
}
function isGrandTour(race){ return !!race && (race.total_stages||0)>=21; }
// Predictions can only be set/changed while the race hasn't started yet --
// once live, the same "startlist must be finalised" logic applies: results
// are already unfolding, so editing after the fact wouldn't be a prediction.
function predictionsLocked(race){ return !race || race.status!=='upcoming'; }
function computePredictionBonus(pred,race){
  if(!pred||!race) return {total:0,breakdown:[]};
  let pts=0;const breakdown=[];
  for(const slot of PREDICTION_SLOTS){
    const picked=pred[slot.key];
    if(!picked) continue;
    const list=race[slot.field]||[];
    const actual=list.find(r=>r.rank===slot.rank);
    if(actual&&normName(actual.name)===normName(picked)){
      pts+=slot.pts;
      breakdown.push({race:race.name,label:slot.label,rank:slot.rank,pts:slot.pts,rider:picked});
    }
  }
  return {total:pts,breakdown};
}
function fSetPrediction(raceKey,slotKey,value){
  const pred=predictionsGet(raceKey)||{};
  pred[slotKey]=value||null;
  predictionsSet(raceKey,pred);
  renderFantasy();
}
function renderPredictionsPanel(raceKey,race){
  if(!isGrandTour(race)) return '';
  const locked=predictionsLocked(race);
  const pred=predictionsGet(raceKey)||{};
  const riders=getRaceRiders().filter(r=>!r.restricted);
  const bonus=computePredictionBonus(pred,race);
  const optsFor=(selected)=>'<option value="">— pick a rider —</option>'
    +riders.map(r=>'<option value="'+esc(r.name)+'"'+(r.name===selected?' selected':'')+'>'+esc(r.name)+(r.teamName?' — '+esc(r.teamName):'')+'</option>').join('');
  const rows=PREDICTION_SLOTS.map(slot=>{
    const val=pred[slot.key]||'';
    const scored=bonus.breakdown.find(b=>b.label===slot.label);
    const badge=val
      ?(scored?'<span style="font-size:.72rem;font-weight:700;color:var(--gold)">+'+scored.pts+' pts ✓</span>':'<span style="font-size:.72rem;color:var(--muted)">not yet</span>')
      :'';
    return '<div style="margin-bottom:10px">'
      +'<label style="font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px"><span>'+slot.label+' <span style="opacity:.6">('+slot.pts+' pts)</span></span>'+badge+'</label>'
      +'<select '+(locked?'disabled':'')+' onchange="fSetPrediction(\''+raceKey+'\',\''+slot.key+'\',this.value)" style="width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px 10px;color:var(--text);font-size:.86rem;'+(locked?'opacity:.6':'')+'">'+optsFor(val)+'</select>'
    +'</div>';
  }).join('');
  return '<details style="background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden">'
    +'<summary style="padding:12px 14px;font-size:.82rem;font-weight:700;color:var(--muted);cursor:pointer;letter-spacing:.5px;text-transform:uppercase;list-style:none;display:flex;justify-content:space-between;align-items:center">🔮 Bonus Predictions<span style="color:var(--gold)">'+(bonus.total>0?'+'+bonus.total+' pts':'')+'</span></summary>'
    +'<div style="padding:4px 14px 14px">'
      +'<div style="font-size:.76rem;color:var(--muted);margin-bottom:10px">Predict the final GC podium and jersey winners — these riders don\'t need to be on your squad, and score bonus points on top whether or not they are.'+(locked?' <strong>Locked — the race has started, so picks are final.</strong>':'')+'</div>'
      +rows
    +'</div>'
  +'</details>';
}

const FANTASY_MIN_STAGES_KEY = 'uci_fantasy_min_stages';
function _fGetMinStages(){
  const v = parseInt(localStorage.getItem(FANTASY_MIN_STAGES_KEY), 10);
  return Number.isFinite(v) && v >= 1 ? v : 1;
}
function _fSetMinStages(v){
  const n = Math.max(1, parseInt(v, 10) || 1);
  localStorage.setItem(FANTASY_MIN_STAGES_KEY, String(n));
  renderFantasy();
}

// Builds the base list of races the "Pick a Race" dropdown draws from:
// dedup'd, finished-races-hidden (unless you already have a team there), and
// sorted chronologically -- but NOT yet filtered by the "Min. stages"
// spinner. Kept separate from the stages filter so callers can tell "no
// races exist at all" apart from "the stages filter hid everything" (the
// latter should still render the spinner so you can lower it back down).
function _fSelectableRacesBase(){
  const teams=fantasyLoadAll();
  // Tag each race with which data.json section it came from before merging --
  // "recent" means the race has already finished (results are in). We use
  // that categorization instead of comparing dates ourselves, since it
  // avoids timezone/format edge cases around exactly when a live race's
  // end_date tips into "the past".
  const races=[
    ...(appData.live||[]).map(r=>({...r,_src:'live'})),
    ...(appData.upcoming||[]).map(r=>({...r,_src:'upcoming'})),
    ...(appData.recent||[]).map(r=>({...r,_src:'recent'})),
  ];
  const seen=new Set();
  const unique=races.filter(r=>{const k=_raceKey(r);if(!k||seen.has(k))return false;seen.add(k);return true;});
  // Drop races that have already finished, unless you already drafted a
  // squad for one -- keeps the picker to live/upcoming races instead of
  // filling up with the whole season's past Classics and stage races, while
  // still letting you switch back to check a squad you made before the race
  // ended.
  const current=unique.filter(r=>r._src!=='recent' || !!teams[_raceKey(r)]);
  // Chronological: soonest-starting (or, for races with no start_date, soonest-ending) first.
  current.sort((a,b)=>(a.start_date||a.end_date||'').localeCompare(b.start_date||b.end_date||''));
  return current;
}
// Same as above, plus the "Min. stages" filter applied -- this is the exact
// set of races actually rendered as <option>s in the dropdown right now.
function _fSelectableRaces(){
  const minStages=_fGetMinStages();
  return _fSelectableRacesBase().filter(r=>(r.total_stages||1) >= minStages);
}

// Guards against a nasty desync bug: if the currently active race (whatever
// fantasyGetRace() returns) has been filtered out of the dropdown -- e.g. it
// finished months ago, or the min-stages spinner now excludes it -- the
// native <select> has no matching <option>, so the browser silently falls
// back to *displaying* the first option in the list without that actually
// becoming the selected value underneath. Result: the dropdown visually
// shows "Tour de France" while maxSquad()/getRaceRiders()/every other call
// site is still silently operating on the real (stale, wrong) active race --
// confirmed via a user report where the picker showed "Tour de France · 21
// days" selected but the debug panel showed the true active race was a
// long-finished 5-stage race, capping the squad at 7 instead of 8 with zero
// indication anything was wrong. Call this before reading fantasyGetRace()
// anywhere that matters (squad size, rider pool, startlist status) so state
// always matches what's on screen.
function _fEnsureActiveRaceValid(){
  const activeKey=fantasyGetRace();
  const selectable=_fSelectableRaces();
  if(!selectable.length)return;
  if(!selectable.some(r=>_raceKey(r)===activeKey)){
    fantasySetRace(_raceKey(selectable[0]));
  }
}

function renderRaceSelector(){
  const base=_fSelectableRacesBase();
  if(!base.length)return '';
  const teams=fantasyLoadAll();
  _fEnsureActiveRaceValid();
  const activeKey=fantasyGetRace();
  const minStages=_fGetMinStages();
  const filtered=base.filter(r=>(r.total_stages||1) >= minStages);
  const opts=filtered.map(r=>{
    const k=_raceKey(r);
    const has=!!teams[k];
    const days=r.total_stages||1;
    const finished=r._src==='recent';
    const label=esc(r.name)+' · '+days+(days===1?' day':' days')+(finished?' (finished)':'')+(has?' ✓':'');
    return '<option value="'+k+'"'+(k===activeKey?' selected':'')+'>'+label+'</option>';
  }).join('');
  const emptyMsg=filtered.length?'':'<div style="font-size:.78rem;color:var(--muted);margin-top:6px">No races with '+minStages+'+ stages — lower the filter below.</div>';
  return '<div style="margin-bottom:14px">'
    +'<label style="display:block;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:6px">🏁 Pick a Race</label>'
    +'<select onchange="fSwitchRace(this.value)" style="width:100%;padding:10px 12px;border-radius:8px;border:2px solid var(--upcoming);background:var(--surface);color:var(--text);font-size:.88rem;font-weight:600;cursor:pointer;appearance:auto">'
      +'<option value="" disabled'+(activeKey?'':' selected')+'>— choose a race —</option>'
      +opts
    +'</select>'
    +'<div style="display:flex;align-items:center;gap:8px;margin-top:8px">'
      +'<label for="fMinStages" style="font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase">Min. stages</label>'
      +'<input id="fMinStages" type="number" inputmode="numeric" min="1" max="25" step="1" value="'+minStages+'" onchange="_fSetMinStages(this.value)" style="width:64px;padding:6px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:.85rem">'
      +'<span style="font-size:.72rem;color:var(--muted)">— bump this up to hide one-day races and find longer tours</span>'
    +'</div>'
    +emptyMsg
  +'</div>';
}

function fSwitchRace(key){
  fantasySetRace(key);
  draftClear();_fPicked=[];
  renderFantasy();
}

function renderFantasy(){
  const el=document.getElementById('sec-fantasy');
  if(!el)return;
  _fEnsureActiveRaceValid();
  const myTeam=fantasyLoad();
  if(!myTeam||(myTeam.riders&&myTeam.riders.length<maxSquad())){
    if(myTeam&&myTeam.riders&&myTeam.riders.length>0){
      if(!draftLoad())draftSave({picked:myTeam.riders,name:myTeam.name||'',owner:myTeam.owner||''});
      fantasyDelete();
    }
    _fPicked=[];
    el.innerHTML=renderFantasySetup();
    return;
  }
  const _ark=fantasyGetRace();
  const{total:squadTotal,breakdown:squadBreakdown}=computePoints(myTeam.riders.map(r=>r.name),myTeam.created_at,_ark);
  const league=leagueLoad();
  const _arl=[...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===_ark);
  const _raceBanner=_arl?'<div style="font-size:.82rem;font-weight:700;color:var(--accent);margin-bottom:12px">🏁 '+esc(_arl.name)+'</div>':'';
  // GC-podium/jersey predictions are a bonus layer on top of squad points --
  // only applied to MY OWN total. Predictions are a personal, local-only
  // pick (not part of a team export code), so there's no equivalent data to
  // score for imported league teams or Team Claudius.
  const _predBonus=isGrandTour(_arl)?computePredictionBonus(predictionsGet(_ark),_arl):{total:0,breakdown:[]};
  const total=squadTotal+_predBonus.total;
  const breakdown=[...squadBreakdown,..._predBonus.breakdown];
  const _icTeam=iClaudiusGet(_ark);
  const allTeams=[{...myTeam,points:total,isMine:true},...league.map((t,i)=>({...t,points:computePoints((t.riders||[]).map(r=>r.name),t.created_at,_ark).total,leagueIdx:i})),...(_icTeam?[{..._icTeam,points:computePoints((_icTeam.riders||[]).map(r=>r.name),_icTeam.created_at,_ark).total,isIClaudius:true}]:[])];
  const _arComplete=raceIsComplete(_arl);
  if(_arComplete){
    allTeams.sort((a,b)=>b.points-a.points);
  } else {
    // Don't rank/sort by points while the race is live -- position on screen
    // would itself leak who's currently ahead, defeating the point of
    // keeping other squads/scores hidden until the race is over. Stable
    // order instead: your own team first, then everyone else alphabetically.
    allTeams.sort((a,b)=>((b.isMine?1:0)-(a.isMine?1:0))||(a.name||'').localeCompare(b.name||''));
  }
  el.innerHTML='<div style="max-width:480px;margin:0 auto;padding:16px">'
    +renderRaceSelector()
    +renderPredictionsPanel(_ark,_arl)
    +'</div>'
    // Auto-team placeholder (replaced async once best_teams.json loads)
    +'<div id="auto-team-panel" style="max-width:480px;margin:0 auto 24px;padding:20px;text-align:center;color:var(--muted);font-size:.82rem">⏳ Building Team Claudius…</div>'
    +renderLeagueTable(allTeams,_arComplete)+renderMySquad(myTeam,total,breakdown,_ark);
  // Load auto-team async (non-blocking)
  loadAndRenderAutoTeam(_ark, total).catch(()=>{});
  // Wire up delegated events after render
  el.querySelectorAll('[data-pick]').forEach(el=>el.addEventListener('click',()=>fPickRider(el.dataset.pick)));
  el.querySelectorAll('[data-unpick]').forEach(el=>el.addEventListener('click',()=>fRemovePicked(el.dataset.unpick)));

  el.querySelectorAll('[data-doswap]').forEach(el=>el.addEventListener('click',()=>fDoSwap(el.dataset.doswap)));
  el.querySelectorAll('[data-openswap]').forEach(el=>el.addEventListener('click',()=>fOpenSwap(el.dataset.openswap)));
}

    el.innerHTML='<div style="padding:12px;color:var(--muted);font-size:.85rem">No rider data yet — run the scraper first.</div>';

  }
  let matches;
  if(!raw){
    // Default browse view stays constrained to the official startlist --
    // getRaceRiders() also mixes in unconfirmed teammates (restricted/"DNS?")
    // so a specific search can still find them, but showing all of those by
    // default flooded the list with every team's full bench (some 400+ extra
    // names) and buried the actual confirmed startlist. Only surface
    // restricted riders when you're specifically searching for one by name.
    matches=all.filter(r=>!r.restricted);
  } else {
    const lq=raw.toLowerCase();
    const starts=all.filter(r=>(r.name||'').toLowerCase().startsWith(lq));
    const contains=all.filter(r=>!(r.name||'').toLowerCase().startsWith(lq)&&(r.name||'').toLowerCase().includes(lq));
    matches=[...starts,...contains];
  }
  const ms=maxSquad();
  const squadFull=_fPicked.length>=ms;
  if(lbl)lbl.textContent=squadFull?'— squad full ('+_fPicked.length+'/'+ms+')':'— '+matches.length+' available';
  if(!matches.length){el.innerHTML='<div style="padding:12px;color:var(--muted);font-size:.85rem">No riders found</div>';return;}
  // Squad-full and can't-afford both disable a row the same way (greyed out,
  // no click handler) -- without a distinct badge for each, a rider well
  // within budget (e.g. 10cr with 12cr left) looks identically "broken" as
  // one you can't afford, with zero indication that the real blocker is
  // squad size, not cost. Surfaced by a user report: "have 12 points left,
  // can't select a 10-point rider" -- squad was simply already full.
  const fullBanner=squadFull?'<div style="padding:9px 12px;font-size:.8rem;font-weight:600;color:var(--upcoming);background:rgba(67,97,238,.12);border-bottom:1px solid var(--border)">Squad full ('+_fPicked.length+'/'+ms+') — remove a rider below to make room.</div>':'';
  const spent=squadCost(_fPicked);
  const remaining=raceBudget()-spent;
  el.innerHTML=fullBanner+matches.map(r=>{
    const c=riderCost(r.name);
    const canAfford=!squadFull&&c<=remaining;
    const overBudget=!squadFull&&c>remaining;
    const restrictedBadge=r.restricted?'<span title="Not yet on the official startlist for this race — a teammate of a confirmed rider, might not actually start" style="font-size:.68rem;font-weight:700;color:#f97316;background:rgba(249,115,22,.15);border-radius:3px;padding:1px 5px;flex-shrink:0">DNS?</span>':'';
    const statusBadge=squadFull
      ?'<span style="font-size:.68rem;font-weight:700;color:var(--muted);background:rgba(255,255,255,.08);border-radius:3px;padding:1px 5px;flex-shrink:0">squad full</span>'
      :(overBudget?'<span style="font-size:.68rem;font-weight:700;color:#ef4444;background:rgba(239,68,68,.12);border-radius:3px;padding:1px 5px;flex-shrink:0">💰over</span>':'');
    const infoBtn=r.slug?'<button onclick="event.stopPropagation();openRiderModal(\''+esc(r.slug)+'\')" style="background:none;border:none;cursor:pointer;font-size:.9rem;padding:0 2px;opacity:.6;flex-shrink:0" title="View profile">ℹ️</button>':'';
    return '<div '+(canAfford?'data-pick="'+esc(r.name)+'"':'data-pick-disabled="1"')+' style="padding:9px 12px;cursor:'+(canAfford?'pointer':'default')+';display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);transition:background .15s;opacity:'+(canAfford?'1':'.45')+'" onmouseenter="if('+(canAfford?'true':'false')+')this.style.background=\'var(--surface)\'" onmouseleave="this.style.background=\'\'">'
      +(r.nat?flag(r.nat):'<span style="width:20px;display:inline-block"></span>')
      +'<span style="flex:1;font-size:.9rem">'+esc(r.name)+'</span>'
      +restrictedBadge+statusBadge
      +'<span style="font-size:.75rem;color:var(--muted);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(r.teamName||'')+'</span>'
      +costBadge(r.name)
      +infoBtn
    +'</div>';
  }).join('');
  el.querySelectorAll('[data-pick]').forEach(node=>node.addEventListener('click',()=>fPickRider(node.dataset.pick)));
}

function fPickRider(name){
  if(_fPicked.length>=maxSquad()){const ms=maxSquad();alert('Squad full! You need exactly '+ms+' riders.');return;}
  const r=getRaceRiders().find(r=>r.name===name)||getAllRiders().find(r=>r.name===name);
  if(!r||_fPicked.find(p=>p.name===name))return;
  const cost=riderCost(name);
  const spent=squadCost(_fPicked);
  const budget=raceBudget();
  if(spent+cost>budget){alert('Not enough budget! '+name+' costs '+cost+' cr but you only have '+(budget-spent)+' cr left.');return;}
  // Freeze this rider's cost at today's price. Their cost can keep moving
  // live (e.g. a Tour stage win bumps it) but this squad's price for them is
  // locked from the moment they're picked -- picking the same rider again for
  // a different race starts fresh and freezes at whatever the price is then.
  _fPicked.push({...r,cost});
  renderPickedList();
  const srch=document.getElementById('fRiderSearch');
  fSearchRiders(srch?srch.value:'');
  _fSaveDraft();
}

function fRemovePicked(name){
  _fPicked=_fPicked.filter(r=>r.name!==name);
  renderPickedList();
  const srch=document.getElementById('fRiderSearch');
  fSearchRiders(srch?srch.value:'');
  _fSaveDraft();
}

function _fSaveDraft(){
  const nameEl=document.getElementById('fTeamName'),ownerEl=document.getElementById('fOwnerName'),emailEl=document.getElementById('fOwnerEmail');
  draftSave({picked:[..._fPicked],name:nameEl?nameEl.value:'',owner:ownerEl?ownerEl.value:'',email:emailEl?emailEl.value:''});
}

function _fUpdateSquadUI(){
  const n=_fPicked.length;
  const MS=maxSquad();
  const progPct=Math.round(n/MS*100);
  const progCol=n===MS?'var(--upcoming)':n>=(MS-1)?'#f97316':'var(--accent)';
  const cnt=document.getElementById('fPickCount');if(cnt){cnt.textContent=n;cnt.style.color=progCol;}
  const bar=document.getElementById('fSquadBar');if(bar){bar.style.width=progPct+'%';bar.style.background=progCol;}
  const msg=document.getElementById('fSquadMsg');
  if(msg)msg.textContent=n===MS?'Squad complete — ready to create!':(n===0?'Pick '+MS+' riders to build your team':('Need '+(MS-n)+' more rider'+(MS-n===1?'':'s')));
  const btn=document.getElementById('fCreateBtn');
  if(btn){
    if(n===MS){btn.disabled=false;btn.style.background='var(--upcoming)';btn.style.color='#fff';btn.style.cursor='pointer';btn.textContent='✅ Create Team';}
    else{btn.disabled=true;btn.style.background='var(--border)';btn.style.color='var(--muted)';btn.style.cursor='not-allowed';btn.textContent='Pick '+MS+' Riders to Continue';}
  }
}

function renderPickedList(){
  const el=document.getElementById('fPickedList');if(!el)return;
  _fUpdateSquadUI();
  if(!_fPicked.length){el.innerHTML='';updateBudgetBar(0);return;}
  const spent=squadCost(_fPicked);
  el.innerHTML='<div style="display:flex;flex-direction:column;gap:4px">'
    +_fPicked.map(r=>
      '<div style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:9px 12px;display:flex;align-items:center;gap:8px">'
        +(r.nat?flag(r.nat):'<span style="width:16px;display:inline-block"></span>')
        +'<span style="flex:1;font-size:.9rem;font-weight:600">'+esc(r.name)+'</span>'
        +costBadge(r)
        +'<button data-unpick="'+esc(r.name)+'" style="background:none;border:none;color:var(--live);font-size:1rem;cursor:pointer;padding:0 4px">✕</button>'
      +'</div>'
    ).join('')
    +'</div>';
  el.querySelectorAll('[data-unpick]').forEach(node=>node.addEventListener('click',()=>fRemovePicked(node.dataset.unpick)));
  updateBudgetBar(spent);
}

function updateBudgetBar(spent){
  const bar=document.getElementById('fBudgetBar');if(!bar)return;
  const budget=raceBudget();
  const pct=Math.min(100,Math.round(spent/budget*100));
  const remaining=budget-spent;
  const col=remaining<10?'var(--live)':remaining<25?'#f97316':'var(--upcoming)';
  bar.innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">'
      +'<span style="font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.6px;text-transform:uppercase">Budget</span>'
      +'<span style="display:flex;align-items:baseline;gap:6px">'
        +'<span style="font-size:1.6rem;font-weight:800;color:'+col+';line-height:1">'+remaining+'</span>'
        +'<span style="font-size:.78rem;color:var(--muted)">/ '+budget+' cr remaining</span>'
      +'</span>'
    +'</div>'
    +'<div style="height:10px;background:var(--border);border-radius:5px;overflow:hidden">'
      +'<div style="height:100%;width:'+pct+'%;background:'+col+';border-radius:5px;transition:width .35s ease"></div>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:4px;font-size:.72rem;color:var(--muted)">'
      +'<span>Spent: '+spent+' cr</span>'
      +'<span>'+pct+'% used</span>'
    +'</div>';
}

function _pinHash(p){return p.split('').reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,5381).toString(36);}
function fVerifyPin(team,action,onOk){
  if(!team.pin_hash){onOk();return;}
  const entered=(prompt('Enter your 4-digit PIN to '+action+':','')+'').trim();
  if(!entered)return;
  if(_pinHash(entered)!==team.pin_hash){alert('\u274c Incorrect PIN.');return;}
  onOk();
}
function fCreateTeam(){
  const nameEl=document.getElementById('fTeamName'),ownerEl=document.getElementById('fOwnerName'),pinEl=document.getElementById('fTeamPin'),emailEl=document.getElementById('fOwnerEmail');
  const name=nameEl?nameEl.value.trim():'',owner=ownerEl?ownerEl.value.trim():'';
  const email=(emailEl?emailEl.value.trim():'');
  const pin=(pinEl?pinEl.value:'').trim();
  if(!name||!owner){alert('Please enter a team name and owner name.');return;}
  const _ms=maxSquad();if(_fPicked.length!==_ms){alert('You must pick exactly '+_ms+' riders. You have '+_fPicked.length+'.');return;}
  if(!/^\d{4}$/.test(pin)){alert('Please set a 4-digit PIN to protect your team.');return;}
  if(email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){alert('Please enter a valid email address (or leave it blank).');return;}
  const _crk=fantasyGetRace();
  const _craces=[...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===_crk);
  fantasySave({name,owner,email:email||'',riders:[..._fPicked],_race:_craces?_craces.name:'',created_at:new Date().toISOString(),pin_hash:_pinHash(pin),transfers_total:TRANSFERS_TOTAL,transfers_used:0,budget:raceBudget(_crk)});
  draftClear();
  _fPicked=[];
  if(email) _notifySubscribersExportNeeded();
  // One-day races (3-rider "pick the podium" squads) always get an AI
  // benchmark to measure against -- unlike multi-week stage races, there's
  // no time for a player to remember to click "Challenge Team Claudius"
  // before the race is over, so do it automatically. Silent: don't alert if
  // Team Claudius isn't built yet (startlist not confirmed) -- the manual
  // ⚔️ button still exists as a retry once it is.
  if(_craces&&_craces.total_stages===1){
    addIClaudiusToLeague(true,_crk).then(()=>renderFantasy()).catch(()=>renderFantasy());
  } else {
    renderFantasy();
  }
}

function _notifySubscribersExportNeeded(){
  // Set a flag so the My Squad view prompts to re-export subscribers.json
  try{localStorage.setItem('uci_subscribers_dirty','1');}catch(e){}
}

function renderMySquad(team,total,breakdown,raceKey){
  const totalCost=squadCost(team.riders);
  const budget=teamBudget(team,raceKey);
  const overBudget=totalCost>budget;
  const transfersTotal=team.transfers_total!=null?team.transfers_total:TRANSFERS_TOTAL;
  const transfersUsed=team.transfers_used||0;
  const transfersLeft=Math.max(0,transfersTotal-transfersUsed);
  const rows=team.riders.map(r=>{
    const rpts=breakdown.filter(b=>normName(b.rider)===normName(r.name)).reduce((s,b)=>s+b.pts,0);

      +(r.nat?flag(r.nat):'<span style="width:16px;display:inline-block"></span>')
      +'<span style="flex:1;font-size:.88rem;font-weight:600">'+esc(r.name)+'</span>'
      +costBadge(r)
      +(rpts>0?'<span style="font-size:.82rem;font-weight:700;color:var(--gold);min-width:42px;text-align:right">'+rpts+' pts</span>':'<span style="font-size:.78rem;color:var(--muted);min-width:42px;text-align:right">—</span>')
      +'<button data-openswap="'+esc(r.name)+'" title="Swap this rider" style="background:none;border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:.78rem;padding:3px 7px;cursor:pointer;flex-shrink:0">🔁</button>'
    +'</div>';
  }).join('')
  +'<div style="padding:8px 16px;font-size:.78rem;color:'+(overBudget?'var(--live)':'var(--muted)')+';display:flex;justify-content:space-between;border-top:2px solid var(--border)">'
    +'<span>Squad cost'+(overBudget?' ⚠️ over budget':'')+'</span><span style="font-weight:700">'+totalCost+' / '+budget+' cr</span>'
  +'</div>'
  +'<div style="padding:6px 16px 10px;font-size:.76rem;color:var(--muted);display:flex;justify-content:space-between">'
    +'<span>Transfers</span><span style="font-weight:700;color:var(--text)">'+transfersLeft+' / '+transfersTotal+' remaining</span>'
  +'</div>'
  +(overBudget?'<div style="padding:0 16px 12px;font-size:.76rem;color:var(--live)">Over budget by '+(totalCost-budget)+' cr — swap out a rider costing '+(COST_FLOOR+(totalCost-budget))+'+ cr for a cheaper one. A rider already at the '+COST_FLOOR+' cr floor can\'t be swapped down any further, so it won\'t fix this on its own.</div>':'');

  let bdHtml='';
  if(breakdown.length){

        '<div style="padding:8px 14px 10px;border-top:1px solid var(--border)">'
          +'<div style="font-size:.8rem;color:var(--accent);font-weight:600;margin-bottom:6px">'+esc(race)+'</div>'
          +items.map(b=>'<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:.82rem"><span style="color:var(--muted)">'+esc(b.rider)+' — '+esc(b.label)+' (P'+b.rank+')</span><span style="font-weight:700;color:var(--gold)">+'+b.pts+'</span></div>').join('')
        +'</div>'

      +'<div style="padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px">'

      +'<button onclick="fImportTeam()" style="flex:1;padding:11px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.85rem;font-weight:600;cursor:pointer">📥 Import Team</button>'

    +'</div>'
    +(localStorage.getItem('uci_subscribers_dirty')?
      '<button onclick="exportSubscribers()" style="width:100%;margin-top:8px;padding:11px;background:rgba(67,97,238,.18);border:1px solid var(--upcoming);border-radius:8px;color:var(--upcoming);font-size:.85rem;font-weight:700;cursor:pointer">📧 Update race notification list</button>'
    :

    )
