<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cyclist Intel App">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cyclist Intel App</title>
<style>
:root {
  --bg:       #0f1117;
  --surface:  #1a1d27;
  --surface2: #22263a;
  --border:   #2e334d;
  --live:     #e63946;
  --upcoming: #4361ee;
  --recent:   #2d6a4f;
  --text:     #e8eaf0;
  --muted:    #8890b0;
  --accent:   #f4a261;
  --accent-rgb: 244,162,97;
  --gold:     #ffd700;
  --silver:   #c0c0c0;
  --bronze:   #cd7f32;
  --rider-name: #FFE66D;
  --nav-h:    58px;
}

/* ── Light (ProCyclingStats-style) theme — toggled via [data-theme=light] ── */
:root[data-theme="light"] {
  --bg:       #ffffff;
  --surface:  #f2f4f7;
  --surface2: #e7eaf0;
  --border:   #d3d8e0;
  --live:     #d1232a;
  --upcoming: #2b59c3;
  --recent:   #2d6a4f;
  --text:     #1a1c22;
  --muted:    #667085;
  --accent:   #1b6ec2;
  --accent-rgb: 27,110,194;
  --gold:     #c9a227;
  --silver:   #8a8a8a;
  --bronze:   #a06a2c;
  --rider-name: #17407a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-top: env(safe-area-inset-top);
}

/* ── Header ── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

header h1 { font-size: 1.1rem; font-weight: 800; }
header h1 span { color: var(--accent); }
.cia-logo { width: 1.5em; height: 1.5em; margin-left: .4rem; vertical-align: middle; }

.header-actions { display: flex; align-items: center; gap: 8px; }

#install-btn {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  background: rgba(var(--accent-rgb),.15);
  border: 1px solid rgba(var(--accent-rgb),.4);
  border-radius: 16px;
  color: var(--accent);
  font-size: .85rem;
  font-weight: 700;
  cursor: pointer;
}

.refresh-btn {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-size: 1.1rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color .2s;
}
.refresh-btn:hover { color: var(--text); }

/* ── Theme toggle slider ── */
.theme-toggle { position:relative; width:50px; height:28px; border-radius:16px;
  border:1px solid var(--border); background:var(--surface2); cursor:pointer;
  flex-shrink:0; padding:0; }
.theme-toggle .ic { position:absolute; top:50%; transform:translateY(-50%);
  font-size:.72rem; line-height:1; opacity:.55; }
.theme-toggle .ic.moon { left:6px; }
.theme-toggle .ic.sun  { right:6px; }
.theme-toggle .knob { position:absolute; top:2px; left:2px; width:22px; height:22px;
  border-radius:50%; background:var(--accent); transition:left .2s ease; }
:root[data-theme="light"] .theme-toggle .knob { left:26px; }

.header-sub { font-size: .78rem; color: var(--muted); position: relative; }

.data-health { margin-left: 6px; cursor: pointer; padding: 1px 6px; border-radius: 8px; }
.data-health.health-ok { color: var(--muted); }
.data-health.health-warn { background: rgba(var(--accent-rgb),.15); color: var(--accent); font-weight: 600; }
.data-health.health-error { background: rgba(230,57,70,.15); color: var(--live); font-weight: 700; }
.health-detail-panel {
  display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  margin-top: 8px; background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; font-size: .78rem; color: var(--text);
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
.health-detail-panel.show { display: block; }
.health-detail-panel h4 {
  margin: 0 0 8px; font-size: .72rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: .6px; font-weight: 700;
}
.health-detail-panel .hd-row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.health-detail-panel .hd-list { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
.health-detail-panel .hd-close {
  position: absolute; top: 6px; right: 8px; cursor: pointer;
  color: var(--accent); font-size: 1.05rem; font-weight: 800;
  line-height: 1; padding: 2px 6px; border-radius: 6px;
}
.health-detail-panel .hd-close:hover { background: rgba(var(--accent-rgb),.15); }

.scripts-status-btn { margin-left: 6px; cursor: pointer; opacity: .55; font-size: .82rem; }
.scripts-status-btn:hover { opacity: 1; }
.scripts-panel { max-height: 70vh; overflow-y: auto; }
.script-row { padding: 8px 0; border-bottom: 1px solid var(--border); }
.script-row:last-child { border-bottom: none; }
.script-row.failed { background: rgba(230,57,70,.08); margin: 0 -14px; padding: 8px 14px; }
.script-name { font-weight: 700; font-size: .85rem; display: flex; align-items: center; gap: 6px; }
.script-row.failed .script-name { color: var(--live); }
.script-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.script-dot.ok       { background: #2dd36f; }
.script-dot.fail     { background: var(--live); }
.script-dot.running  { background: var(--accent); }
.script-dot.unknown  { background: var(--muted); }
.script-desc { color: var(--muted); font-size: .76rem; margin-top: 3px; line-height: 1.4; }
.script-meta { color: var(--muted); font-size: .72rem; margin-top: 5px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.script-meta a { color: var(--upcoming); text-decoration: none; }

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  gap: 6px;
  padding: 10px 16px;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 64px;
  z-index: 99;
  scrollbar-width: none;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-chip {
  flex-shrink: 0;
  padding: 5px 13px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  user-select: none;
}
.filter-chip.active {
  background: var(--upcoming);
  border-color: var(--upcoming);
  color: #fff;
}

/* ── Sections ── */
.section { display: none; padding: 16px 14px; }
.section.active { display: block; }

.group-header {
  font-size: .75rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 18px 4px 8px;
}
.group-header:first-child { padding-top: 4px; }

/* ── Race card ── */
.race-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.race-card.live-card     { border-left: 3px solid var(--live); }
.race-card.recent-card   { border-left: 3px solid var(--recent); }
.race-card.upcoming-card { border-left: 3px solid var(--upcoming); }

.race-header {
  padding: 12px 14px 12px 16px;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}
.race-header:active { background: var(--surface2); }

.race-title { flex: 1; min-width: 0; }
.race-name {
  font-size: 1rem;
  font-weight: 600;
  white-space: normal;
  line-height: 1.3;
}
.race-meta { font-size: .78rem; color: var(--muted); margin-top: 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }

.race-right { display: flex; align-items: flex-start; gap: 8px; flex-shrink: 0; padding-top: 2px; }

.cat-badge {
  font-size: .7rem;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--muted);
  border: 1px solid var(--border);
}

.stage-pill { font-size: .78rem; color: var(--muted); white-space: nowrap; }

.chevron {
  width: 20px; height: 20px;
  color: var(--muted);
  transition: transform .2s;
  flex-shrink: 0;
}
.race-card.open .chevron { transform: rotate(180deg); }

.race-body { display: none; border-top: 1px solid var(--border); }
.race-card.open .race-body { display: block; }

.race-body-inner { padding: 14px; }

/* ── Classifications accordion ── */
.classif-section { margin-bottom: 16px; }
.classif-title {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  padding: 0 0 6px 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: 0;
}
.classif-row {
  border-bottom: 1px solid var(--border);
}
.classif-row:last-child { border-bottom: none; }
.classif-row-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 2px;
  cursor: pointer;
  user-select: none;
}
.classif-row-header:active { background: #2a2f47; }
.classif-badge {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 10px;
  white-space: nowrap;
  min-width: 62px;
  text-align: center;
}
.badge-gc       { background: rgba(245,203,66,.18);  color: #f5cb42; border: 1px solid rgba(245,203,66,.35); }
.badge-points   { background: rgba(45,211,111,.15);  color: #2dd36f; border: 1px solid rgba(45,211,111,.35); }
.badge-mountain { background: rgba(230,57,70,.15);   color: #e63946; border: 1px solid rgba(230,57,70,.35); }
.badge-youth    { background: rgba(76,201,240,.15);  color: #4cc9f0; border: 1px solid rgba(76,201,240,.35); }
.classif-leader-name { font-size: .92rem; font-weight: 600; flex: 1; }
.classif-chevron {
  width: 18px; height: 18px; flex-shrink: 0; color: var(--muted);
  transition: transform .2s;
}
.classif-row.open .classif-chevron { transform: rotate(180deg); }
.classif-row-body { display: none; padding-bottom: 8px; }
.classif-row.open .classif-row-body { display: block; }

/* ── Stages ── */
.stages-title {
  font-size: .72rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.stage-row {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  margin-bottom: 5px;
  overflow: hidden;
}

.stage-row-header {
  padding: 11px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 46px;
}
.stage-row-header.clickable { cursor: pointer; }
.stage-row-header.clickable:active { background: #2a2f47; }

.stage-num { font-size: .78rem; font-weight: 700; color: var(--muted); min-width: 58px; }
.stage-winner-name { font-size: .92rem; flex: 1; }
.stage-no-data { font-size: .82rem; color: var(--muted); flex: 1; font-style: italic; }
.stage-cancelled { font-size: .82rem; color: var(--muted); flex: 1; font-weight: 700; }
.stage-cancelled::before { content: '✖ '; }
.ttt-badge { font-size: .65rem; font-weight: 700; letter-spacing: .6px; background: rgba(76,201,240,.18); color: #4cc9f0; border: 1px solid rgba(76,201,240,.35); border-radius: 4px; padding: 1px 5px; vertical-align: middle; }

.stage-chevron {
  width: 16px; height: 16px;
  color: var(--muted);
  transition: transform .15s;
  flex-shrink: 0;
}
.stage-row.open .stage-chevron { transform: rotate(180deg); }
.stage-row-body { display: none; border-top: 1px solid var(--border); }
.stage-row.open .stage-row-body { display: block; }
.stage-images { display: flex; flex-direction: column; gap: 8px; padding: 10px 12px 0; }
.stage-images img { width: 100%; border-radius: 6px; display: block; }
.stage-img-label { font-size: .68rem; color: var(--muted); margin-top: 2px; }

/* ── Stage type badges & detail info ── */
.stage-type-badge { display: inline-block; font-size: .62rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; vertical-align: middle; margin-right: 2px; flex-shrink: 0; }
.stage-type-badge.mountain        { background: #6c3483; color: #fff; }
.stage-type-badge.medium_mountain { background: #9b59b6; color: #fff; }
.stage-type-badge.hilly           { background: #c0392b; color: #fff; }
.stage-type-badge.flat            { background: #27ae60; color: #fff; }
.stage-type-badge.ITT             { background: #2980b9; color: #fff; }
.stage-type-badge.TTT             { background: #16a085; color: #fff; }
.stage-info-line { font-size: .74rem; color: var(--muted); padding: 0 12px 7px; margin-top: -4px; }
.stage-description { font-size: .82rem; line-height: 1.55; color: var(--text); padding: 8px 12px 12px; border-top: 1px solid var(--border); }

/* ── Race Programme table ── */
.programme-toggle-row { display: flex; align-items: stretch; gap: 8px; border-bottom: 1px solid var(--border); }
.programme-toggle-row .programme-toggle { flex: 1; border-bottom: none; }
.riders-screen-btn { flex-shrink: 0; align-self: center; margin-right: 12px; font-size: .78rem; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid var(--border); border-radius: 12px; padding: 5px 12px; cursor: pointer; white-space: nowrap; }
.riders-screen-btn:hover { border-color: var(--accent); }
.programme-toggle { font-size: .8rem; color: var(--muted); cursor: pointer; padding: 6px 12px; display: flex; align-items: center; gap: 6px; user-select: none; border-bottom: 1px solid var(--border); }
.programme-toggle:hover { color: var(--text); }
.riders-screen-head { margin-bottom: 6px; }
.riders-screen-title { font-size: 1.1rem; font-weight: 800; line-height: 1.2; }
.riders-screen-sub { font-size: .82rem; color: var(--muted); margin-top: 3px; }
.programme-chev { font-size: .7rem; transition: transform .2s; }
.programme-body { display: none; overflow-x: auto; }
.programme-body.open { display: block; }
.programme-table { width: 100%; border-collapse: collapse; font-size: .76rem; }
.programme-table th { font-size: .65rem; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 5px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; }
.programme-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,.04); vertical-align: middle; white-space: nowrap; }
.programme-table tr:last-child td { border-bottom: none; }
.programme-table tr.stage-done td { color: var(--muted); }
.programme-table tr.stage-next td { color: var(--text); font-weight: 600; }
.programme-table tr.stage-rest td { color: var(--muted); font-style: italic; }
.prog-route { white-space: normal; max-width: 160px; line-height: 1.3; }
.prog-time { color: var(--upcoming); font-weight: 600; }
.prog-dist { color: var(--muted); }
.prog-elev { color: #a78bfa; }

/* ── Roadbook ── */
.roadbook-toggle { font-size: .75rem; color: var(--muted); cursor: pointer; padding: 5px 12px; display: flex; align-items: center; gap: 5px; border-top: 1px solid var(--border); user-select: none; }
.roadbook-toggle:hover { color: var(--text); }
.roadbook-body { display: none; overflow-x: auto; -webkit-overflow-scrolling: touch; max-height: 340px; overflow-y: auto; }
.roadbook-body.open { display: block; }
.roadbook-table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .72rem; }
.roadbook-table th { font-size: .62rem; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 4px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; text-align: left; position: sticky; top: 0; background: var(--surface2); }
.roadbook-table td { padding: 4px 8px; border-bottom: 1px solid rgba(255,255,255,.03); white-space: nowrap; }
.roadbook-table tr:last-child td { border-bottom: none; }
.rb-location { white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.rb-km { color: var(--muted); text-align: right; }
.rb-time { color: var(--upcoming); font-variant-numeric: tabular-nums; }
.rb-chrono { background: rgba(67,97,238,.08); font-weight: 600; }

/* ── Top-10 table ── */
.top10-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.top10-table th {
  text-align: left;
  padding: 7px 10px;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.top10-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
.top10-table tr:last-child td { border-bottom: none; }
.rank-cell { width: 32px; font-weight: 700; color: var(--muted); }
.rank-1 { color: var(--gold); }
.rank-2 { color: var(--silver); }
.rank-3 { color: var(--bronze); }
.time-cell { color: var(--muted); font-family: monospace; font-size: .82rem; white-space: nowrap; }
.team-cell { color: var(--muted); font-size: .78rem; }
/* Rider name must never break mid-name. On narrow screens the long team names
   ("Red Bull - BORA - hansgrohe") were squeezing the rider column until even
   short two-word names like "Eduardo Sepulveda" wrapped onto two lines, so the
   secondary Team column is dropped on phone widths to give the name room. */
.rider-cell { white-space: nowrap; }
.result-partial {
  font-size: .76rem;
  color: var(--muted);
  background: var(--surface2);
  border-left: 3px solid var(--upcoming);
  border-radius: 0;
  padding: 7px 10px;
  margin-bottom: 6px;
  line-height: 1.4;
}

/* ── Abandons / non-finishers panel ──────────────────────────────────────────
   Sits directly above a result table. Collapsed by default so it never pushes
   the actual result down the page; the summary line alone answers "who's out?". */
.dnf-panel { margin-bottom: 8px; }
.dnf-toggle {
  display: flex; align-items: center; gap: 7px; width: 100%;
  font-family: inherit; font-size: .76rem; font-weight: 600; text-align: left;
  color: var(--live);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--live);
  border-radius: 4px;
  padding: 6px 9px;
  cursor: pointer;
  line-height: 1.35;
}
.dnf-toggle:hover { background: var(--surface); }
.dnf-toggle .dnf-names {
  color: var(--muted); font-weight: 400;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
}
.dnf-toggle .dnf-chev { margin-left: auto; transition: transform .18s ease; flex-shrink: 0; }
.dnf-panel.open .dnf-toggle .dnf-chev { transform: rotate(180deg); }
.dnf-body { display: none; padding: 2px 0 0; }
.dnf-panel.open .dnf-body { display: block; }
.dnf-item {
  display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap;
  padding: 7px 9px;
  border: 1px solid var(--border); border-top: none;
  font-size: .8rem;
}
.dnf-item:first-child { border-top: 1px solid var(--border); }
.dnf-code {
  font-size: .64rem; font-weight: 700; letter-spacing: .04em;
  color: var(--live); background: rgba(230,57,70,.14);
  border-radius: 3px; padding: 1px 5px; flex-shrink: 0;
}
.dnf-item .dnf-team { color: var(--muted); font-size: .74rem; }
.dnf-item .dnf-why  { color: var(--muted); font-size: .72rem; flex-basis: 100%; line-height: 1.4; }
.dnf-note {
  font-size: .71rem; color: var(--muted); line-height: 1.45;
  padding: 7px 9px; border: 1px solid var(--border); border-top: none;
  background: var(--surface2);
}
@media (max-width: 520px) {
  .top10-table .team-cell,
  .top10-table .team-col { display: none; }
}

/* ── Upcoming dates ── */
.upcoming-dates { padding: 14px 16px; font-size: .9rem; color: var(--muted); }

/* ── Startlist ── */
.startlist-toggle { display:flex; align-items:center; gap:6px; padding:10px 16px; font-size:.85rem; font-weight:600; color:var(--muted); cursor:pointer; border-top:1px solid var(--border); user-select:none; }
.startlist-toggle:hover { color:var(--text); }
.startlist-body { display:none; padding:0 16px 12px; }
.startlist-teams { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:4px 16px; margin-top:6px; }
.startlist-team-name { font-size:.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin-top:10px; margin-bottom:2px; grid-column:1/-1; }
.startlist-rider { font-size:.82rem; color:var(--text); padding:1px 0; display:flex; align-items:center; gap:5px; }
.startlist-rider .flag-img { width:16px; height:11px; object-fit:cover; border-radius:1px; flex-shrink:0; }
.startlist-bib { font-size:.66rem; font-weight:700; color:var(--muted); min-width:22px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
.startlist-rider-out { opacity:.55; }
.startlist-rider-out .rider-name-link { text-decoration:line-through; }
.startlist-out-tag { font-size:.6rem; font-weight:700; letter-spacing:.3px; color:#f97316; border:1px solid rgba(249,115,22,.4); border-radius:8px; padding:0 5px; margin-left:2px; flex-shrink:0; }
.startlist-empty { font-size:.82rem; color:var(--muted); font-style:italic; }

/* ── Single-day winner ── */
.single-winner {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
  font-size: .95rem;
  font-weight: 600;
}
.single-winner .label {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--muted);
}

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom);
}
.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 6px 2px 4px;
  border: none;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-size: .72rem;
  font-weight: 600;
  gap: 3px;
}
.nav-btn .nav-icon { font-size: 1.25rem; position: relative; }
.nav-btn.active { color: var(--accent); }

.live-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--live);
  position: absolute;
  top: 0; right: -4px;
  animation: ping 1.5s infinite;
}
@keyframes ping { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.3)} }

/* ── Team cards ── */
.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 10px;
  overflow: hidden;
}
.team-card.uwt { border-left: 3px solid var(--gold); }
.team-card.pro  { border-left: 3px solid var(--upcoming); }

.team-header {
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  user-select: none;
  min-height: 70px;
}
.team-header:active { background: var(--surface2); }

.team-jersey-thumb {
  width: 52px;
  height: 52px;
  object-fit: contain;
  background: #fff;
  border-radius: 6px;
  padding: 4px;
  flex-shrink: 0;
}
.team-jersey-placeholder {
  width: 52px; height: 52px;
  background: var(--surface2);
  border-radius: 6px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4rem;
}

.team-title { flex: 1; min-width: 0; }
.team-name-text {
  font-size: .95rem;
  font-weight: 700;
  line-height: 1.3;
}
.team-meta { font-size: .78rem; color: var(--muted); margin-top: 3px; }

.team-body { display: none; border-top: 1px solid var(--border); }
.team-card.open .team-body { display: block; }
.team-card.open .chevron { transform: rotate(180deg); }

.roster-table { width: 100%; border-collapse: collapse; font-size: .85rem; }
.roster-table th {
  text-align: left;
  padding: 7px 10px;
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}
.roster-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.roster-table tr:last-child td { border-bottom: none; }
.roster-num { width: 28px; color: var(--muted); font-weight: 700; font-size: .78rem; }
.roster-age { color: var(--muted); font-size: .82rem; width: 36px; text-align: right; }

/* ── Rider profile in roster ── */
.rider-photo {
  width: 34px; height: 34px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 15%;
  background: var(--surface2);
  flex-shrink: 0;
}
.rider-photo-ph {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--surface2);
  border: 1px solid var(--border);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: .9rem;
}
.rider-row-wrap { border-bottom: 1px solid var(--border); }
.rider-row-wrap:last-child { border-bottom: none; }
.rider-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
}
.rider-row.clickable { cursor: pointer; }
.rider-row.clickable:active { background: var(--surface2); }
.rider-name-col { flex: 1; min-width: 0; }
.rider-bib {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 28px; height: 22px; padding: 0 5px; flex: none;
  border-radius: 6px; background: var(--surface2); border: 1px solid var(--border);
  color: var(--muted); font-size: .74rem; font-weight: 700; font-variant-numeric: tabular-nums;
}
.rider-bib.leader { background: var(--accent); color: #fff; border-color: var(--accent); }
.leader-star { font-size: .78rem; }
.team-tour-badge { font-weight: 700; color: var(--accent); white-space: nowrap; }
.rider-name-text { font-size: .88rem; font-weight: 600; }
.rider-sub { font-size: .72rem; color: var(--muted); margin-top: 1px; }
.wins-badge {
  font-size: .7rem; font-weight: 700;
  background: rgba(var(--accent-rgb),.15);
  color: var(--accent);
  border: 1px solid rgba(var(--accent-rgb),.3);
  border-radius: 10px;
  padding: 2px 7px;
  white-space: nowrap;
  flex-shrink: 0;
}
.rider-chevron {
  width: 14px; height: 14px;
  color: var(--muted);
  transition: transform .15s;
  flex-shrink: 0;
}
.rider-row-wrap.open .rider-chevron { transform: rotate(180deg); }

.wins-panel { display: none; background: var(--bg); }
.rider-row-wrap.open .wins-panel { display: block; }
.win-entry {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid var(--border);
  font-size: .82rem;
}
.win-entry:last-child { border-bottom: none; }
.win-year { color: var(--accent); font-weight: 700; font-size: .78rem; min-width: 32px; }
.win-race { flex: 1; }
.win-cat  { color: var(--muted); font-size: .72rem; }

/* ── Misc ── */
.empty {
  color: var(--muted);
  font-style: italic;
  text-align: center;
  padding: 32px 16px;
  font-size: .9rem;
}

#loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 60vh;
  color: var(--muted);
  font-size: 1rem;
}
/* ── Rider modal ── */
.rider-modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(0,0,0,.65);
  z-index: 1000;
  align-items: flex-end;
  justify-content: center;
}
.rider-modal-overlay.open { display: flex; }
.rider-modal {
  background: var(--surface);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-width: 520px;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px 16px 36px;
  box-shadow: 0 -4px 32px rgba(0,0,0,.4);
}
.rider-modal-handle {
  width: 36px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-exit-btn {
  position: sticky;
  top: 0;
  float: right;
  z-index: 6;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: -6px -4px 0 8px;
  padding: 9px 18px;
  background: var(--accent);
  color: var(--bg);
  border: none;
  border-radius: 999px;
  font-size: .92rem;
  font-weight: 800;
  letter-spacing: .3px;
  cursor: pointer;
  box-shadow: 0 2px 10px rgba(0,0,0,.28);
}
.modal-exit-btn:hover { filter: brightness(1.08); }
.modal-exit-btn:active { transform: translateY(1px); }
.rider-modal-header {
  display: flex;
  gap: 14px;
  align-items: center;
  margin-bottom: 16px;
}
.rider-modal-photo {
  width: 72px; height: 72px;
  border-radius: 50%;
  object-fit: cover;
  object-position: center 15%;
  border: 2px solid var(--border);
  flex-shrink: 0;
}
.rider-modal-photo-ph {
  width: 72px; height: 72px;
  border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 2rem; flex-shrink: 0;
}
.rider-modal-name { font-size: 1.1rem; font-weight: 800; line-height: 1.2; }
.rider-modal-meta { font-size: .82rem; color: var(--muted); margin-top: 3px; }
.rider-modal-section {
  font-size: .7rem; font-weight: 700; letter-spacing: 1px;
  text-transform: uppercase; color: var(--muted);
  border-bottom: 1px solid var(--border);
  padding-bottom: 5px; margin: 14px 0 8px;
}
.rider-modal-no-data { font-size: .85rem; color: var(--muted); font-style: italic; margin: 4px 0 8px; }
.spec-bars { padding: 4px 0 8px; }
.spec-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.spec-label { font-size: .72rem; color: var(--muted); width: 64px; flex-shrink: 0; text-align: right; }
.spec-track { flex: 1; height: 7px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.spec-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
.spec-score { font-size: .72rem; color: var(--text); width: 44px; text-align: right; flex-shrink: 0; }
.rider-name-link {
  cursor: pointer;
  color: var(--rider-name);
  text-decoration: underline;
  text-decoration-color: rgba(128,128,128,.35);
  text-underline-offset: 2px;
}
/* All rider names share one themeable colour (dark: #FFE66D) */
.rankings-name, .following-card-name, .classif-leader-name, .startlist-rider { color: var(--rider-name); }
/* ── Rider modal tabs ── */
.rider-tabs { display: flex; gap: 4px; margin: 14px 0 0; border-bottom: 1px solid var(--border); }
.rider-tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--muted); font-size: .78rem; font-weight: 600; padding: 6px 12px;
  cursor: pointer; margin-bottom: -1px; transition: color .2s, border-color .2s;
}
.rider-tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.rider-tab-panel { padding: 8px 0; }
/* ── Team history ── */
.team-history-list { padding: 4px 0 8px; }
.team-hist-row { display: flex; gap: 10px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--border); }
.team-hist-row:last-child { border-bottom: none; }
.team-hist-year { font-size: .78rem; font-weight: 700; color: var(--accent); min-width: 36px; flex-shrink: 0; }
.team-hist-name { font-size: .82rem; color: var(--text); }
/* ── Season results ── */
.season-results-list { font-size: .78rem; }
.season-results-header {
  display: grid; grid-template-columns: 44px 1fr 32px 36px;
  gap: 4px; color: var(--muted); font-size: .68rem; font-weight: 700;
  text-transform: uppercase; padding: 4px 0 6px; border-bottom: 1px solid var(--border);
}
.season-result-row {
  display: grid; grid-template-columns: 44px 1fr 32px 36px;
  gap: 4px; padding: 5px 0; border-bottom: 1px solid var(--border);
  align-items: center;
}
.season-result-row:last-child { border-bottom: none; }
.sr-date { color: var(--muted); font-size: .72rem; }
.sr-race { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-pos { color: var(--upcoming); font-weight: 700; text-align: center; }
.sr-pts { color: var(--muted); text-align: right; font-size: .72rem; }
/* ── Palmares on race cards ── */
.palmares-toggle-btn {
  font-size: .78rem; color: var(--muted); padding: 10px 14px 8px;
  cursor: pointer; border-top: 1px solid var(--border); margin-top: 10px;
  display: flex; justify-content: space-between; align-items: center;
  user-select: none; transition: color .2s;
}
.palmares-toggle-btn:hover { color: var(--text); }
.palmares-chev { font-size: .65rem; }
.palmares-body { padding: 0 14px 10px; }
.palmares-list { padding: 4px 0; }
.palmares-row {
  display: grid; grid-template-columns: 44px 1fr 1fr 1fr;
  gap: 6px; padding: 5px 0; font-size: .78rem;
  border-bottom: 1px solid var(--border); align-items: center;
}
.palmares-row:last-child { border-bottom: none; }
.palmares-year { font-weight: 700; color: var(--accent); }
.palmares-winner { font-weight: 600; }
.palmares-second, .palmares-third { color: var(--muted); font-size: .73rem; }

/* ── Rider search ── */
.rider-search-wrap {
  padding: 10px 14px 4px;
  background: var(--bg);
  position: relative;
}
.rider-search-input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .92rem;
  outline: none;
}
.rider-search-input:focus { border-color: var(--upcoming); }
.rider-search-icon {
  position: absolute;
  left: 26px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: .95rem;
  pointer-events: none;
}
/* ── Following tab ── */
.following-header {
  padding: 14px 14px 6px;
  font-size: .8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--muted);
}
.following-add-wrap {
  padding: 10px 14px 8px;
  position: relative;
}
.following-add-input {
  width: 100%;
  padding: 9px 14px 9px 36px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .92rem;
  outline: none;
  box-sizing: border-box;
}
.following-add-input:focus { border-color: var(--upcoming); }
.following-add-icon {
  position: absolute;
  left: 26px; top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  font-size: .95rem;
  pointer-events: none;
}
.following-search-results {
  display: none;
  max-height: 220px;
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin: 4px 14px 0;
}
.following-search-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: .88rem;
}
.following-search-row:last-child { border-bottom: none; }
.following-search-row:active { background: var(--surface2); }
.following-search-photo {
  width: 32px; height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface2);
}
.following-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.following-card:active { background: var(--surface2); }
.following-card-photo {
  width: 44px; height: 44px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--surface2);
}
.following-card-photo-ph {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: var(--surface2);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem;
  flex-shrink: 0;
}
.following-card-info { flex: 1; min-width: 0; }
.following-card-name { font-size: .93rem; font-weight: 700; }
.following-card-sub { font-size: .78rem; color: var(--muted); margin-top: 2px; }
.following-card-race {
  font-size: .78rem;
  color: var(--live);
  margin-top: 3px;
  font-weight: 600;
}
.following-card-result {
  font-size: .78rem;
  color: var(--upcoming);
  margin-top: 2px;
}
.following-unfollow {
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--muted);
  font-size: .75rem;
  padding: 4px 8px;
  cursor: pointer;
  flex-shrink: 0;
}
.following-unfollow:active { background: var(--surface2); color: var(--text); }
.following-empty {
  text-align: center;
  color: var(--muted);
  padding: 40px 20px;
  font-size: .9rem;
}
.follow-modal-btn {
  display: inline-block;
  margin-top: 10px;
  padding: 7px 18px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text);
  font-size: .82rem;
  font-weight: 600;
  cursor: pointer;
}
.follow-modal-btn.following {
  background: var(--upcoming);
  color: #fff;
  border-color: var(--upcoming);
}
.follow-modal-btn:active { opacity: .75; }

/* ── What's New banner ── */
#whats-new-banner {
  display: none;
  position: fixed;
  bottom: 70px;
  left: 50%;
  transform: translateX(-50%);
  width: min(480px, calc(100vw - 24px));
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--upcoming);
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,.25);
  z-index: 999;
  overflow: hidden;
  animation: slideUp .3s ease;
}
@keyframes slideUp { from { opacity:0; transform:translateX(-50%) translateY(16px); } to { opacity:1; transform:translateX(-50%) translateY(0); } }
#whats-new-banner.show { display: block; }
.wn-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid var(--border); }
.wn-title { font-weight:700; font-size:.9rem; color:var(--upcoming); }
.wn-close { background:none; border:none; color:var(--muted); font-size:1.1rem; cursor:pointer; padding:0 4px; line-height:1; }
.wn-close:hover { color:var(--text); }
.wn-list { max-height:220px; overflow-y:auto; padding:6px 0; }
.wn-entry { display:flex; gap:10px; align-items:flex-start; padding:7px 14px; font-size:.85rem; }
.wn-entry:hover { background:var(--border); }
.wn-icon { flex-shrink:0; font-size:1rem; line-height:1.4; }
.wn-text { color:var(--text); line-height:1.4; }
.wn-time { color:var(--muted); font-size:.72rem; margin-top:1px; }
.wn-footer { padding:8px 14px; border-top:1px solid var(--border); text-align:right; }
.wn-footer button { background:none; border:none; color:var(--upcoming); font-size:.8rem; font-weight:600; cursor:pointer; }

/* ── Stats section ── */
.stats-cat-bar { display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:12px; scrollbar-width:none; }
.stats-cat-bar::-webkit-scrollbar { display:none; }
.stats-cat-btn { flex-shrink:0; padding:5px 13px; border-radius:20px; border:1px solid var(--border);
  background:transparent; color:var(--muted); cursor:pointer; font-size:.78rem; font-weight:600; transition:all .15s; }
.stats-cat-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.stat-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; overflow:hidden; }
.stat-card-hdr { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; cursor:pointer; user-select:none; }
.stat-card-title { font-weight:700; font-size:.9rem; }
.stat-card-meta { font-size:.73rem; color:var(--muted); margin-top:2px; }
.stat-card-body { padding:0; display:none; overflow-x:auto; }
.stat-card-body.open { display:block; }
.stat-tbl { width:100%; border-collapse:collapse; font-size:.82rem; }
.stat-tbl th { padding:6px 10px; text-align:left; border-bottom:2px solid var(--border); color:var(--muted); font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap; }
.stat-tbl td { padding:7px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
.stat-tbl tr:last-child td { border-bottom:none; }
.stat-pos { color:var(--muted); font-size:.75rem; min-width:24px; }
.stats-loading { text-align:center; padding:60px 20px; color:var(--muted); }
/* Stats tab: uses the app theme variables, consistent with the Rankings tab */
#sec-stats .stats-cat-btn { background:var(--surface); color:var(--text); border-color:var(--border); }
#sec-stats .stats-cat-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
#sec-stats .stat-tbl td .stat-name { display:inline-flex; align-items:center; gap:6px; }
#sec-stats .stat-tbl td .stat-name > span { color:var(--rider-name); }
