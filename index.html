<script>
// ── Helpers ────────────────────────────────────────────────────────────────────

const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const flagImg = nat => { const c = natCode(nat); return c ? `<img src="https://flagcdn.com/16x12/${c}.png" width="16" height="11" style="vertical-align:middle;margin-right:4px;border-radius:1px" loading="lazy">` : ''; };

// Full country NAME -> ISO-3166 alpha-2, for flagcdn. data.json's rider_profiles
// store the nationality as a full name ("United Kingdom", "Italy") for 250/260
// riders, which override the correct 2-letter codes from rider_profiles.json and
// make flagcdn 404 (no flag). natCode() takes any number of candidate values and
// returns the first that's already a 2-letter code or maps from a known name.
const _NAT_NAMES = {
  'italy':'it','france':'fr','belgium':'be','spain':'es','united kingdom':'gb',
  'great britain':'gb','england':'gb','scotland':'gb','wales':'gb','australia':'au',
  'netherlands':'nl','denmark':'dk','germany':'de','norway':'no','united states':'us',
  'united states of america':'us','usa':'us','slovenia':'si','switzerland':'ch',
  'new zealand':'nz','colombia':'co','eritrea':'er','canada':'ca','czech republic':'cz',
  'czechia':'cz','austria':'at','ecuador':'ec','south africa':'za','portugal':'pt',
  'mexico':'mx','estonia':'ee','venezuela':'ve','hungary':'hu','israel':'il',
  'russian federation':'ru','russia':'ru','kazakhstan':'kz','ireland':'ie',
  'uruguay':'uy','ukraine':'ua','luxembourg':'lu','poland':'pl','slovakia':'sk',
  'latvia':'lv','lithuania':'lt','japan':'jp','china':'cn','brazil':'br',
  'argentina':'ar','costa rica':'cr','belarus':'by','croatia':'hr','finland':'fi',
  'sweden':'se','rwanda':'rw','algeria':'dz','turkey':'tr','greece':'gr',
};
function natCode(...cands) {
  for (const c of cands) {
    if (!c) continue;
    const v = String(c).trim().toLowerCase();
    if (/^[a-z]{2}$/.test(v)) return v;
    if (_NAT_NAMES[v]) return _NAT_NAMES[v];
  }
  return '';
}

// Hispanic/Lusophone naming convention: given name + paternal surname + maternal
// surname. TV graphics drop the maternal (final) surname, e.g.
// "Isaac del Toro Romero" -> "Isaac del Toro". We only do this for those
// nationalities so double-barrelled names elsewhere (van der Poel, Geoghegan
// Hart) are left intact. Returns the full name for anything that doesn't match.
const DROP_MATERNAL_NATS = new Set(['ES','MX','CO','AR','EC','VE','UY','PT','CL','PE','CR','GT','CU','BO','PY','BR','DO','PA','NI','HN','SV']);
const NAME_PARTICLES = new Set(['de','del','la','las','los','da','das','dos','di','y']);
function shortName(name, nat) {
  if (!name || !nat || !DROP_MATERNAL_NATS.has(String(nat).toUpperCase())) return name;
  let p = name.trim().split(/\s+/);
  if (p.length < 3) return name;                                   // nothing to drop
  const isPart = i => NAME_PARTICLES.has((p[i] || '').toLowerCase());

  // Compound maternal surname, e.g. "Pello Bilbao Lopez de Armentia". A particle
  // at index >= 3 means given + paternal already precede it, so keep just those
  // two -> "Pello Bilbao". Guarded on index >= 3 so "Juan Jose de la Cruz"
  // (particle at 2, where "de la Cruz" IS the surname) is left alone.
  const firstPart = p.findIndex((_, i) => isPart(i));
  if (firstPart >= 3) return p.slice(0, 2).join(' ');

  // 1. Drop the maternal (final) surname -- unless the name ends in a particle
  //    construction like "... de la Cruz", which must stay whole.
  if (!isPart(p.length - 2)) p = p.slice(0, -1);

  // 2. Still 3+ parts means there's a second given name too
  //    ("Jonathan Klever Caicedo"). Drop it -> "Jonathan Caicedo". Skipped when
  //    a particle is involved, so "Isaac del Toro" / "David De La Cruz" survive.
  if (p.length >= 3 && !isPart(1) && !isPart(p.length - 2)) {
    p = [p[0], ...p.slice(2)];
  }
  return p.join(' ');
}

function chevron(cls) {
  return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="6 9 12 15 18 9"/></svg>`;
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', {day:'numeric', month:'short'});
}
function dateRange(s, e) {
  if (!s) return '';
  return (!e || s===e) ? fmtDate(s) : `${fmtDate(s)} – ${fmtDate(e)}`;
}
function daysUntil(iso) {
  if (!iso) return 999;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((new Date(iso+'T00:00:00') - today) / 86400000);
}

// ── Tab switching ──────────────────────────────────────────────────────────────

let currentTab = 'live';

function showSec(name, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  btn.classList.add('active');
  currentTab = name;
  // Hide filter bars on non-race tabs
  const isFantasy   = name === 'fantasy';
  const isStats     = name === 'stats';
  const isFollowing = name === 'following';
  const isRankings  = name === 'rankings';
  const isHelp      = name === 'help';
  document.getElementById('filter-bar').style.display = (isFantasy||isStats||isFollowing||isRankings||isHelp) ? 'none' : '';
  // Swap race/team chips
  const isTeams = name === 'teams';
  document.querySelectorAll('.race-chip').forEach(c => c.style.display = (isTeams||isStats||isFollowing||isRankings||isHelp) ? 'none' : '');
  document.querySelectorAll('.team-chip').forEach(c => c.style.display = (isTeams&&!isStats&&!isFollowing&&!isRankings&&!isHelp) ? '' : 'none');
  if (!isFantasy && !isStats && !isFollowing && !isRankings && !isHelp) applyFilter(curFilter);
  if (isFantasy)   renderFantasy();
  if (isStats)     loadStats();
  if (isFollowing) renderFollowing();
  if (isRankings)  loadRankings();
  if (isHelp)      renderHelp();
}

// ── Filter ─────────────────────────────────────────────────────────────────────

let curFilter = 'ALL';

function setFilter(f, el) {
  curFilter = f;
  document.querySelectorAll('#filter-bar .filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
}

function applyFilters() {
  const f = curFilter;
  // Race cards
  document.querySelectorAll('.race-card').forEach(card => {
    const cat = (card.dataset.cat || '').toUpperCase();
    const stages = parseInt(card.dataset.stages || '1', 10);
    let show = true;
    if      (f === 'GRANDTOURS') show = card.dataset.grandtour === 'true';
    else if (f === 'MONUMENTS')  show = card.dataset.monument  === 'true';
    else if (f === 'UWT')        show = cat.includes('UWT');
    else if (f === 'PRO')        show = cat.includes('PRO');
    else if (f === '1.1')        show = cat.startsWith('1.') || (cat.startsWith('2.') && !cat.includes('UWT') && !cat.includes('PRO'));
    else if (f === 'THISWEEK') {
      const now  = new Date(); now.setHours(0,0,0,0);
      const soon = new Date(now.getTime() + 8*24*3600*1000);
      const s = card.dataset.start ? new Date(card.dataset.start+'T00:00:00') : null;
      const e = card.dataset.end   ? new Date(card.dataset.end  +'T00:00:00') : s;
      show = s && s <= soon && e >= now;
    }
    card.style.display = show ? '' : 'none';
  });
  // Team cards — hide for race-specific filters
  const raceOnly = ['GRANDTOURS','MONUMENTS','1.1'];
  document.querySelectorAll('.team-card').forEach(card => {
    const cat = (card.dataset.cat || '').toUpperCase();
    let show = true;
    if      (raceOnly.includes(f)) show = false;
    else if (f === 'UWT')          show = cat === 'UWT';
    else if (f === 'PRO')          show = cat === 'PRO';
    card.style.display = show ? '' : 'none';
  });
}

function applyFilter() { applyFilters(); }

// ── Top-10 table ───────────────────────────────────────────────────────────────

// A fully-published field. Fewer rows, or rows without times, means the source
// is still publishing. Keep in sync with RESULT_EXPECTED_ROWS in scraper.py.
const RESULT_EXPECTED_ROWS = 10;

// valueLabel: the last column holds a time/gap for stage + GC tables, but
// POINTS for the Points and KOM classifications -- labelling those "Time" made
// the numbers look like broken times.
// ── Abandons / non-finishers ─────────────────────────────────────────────────
// A rider who abandons simply disappeared from the app: the result table only
// holds the top 10, so someone who crashed out mid-stage left no trace at all.
// CyclingFlash lists them at the foot of the same result page with a status code
// where the rank would be (DNF/DNS/OTL/...); the scraper now keeps those rows in
// `non_finishers` and this renders them as a collapsed strip above the result.
//
// The source publishes the STATUS, not the reason — it says a rider did not
// finish, never "broken collarbone". So this explains what the code means and
// leaves the cause alone rather than inventing an injury.
const DNF_CODE_LABELS = {
  DNF: 'Did not finish — abandoned during the stage.',
  DNS: 'Did not start — withdrew before the stage began.',
  OTL: 'Outside the time limit — finished too far behind the winner and was eliminated.',
  HD:  'Outside the time limit (hors délai) — eliminated on time.',
  DSQ: 'Disqualified.',
  DQ:  'Disqualified.',
  ABD: 'Abandoned.',
  NR:  'No result recorded for this rider.',
  DF:  'Finished, but no result was recorded.'
};

function renderNonFinishers(rows, uid) {
  if (!rows || !rows.length) return '';
  const n = rows.length;
  // Summary line: names only, so the collapsed strip already answers the
  // question most of the time without needing to expand it.
  const names = rows.slice(0, 3)
    .map(r => shortName(r.name || '', r.nat_code || r.nat || ''))
    .filter(Boolean).join(', ');
  const more = n > 3 ? ` +${n - 3} more` : '';
  const codesUsed = [...new Set(rows.map(r => (r.status || '').toUpperCase()))].filter(c => DNF_CODE_LABELS[c]);

  const items = rows.map(r => {
    const code = (r.status || '').toUpperCase();
    const why  = r.status_label || DNF_CODE_LABELS[code] || '';
    const slug = (r.rider_url || '').replace('/profile/', '').replace(/^\/+/, '').trim();
    const disp = shortName(r.name || '', r.nat_code || r.nat || '');
    const titleAttr = (disp !== (r.name || '')) ? ` title="${esc(r.name || '')}"` : '';
    const nameEl = slug
      ? `<span class="rider-name-link"${titleAttr} onclick="event.stopPropagation();openRiderModal('${esc(slug)}')">${esc(disp)}</span>`
      : `<span${titleAttr}>${esc(disp)}</span>`;
    return `<div class="dnf-item">
      <span class="dnf-code">${esc(code || '—')}</span>
      ${flagImg(r.nat_code || r.nat || '')}${nameEl}
      ${r.team ? `<span class="dnf-team">${esc(r.team)}</span>` : ''}
      ${why ? `<span class="dnf-why">${esc(why)}</span>` : ''}
    </div>`;
  }).join('');

  const legend = codesUsed.length
    ? `<div class="dnf-note">${codesUsed.map(c => `<strong>${esc(c)}</strong> — ${esc(DNF_CODE_LABELS[c])}`).join('<br>')}
       <br>Source publishes the status only, not the cause — an abandon may be a crash, illness or a withdrawal, and the reason isn't recorded here.</div>`
    : '';

  return `<div class="dnf-panel" id="${uid}">
    <button type="button" class="dnf-toggle" onclick="event.stopPropagation();toggleDnf('${uid}')" aria-expanded="false">
      <span>⚠ ${n} ${n === 1 ? 'rider' : 'riders'} out</span>
      <span class="dnf-names">${esc(names)}${esc(more)}</span>
      <span class="dnf-chev">▾</span>
    </button>
    <div class="dnf-body">${items}${legend}</div>
  </div>`;
}

function toggleDnf(uid) {
  const el = document.getElementById(uid);
  if (!el) return;
  el.classList.toggle('open');
  el.querySelector('.dnf-toggle')?.setAttribute('aria-expanded', el.classList.contains('open') ? 'true' : 'false');
}

function renderTop10(rows, valueLabel = 'Time') {
  if (!rows || !rows.length) return '<p class="empty">No results.</p>';
  const isTTT = rows.some(r => r.is_ttt);
  // Say plainly when the source has only published part of a field, so a short
  // table (3 riders, no times) reads as "not published yet" and not as a bug.
  const lowerLabel = valueLabel.toLowerCase() === 'pts' ? 'points' : 'times';
  const missingTimes = rows.filter(r => !String(r.time_gap || '').trim()).length;
  const partialNote = (rows.length < RESULT_EXPECTED_ROWS || missingTimes)
    ? `<div class="result-partial">Partial data — the results source has published ${rows.length} ${rows.length === 1 ? 'entry' : 'entries'}${missingTimes ? (rows.length === missingTimes ? ` without ${lowerLabel}` : ` (${missingTimes} without ${lowerLabel})`) : ''}. This updates automatically when more is available.</div>`
    : '';
  const riderHeader = isTTT ? 'Team' : 'Rider';
  // Classification tables (GC/Points/KOM) often carry no team at all -- the empty
  // column still reserved width and squeezed rider names onto two lines, so only
  // render Team when at least one row actually has one.
  const showTeam = !isTTT && rows.some(r => (r.team || '').trim());
  return `${partialNote}<table class="top10-table">
    <thead><tr><th>#</th><th>${riderHeader}</th>${showTeam ? '<th class="team-col">Team</th>' : ''}<th>${esc(valueLabel)}</th></tr></thead>
    <tbody>${rows.map(r => {
      const slug = (r.rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim();
      const disp = isTTT ? r.name : shortName(r.name, r.nat_code||r.nat||'');
      const titleAttr = (disp !== r.name) ? ` title="${esc(r.name)}"` : '';
      const nameEl = (!isTTT && slug)
        ? `<span class="rider-name-link"${titleAttr} onclick="openRiderModal('${esc(slug)}')">${esc(disp)}</span>`
        : `<span${titleAttr}>${esc(disp)}</span>`;
      return `<tr>
        <td class="rank-cell ${r.rank<=3?'rank-'+r.rank:''}">${r.rank}</td>
        <td class="rider-cell">${flagImg(r.nat_code||r.nat||'')}${nameEl}</td>
        ${showTeam ? `<td class="team-cell">${esc(r.team||'')}</td>` : ''}
        <td class="time-cell">${esc(r.time_gap||'')}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

// ── Classifications ────────────────────────────────────────────────────────────

function renderLeaders(race) {
  const defs = [
    {leaderKey:'gc_leader',     top10Key:'gc_top10',     label:'GC',      badgeCls:'badge-gc',       valueLabel:'Time'},
    {leaderKey:'points_leader', top10Key:'points_top10', label:'Points',  badgeCls:'badge-points',   valueLabel:'Pts'},
    {leaderKey:'kom_leader',    top10Key:'kom_top10',    label:'KOM',     badgeCls:'badge-mountain', valueLabel:'Pts'},
    {leaderKey:'youth_leader',  top10Key:'youth_top10',  label:'Youth',   badgeCls:'badge-youth',    valueLabel:'Time'},
  ];
  const rows = defs.filter(d => race[d.leaderKey]).map((d, i) => {
    const uid = `cl-${race._uid||Math.random().toString(36).slice(2)}-${i}`;
    const top10 = race[d.top10Key] || [];
    const hasTop10 = top10.length > 0;
    // Get leader slug from top10 first entry for profile tap
    const leaderSlug = top10.length ? (top10[0].rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim() : '';
    const leaderNat  = top10.length ? (top10[0].nat_code||top10[0].nat||'') : '';
    const leaderName = top10.length ? top10[0].name : (race[d.leaderKey]||'').replace(/^[^ ]+ /, '');
    const leaderDisplay = flagImg(leaderNat) + esc(shortName(leaderName, leaderNat));
    const leaderNameEl = leaderSlug
      ? `<span class="classif-leader-name rider-name-link" onclick="event.stopPropagation();openRiderModal('${esc(leaderSlug)}')">${leaderDisplay}</span>`
      : `<span class="classif-leader-name">${leaderDisplay}</span>`;
    return `<div class="classif-row${hasTop10?' clickable':''}" id="${uid}">
      <div class="classif-row-header"${hasTop10 ? ` onclick="toggleClassif('${uid}')"` : ''}>
        <span class="classif-badge ${d.badgeCls}">${d.label}</span>
        ${leaderNameEl}
        ${hasTop10 ? chevron('classif-chevron') : ''}
      </div>
      ${hasTop10 ? `<div class="classif-row-body">${renderTop10(top10, d.valueLabel || 'Time')}</div>` : ''}
    </div>`;
  }).join('');
  return rows ? `<div class="classif-section"><div class="classif-title">Classifications</div>${rows}</div>` : '';
}

function toggleClassif(uid) { document.getElementById(uid)?.classList.toggle('open'); }

// ── Stage images (height profile + route map) ───────────────────────────────

function renderStageImages(s) {
  const hp = s.height_profile_img;
  const rt = s.route_img;
  if (!hp && !rt) return '';
  return `<div class="stage-images">
    ${hp ? `<div><img src="${esc(hp)}" alt="Height profile" loading="lazy" referrerpolicy="no-referrer"><div class="stage-img-label">Height profile</div></div>` : ''}
    ${rt ? `<div><img src="${esc(rt)}" alt="Route map" loading="lazy" referrerpolicy="no-referrer"><div class="stage-img-label">Route map</div></div>` : ''}
  </div>`;
}

// ── Stage type badge ─────────────────────────────────────────────────────────

function renderStageBadge(s) {
  const t = s.stage_type;
  if (!t) return '';
  const labels = { mountain: '⛰ Mountain', medium_mountain: '🏔 Med Mountain', hilly: '〰 Hilly', flat: '▬ Flat', ITT: '⏱ ITT', TTT: '⏱ TTT' };
  return `<span class="stage-type-badge ${esc(t)}">${labels[t] || esc(t)}</span>`;
}

function renderStageInfo(s) {
  const parts = [];
  if (s.date_str) parts.push(s.date_str);
  if (s.start_time) parts.push(`🕐 ${esc(s.start_time)}`);
  if (s.start_town && s.finish_town) parts.push(`${esc(s.start_town)} → ${esc(s.finish_town)}`);
  if (s.distance_km) parts.push(`${s.distance_km} km`);
  if (s.elevation_m) parts.push(`↑${Number(s.elevation_m).toLocaleString()} m`);
  return parts.length ? `<div class="stage-info-line">${parts.join(' · ')}</div>` : '';
}

function renderProgramme(race, cardId) {
  const stages = race.stages || [];
  if (stages.length < 2) return '';
  const today = new Date().toISOString().slice(0,10);
  const done  = race.stages_completed || 0;

  const BADGE = {mountain:'🏔',medium_mountain:'⛰',hilly:'🏘',flat:'➡',ITT:'⏱',TTT:'👥'};

  const rows = stages.map((s, i) => {
    const isRest = s.label && /rest/i.test(s.label);
    const isDone = s.winner || (s.top10 && s.top10.length) || i < done;
    const isNext = !isDone && !isRest && stages.slice(0, i).every((p, j) => p.winner || j >= done);
    const cls = isRest ? 'stage-rest' : isDone ? 'stage-done' : isNext ? 'stage-next' : '';
    const typeIcon = BADGE[s.stage_type] || '';
    const route = (s.start_town && s.finish_town)
      ? `${esc(s.start_town)} → ${esc(s.finish_town)}`
      : (s.label ? esc(s.label) : '');
    const dist  = s.distance_km ? `${s.distance_km} km` : '—';
    const elev  = s.elevation_m ? `↑${Number(s.elevation_m).toLocaleString()}` : '';
    const time  = s.start_time  ? `<span class="prog-time">${esc(s.start_time)}</span>` : '—';
    const date  = s.date_str    ? `<span style="opacity:.7">${esc(s.date_str)}</span>` : '';
    const winnerCell = s.winner
      ? (() => {
          const slug = (s.top10 && s.top10[0]) ? (s.top10[0].rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim() : '';
          const wnat = (s.top10 && s.top10[0]) ? (s.top10[0].nat_code||s.top10[0].nat||'') : '';
          const wdisp = shortName(s.winner, wnat);
          const wtitle = (wdisp !== s.winner) ? ` title="${esc(s.winner)}"` : '';
          return slug
            ? `<span class="rider-name-link"${wtitle} onclick="event.stopPropagation();openRiderModal('${esc(slug)}')">${esc(wdisp)}</span>`
            : `<span${wtitle}>${esc(wdisp)}</span>`;
        })()
      : '';
    return `<tr class="${cls}">
      <td>${date}</td>
      <td style="font-weight:700">${typeIcon} St.${s.num}</td>
      <td class="prog-route">${route}</td>
      <td class="prog-dist">${dist}</td>
      <td class="prog-elev">${elev}</td>
      <td>${time}</td>
      <td>${winnerCell}</td>
    </tr>`;
  }).join('');

  const pid = `prog-${cardId}`;
  const slLen = ridersForRace(race).length;
  const ridersBtn = slLen
    ? `<button class="riders-screen-btn" onclick="event.stopPropagation();openRidersModal('${cardId}')">👥 Riders (${slLen})</button>`
    : '';
  return `<div class="programme-toggle-row">
    <div class="programme-toggle" onclick="toggleProgramme('${pid}')">
      📋 Full Programme (${stages.length} stages) <span class="programme-chev" id="${pid}-chev">▼</span>
    </div>${ridersBtn}
  </div>
  <div class="programme-body" id="${pid}">
    <table class="programme-table">
      <thead><tr>
        <th>Date</th><th>Stage</th><th>Route</th><th>Dist</th><th>Elev</th><th>Start</th><th>Winner</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleProgramme(pid) {
  const body = document.getElementById(pid);
  const chev = document.getElementById(pid + '-chev');
  if (!body) return;
  const open = body.classList.toggle('open');
  if (chev) chev.textContent = open ? '▲' : '▼';
}

function renderRoadbook(s, uid) {
  const rb = s.roadbook;
  if (!rb || !rb.length) return '';
  const rbId = 'rb-' + uid;
  const rows = rb.map(r => {
    const isChrono = r.location && r.location.toLowerCase().includes('chrono');
    const cls = isChrono ? 'rb-chrono' : '';
    return `<tr class="${cls}">
      <td class="rb-location">${esc(r.location || '')}</td>
      <td class="rb-km">${r.km_finish != null ? r.km_finish : ''}</td>
      <td class="rb-km">${r.km_start  != null ? r.km_start  : ''}</td>
      <td class="rb-time">${esc(r.caravan_time || '')}</td>
      <td class="rb-time">${esc(r.peloton_time || '')}</td>
      <td class="rb-time">${esc(r.director_time || '')}</td>
    </tr>`;
  }).join('');
  return `<div class="roadbook-toggle" onclick="toggleRoadbook('${rbId}')">
    🗺️ Timetable (${rb.length} points) <span id="${rbId}-chev" style="font-size:.7rem">▲</span>
  </div>
  <div class="roadbook-body open" id="${rbId}">
    <table class="roadbook-table">
      <thead><tr>
        <th>Location</th><th>← Fin</th><th>Start →</th>
        <th>Caravan</th><th>Peloton</th><th>Dir.</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>
  </div>`;
}

function toggleRoadbook(id) {
  const body = document.getElementById(id);
  const chev = document.getElementById(id + '-chev');
  if (!body) return;
  const open = body.classList.toggle('open');
  if (chev) chev.textContent = open ? '▲' : '▼';
}

// ── Stages ─────────────────────────────────────────────────────────────────────

function renderStages(stages, cardId) {
  if (!stages || !stages.length) return '';
  // Find highest stage number that has actual result data
  const lastWithData = stages.reduce((mx, s) =>
    (s.winner || (s.top10 && s.top10.length)) ? Math.max(mx, s.num) : mx, 0);
  const rows = stages.map(s => {
    const uid = `s-${cardId}-${s.num}`;
    const hasResults = s.winner || (s.top10 && s.top10.length);
    const hasDetails = !!(s.distance_km || s.description || s.height_profile_img || s.route_img || s.roadbook?.length);
    const clickable   = hasResults || hasDetails;
    const laterHasData = !hasResults && s.num < lastWithData;

    // Build winner / status element
    let winnerEl = '';
    if (hasResults) {
      const isTTT = s.top10 && s.top10.length && s.top10[0].is_ttt;
      const winSlug = (!isTTT && s.top10 && s.top10[0]) ? (s.top10[0].rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim() : '';
      const prefix = isTTT ? '<span class="ttt-badge">TTT</span> ' : flagImg(s.winner_nat||'');
      // Stage winners were rendered raw here, so long Hispanic/Lusophone names
      // ("Abner Santiago Umba Lopez") still wrapped over three lines even after
      // shortName() was applied everywhere else. nat falls back to the top10 row.
      const winNat = s.winner_nat || (s.top10 && s.top10[0] ? (s.top10[0].nat_code || s.top10[0].nat || '') : '');
      const wDisp  = isTTT ? (s.winner||'') : shortName(s.winner||'', winNat);
      const wTitle = (wDisp !== (s.winner||'')) ? ` title="${esc(s.winner||'')}"` : '';
      const wName = winSlug
        ? `<span class="rider-name-link"${wTitle} onclick="event.stopPropagation();openRiderModal('${esc(winSlug)}')">${esc(wDisp)}</span>`
        : `<span${wTitle}>${esc(wDisp)}</span>`;
      winnerEl = `<span class="stage-winner-name">${prefix}${wName}</span>`;
    } else if (s.cancelled) {
      winnerEl = `<span class="stage-cancelled">Cancelled</span>`;
    } else if (laterHasData) {
      winnerEl = `<span class="stage-no-data">Result unavailable</span>`;
    }
    // (no "Not yet run" label — the stage type badge + info line carry that context)

    const stageInfo = renderStageInfo(s);
    const descEl = s.description ? `<div class="stage-description">${esc(s.description)}</div>` : '';
    const roadbookEl = renderRoadbook(s, uid);
    // Abandons go ABOVE the result table — a rider who crashed out is the news
    // of the stage, and burying it under the top 10 defeats the point.
    const dnfEl = hasResults ? renderNonFinishers(s.non_finishers, `dnf-${uid}`) : '';
    const bodyContent = `${renderStageImages(s)}${descEl}${dnfEl}${hasResults ? renderTop10(s.top10) : ''}${roadbookEl}`;

    return `<div class="stage-row" id="${uid}">
      <div class="stage-row-header${clickable?' clickable':''}"${clickable?` onclick="toggleStage('${uid}')"`:''}">
        <span class="stage-num">Stage ${s.num}</span>
        ${renderStageBadge(s)}
        ${winnerEl}
        ${clickable ? chevron('stage-chevron') : ''}
      </div>
      ${stageInfo}
      ${clickable ? `<div class="stage-row-body">${bodyContent}</div>` : ''}
    </div>`;
  }).join('');
  const hasAnyResults = stages.some(s => s.winner || s.top10?.length);
  return `<div class="stages-title">${hasAnyResults ? 'Stage Results' : 'Route'}</div>${rows}`;
}

function toggleStage(uid) { document.getElementById(uid)?.classList.toggle('open'); }

// ── Race card ──────────────────────────────────────────────────────────────────

let cardIdx = 0;
const _racesByUid = {};   // race._uid -> race, populated in renderRaceCard

// Rider list for a race, startlist-shaped ([{name,nat,team,slug,bib?}]).
// Uses the race's own startlist when it has one; otherwise, for the race the
// Tour-bibs file covers, reconstructs the field from the team rosters. A live
// Grand Tour drops its startlist array (CyclingFlash removes the startlist page
// once racing begins), but tour_bibs.json + team rosters still know exactly who
// is in it — that's the same data the Teams page uses for bibs.
// Preserve a race's field post-race. CyclingFlash serves the startlist only
// while a race is upcoming, then empties the array once it's live/finished. We
// cache the last non-empty startlist per slug in localStorage so the riders
// stay attached to the race afterwards — for every race, not just the Tour.
function _slCacheKey(slug) { return 'uci_sl_' + slug; }
function cacheStartlist(race) {
  try {
    const sl = race.startlist || [];
    if (sl.length && race.slug) localStorage.setItem(_slCacheKey(race.slug), JSON.stringify(sl));
  } catch (e) {}
}
function cachedStartlist(slug) {
  try { const v = localStorage.getItem(_slCacheKey(slug)); return v ? JSON.parse(v) : []; }
  catch (e) { return []; }
}

function ridersForRace(race) {
  const sl = race.startlist || [];
  if (sl.length) { cacheStartlist(race); return sl; }   // live source + snapshot it
  // Tour (or any race tour_bibs.json covers): reconstruct from team rosters +
  // bibs. Kept live AND post-race so the field — with bib numbers — persists.
  if (race && race.slug && tourBibsMeta && race.slug === tourBibsMeta.race_slug
      && Object.keys(tourBibs).length) {
    const out = [];
    for (const team of (appData.teams || [])) {
      for (const r of (team.riders || [])) {
        if (tourBibs[r.slug] != null) {
          out.push({ name: r.name, nat: r.nat, team: team.name, slug: r.slug, bib: tourBibs[r.slug] });
        }
      }
    }
    if (out.length) { out.sort((a, b) => (a.bib ?? 9999) - (b.bib ?? 9999)); return out; }
  }
  // Preserved snapshot from when the race was upcoming.
  if (race && race.slug) { const c = cachedStartlist(race.slug); if (c.length) return c; }
  return [];
}

// Riders who left the race, slug -> status code (DNF/DNS/OTL/…), gathered from
// every stage's non_finishers. Used to strike abandons out of the field.
function abandonedSlugs(race) {
  const m = {};
  for (const s of (race.stages || [])) {
    for (const nf of (s.non_finishers || [])) {
      const slug = (nf.rider_url || '').replace('/profile/', '').replace(/^\/+|\/+$/g, '').trim();
      if (slug) m[slug] = nf.status || 'DNF';
    }
  }
  return m;
}

// True while the race tour_bibs.json covers is still live. Once the Tour
// finishes, the Teams tab drops its bib annotations (the bibs stay on the
// per-race Riders screen, which reads them straight from tour_bibs.json).
function tourBibsActive() {
  return !!(tourBibsMeta && (appData.live || []).some(r => r.slug === tourBibsMeta.race_slug));
}

// Shared startlist markup, used by both the inline startlist toggle and the
// full-screen Riders modal ("both places"). Rider names go through shortName()
// so the maternal (final) surname is dropped for Hispanic/Lusophone riders,
// matching the rest of the app — the full name stays as a hover title. Names
// are clickable (they carry a slug) and open the rider modal.
function startlistTeamsHtml(sl, abandoned) {
  abandoned = abandoned || {};
  const OUT_LABEL = { DNF: 'Abandoned', DNS: 'Did not start', OTL: 'Outside time limit',
                      DSQ: 'Disqualified', HD: 'Outside time limit', ABD: 'Abandoned',
                      NR: 'Did not finish', DF: 'Did not finish' };
  const teams = {};
  const teamOrder = [];
  for (const r of sl) {
    const t = r.team || 'Unknown';
    if (!teams[t]) { teams[t] = []; teamOrder.push(t); }
    teams[t].push(r);
  }
  let rows = '';
  for (const t of teamOrder) {
    rows += `<div class="startlist-team-name">${esc(t)}</div>`;
    for (const r of teams[t]) {
      const flagHtml = r.nat
        ? `<img class="flag-img" src="https://flagcdn.com/16x12/${esc(r.nat.toLowerCase())}.png" alt="${esc(r.nat)}" loading="lazy">`
        : '';
      const bibHtml = (r.bib != null) ? `<span class="startlist-bib">${esc(String(r.bib))}</span>` : '';
      const disp  = shortName(r.name || '', r.nat || '');
      const title = (disp !== (r.name || '')) ? ` title="${esc(r.name || '')}"` : '';
      const inner = r.slug
        ? `<span class="rider-name-link"${title} onclick="event.stopPropagation();openRiderModal('${esc(r.slug)}')">${esc(disp)}</span>`
        : `<span${title}>${esc(disp)}</span>`;
      const out = r.slug ? abandoned[r.slug] : null;
      const outTag = out ? `<span class="startlist-out-tag" title="${esc(OUT_LABEL[out] || 'Out of the race')}">${esc(out)}</span>` : '';
      rows += `<div class="startlist-rider${out ? ' startlist-rider-out' : ''}">${bibHtml}${flagHtml}${inner}${outTag}</div>`;
    }
  }
  return `<div class="startlist-teams">${rows}</div>`;
}

function renderStartlist(race) {
  const sl = ridersForRace(race);
  if (!sl.length) return '';
  const abandoned = abandonedSlugs(race);
  return `<div class="startlist-toggle" onclick="event.stopPropagation();this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block';this.querySelector('.sl-chev').textContent=this.nextElementSibling.style.display==='block'?'▲':'▼'">
    <span>👥 Startlist (${sl.length} riders)</span><span class="sl-chev">▼</span>
  </div>
  <div class="startlist-body" style="display:none">${startlistTeamsHtml(sl, abandoned)}</div>`;
}

// Full-screen Riders modal — same riders as the inline startlist, on a
// dedicated screen opened from the button beside the Full Programme toggle.
function openRidersModal(uid) {
  const race = _racesByUid[uid];
  if (!race) return;
  const sl = ridersForRace(race);
  const abandoned = abandonedSlugs(race);
  const outCount = sl.filter(r => r.slug && abandoned[r.slug]).length;
  const content = document.getElementById('ridersScreenContent');
  content.innerHTML = `
    <div class="riders-screen-head">
      <div class="riders-screen-title">🚴 ${esc(race.name || race.slug || 'Riders')}</div>
      <div class="riders-screen-sub">${sl.length} riders${outCount ? ` · ${outCount} out` : ''}</div>
    </div>
    ${sl.length ? startlistTeamsHtml(sl, abandoned) : '<p class="rider-modal-no-data">Startlist not available yet.</p>'}`;
  document.getElementById('ridersScreen').classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeRidersModal(e) {
  if (!e || e.target === document.getElementById('ridersScreen')) {
    document.getElementById('ridersScreen').classList.remove('open');
    document.body.style.overflow = '';
  }
}

// ── Startlist completeness helpers ────────────────────────────────────────────
function slExpected(race) {
  const s = race.total_stages || 1;
  if (s >= 21) return 184;   // Grand Tour: 23 teams × 8 riders
  if (s >= 5)  return 140;   // Big stage race: ~25 teams × ~6
  if (s >= 2)  return 80;    // Short stage race
  return 120;                 // 1-day race
}
function slStatus(race) {
  const count = (race.startlist||[]).length;
  if (count === 0) return 'none';
  // Once a race has actually started (or finished) its startlist can't
  // change anymore -- teams can't add a rider mid-race. slExpected() is
  // only a rough team-count*riders-per-team guess (e.g. 140 for any 5+
  // stage race), and smaller/atypical fields (a 22-team race with 6-7
  // riders each, say) will never hit 95% of that guess even though the
  // real, final startlist is already fully known. Without this, a live
  // race could sit at "partial" forever -- see the 2026-07 Tour of Austria
  // report: 130 confirmed starters, live and on stage 3 of 5, still
  // showing "partial" against a hardcoded 140 target. Trust reality (the
  // race is underway/done) over the heuristic.
  if (race.status === 'live' || race.status === 'recent') return 'complete';
  if (count >= slExpected(race) * 0.95) return 'complete';
  return 'partial';
}

function renderRaceCard(race, status) {
  const id = `rc-${cardIdx++}`;
  race._uid = id;
  _racesByUid[id] = race;   // registry so openRidersModal() can find the startlist
  const total = race.total_stages || 1;
  const done  = race.stages_completed || 0;
  const multi = total > 1;
  const upcoming = status === 'upcoming';

  const stagePill = multi
    ? (upcoming ? `${total} stages` : `${done}/${total} stages`)
    : '1-day';

  let body = '';
  const slCount = (race.startlist||[]).length;
  const _slSt = slStatus(race);
  const slBadge = upcoming
    ? (_slSt === 'complete'
      ? `<span style="font-size:.72rem;background:rgba(45,211,111,.12);color:#2dd36f;border:1px solid rgba(45,211,111,.35);border-radius:12px;padding:2px 8px;font-weight:700;margin-left:6px">✅ Startlist complete · ${slCount} riders</span>`
      : _slSt === 'partial'
      ? `<span style="font-size:.72rem;background:rgba(234,179,8,.12);color:#eab308;border:1px solid rgba(234,179,8,.35);border-radius:12px;padding:2px 8px;font-weight:700;margin-left:6px">⚠️ ${slCount} of ~${slExpected(race)} riders confirmed</span>`
      : `<span style="font-size:.72rem;background:rgba(255,165,0,.1);color:#f97316;border:1px solid rgba(255,165,0,.3);border-radius:12px;padding:2px 8px;font-weight:700;margin-left:6px">⏳ Startlist TBA</span>`)
    : '';

  if (upcoming) {
    const datesDiv = `<div class="upcoming-dates">📅 ${dateRange(race.start_date, race.end_date) || 'Dates TBC'}${multi ? ` &nbsp;·&nbsp; ${total} stages` : ''}</div>`;
    const programmeHtml = multi ? renderProgramme(race, id) : '';
    const stagesHtml = (multi && race.stages?.length) ? renderStages(race.stages, id) : '';
    const startlistHtml = renderStartlist(race);
    body = `<div class="race-body-inner">${datesDiv}${programmeHtml}${stagesHtml}${startlistHtml}</div>`;
  } else if (!multi) {
    // 1-stage race: top10 may be at race level or under stages[0]
    const stage0 = (race.stages || [])[0] || {};
    const top10_1d = race.top10 || stage0.top10 || [];
    const winner1d = race.winner || stage0.winner || '';
    const winNat1d = race.winner_nat || stage0.winner_nat || '';
    const winSlug1d = top10_1d[0] ? (top10_1d[0].rider_url||'').replace('/profile/','').replace(/^\/+/,'').trim() : '';
    const winnerName1d = winSlug1d
      ? `<span class="rider-name-link" onclick="openRiderModal('${esc(winSlug1d)}')">${esc(winner1d)}</span>`
      : esc(winner1d);
    const w = winner1d ? `<div class="single-winner"><span class="label">Winner</span> ${flagImg(winNat1d)}${winnerName1d}</div>` : '';
    const dnf1d = renderNonFinishers(race.non_finishers || stage0.non_finishers, `dnf-1d-${id}`);
    body = `<div class="race-body-inner">${w}${renderStageImages(stage0.height_profile_img ? stage0 : race)}${dnf1d}${renderTop10(top10_1d)}</div>`;
  } else {
    body = `<div class="race-body-inner">${renderLeaders(race)}${renderProgramme(race, id)}${renderStages(race.stages||[], id)}${renderStartlist(race)}</div>`;
  }

  const meta = dateRange(race.start_date, race.end_date);

  const MONUMENT_NAMES = ['Milano-Sanremo','Ronde van Vlaanderen','Paris-Roubaix','Liège-Bastogne-Liège','Il Lombardia'];
  const isMonument  = MONUMENT_NAMES.some(m => (race.name||'').includes(m));
  const isGrandTour = (race.total_stages||1) >= 21;

  // Palmares section (for races that have historical data)
  const palmaresData = race.palmares || (appData.palmares || {})[race.slug] || [];
  const palmaresHTML = palmaresData.length
    ? `<div class="palmares-toggle-btn" onclick="event.stopPropagation();togglePalmares('${id}')">
        📜 Race History (${palmaresData.length} editions) <span class="palmares-chev">▼</span>
      </div>
      <div class="palmares-body" id="pal-${id}" style="display:none">
        <div class="palmares-list">
          <div class="palmares-row" style="font-size:.68rem;color:var(--muted);font-weight:700;text-transform:uppercase">
            <span>Year</span><span>Winner</span><span>2nd</span><span>3rd</span>
          </div>
          ${palmaresData.map(p => `<div class="palmares-row">
            <span class="palmares-year">${p.year}</span>
            <span class="palmares-winner">${p.winner_slug
              ? `<span class="rider-name-link" onclick="event.stopPropagation();openRiderModal('${esc(p.winner_slug)}')">${esc(p.winner_name||p.winner||'')}</span>`
              : esc(p.winner_name||p.winner||'')}</span>
            <span class="palmares-second">${p.second_slug
              ? `<span class="rider-name-link" onclick="event.stopPropagation();openRiderModal('${esc(p.second_slug)}')">${esc(p.second_name||p.second||'')}</span>`
              : esc(p.second_name||p.second||'')}</span>
            <span class="palmares-third">${p.third_slug
              ? `<span class="rider-name-link" onclick="event.stopPropagation();openRiderModal('${esc(p.third_slug)}')">${esc(p.third_name||p.third||'')}</span>`
              : esc(p.third_name||p.third||'')}</span>
          </div>`).join('')}
        </div>
      </div>`
    : '';

  return `<div class="race-card ${status}-card" id="${id}" data-cat="${esc(race.category||'')}" data-monument="${isMonument}" data-grandtour="${isGrandTour}" data-stages="${total}" data-start="${race.start_date||''}" data-end="${race.end_date||''}">
    <div class="race-header" onclick="toggleCard('${id}')">
      <div class="race-title">
        <div class="race-name">${esc(race.name||race.slug)}</div>
        <div class="race-meta">
          ${meta ? `<span>${meta}</span>` : ''}
          ${stagePill ? `<span>·</span><span class="stage-pill">${stagePill}</span>` : ''}
          ${race.category ? `<span>·</span><span class="cat-badge">${esc(race.category)}</span>` : ''}
          ${upcoming ? slBadge : ''}
        </div>
      </div>
      <div class="race-right">${chevron('chevron')}</div>
    </div>
    <div class="race-body">${body}${palmaresHTML}</div>
  </div>`;
}

function toggleCard(id) { document.getElementById(id)?.classList.toggle('open'); }

function togglePalmares(cardId) {
  const body = document.getElementById('pal-' + cardId);
  const chev = document.querySelector(`#${cardId} .palmares-chev`);
  if (!body) return;
  const open = body.style.display === 'none';
  body.style.display = open ? 'block' : 'none';
  if (chev) chev.textContent = open ? '▲' : '▼';
}

// ── Section renderers ──────────────────────────────────────────────────────────

function group(label, cards) {
  return cards.length ? `<div class="group-header">${label}</div>${cards}` : '';
}

function renderLive(races) {
  const el = document.getElementById('sec-live');
  if (!races.length) { el.innerHTML = '<p class="empty">No live races right now.</p>'; return; }
  el.innerHTML = races.map(r => renderRaceCard(r, 'live')).join('');
  // Auto-open single live race
  if (races.length === 1) el.querySelector('.race-card')?.classList.add('open');
  // Show live dot
  document.getElementById('live-dot').style.display = 'inline-block';
}

function renderUpcoming(races) {
  const el = document.getElementById('sec-upcoming');
  if (!races.length) { el.innerHTML = '<p class="empty">No upcoming races.</p>'; return; }
  const sorted = [...races].sort((a,b) => (a.start_date||'').localeCompare(b.start_date||''));
  const thisWeek  = sorted.filter(r => { const d=daysUntil(r.start_date); return d>=0&&d<7; });
  const nextWeek  = sorted.filter(r => { const d=daysUntil(r.start_date); return d>=7&&d<14; });
  const later     = sorted.filter(r => daysUntil(r.start_date) >= 14);
  el.innerHTML =
    group('This week',  thisWeek.map(r=>renderRaceCard(r,'upcoming')).join('')) +
    group('Next week',  nextWeek.map(r=>renderRaceCard(r,'upcoming')).join('')) +
    group('Coming up',  later.map(r=>renderRaceCard(r,'upcoming')).join('')) ||
    '<p class="empty">No upcoming races.</p>';
}

function renderRecent(races) {
  const el = document.getElementById('sec-recent');
  if (!races.length) { el.innerHTML = '<p class="empty">No recent results.</p>'; return; }
  const sorted = [...races].sort((a,b) => (b.end_date||'').localeCompare(a.end_date||''));
  const gt     = sorted.filter(r => (r.total_stages||1) >= 21);
  const stage  = sorted.filter(r => !gt.includes(r) && (r.total_stages||1)>1);
  const oneday = sorted.filter(r => (r.total_stages||1)===1);
  el.innerHTML =
    group('🏆 Grand Tours',      gt.map(r=>renderRaceCard(r,'recent')).join('')) +
    group('📋 Stage Races',      stage.map(r=>renderRaceCard(r,'recent')).join('')) +
    group('🏅 One-Day Classics', oneday.map(r=>renderRaceCard(r,'recent')).join(''));
}

// ── Teams ──────────────────────────────────────────────────────────────────────

// Tour bibs: slug -> dossard number, from tour_bibs.json (cyclingoo). Lowest
// bib in a team = leader. Optional data file; absent = no bibs shown.
let tourBibs = {};
let tourBibsMeta = null;
async function loadTourBibs() {
  if (Object.keys(tourBibs).length) return tourBibs;
  try {
    const r = await fetch('./tour_bibs.json?t=' + Date.now(), { cache: 'no-store' });
    if (r.ok) { const j = await r.json(); tourBibs = j.bibs || {}; tourBibsMeta = j; }
  } catch (e) { /* optional */ }
  return tourBibs;
}

// Append any EXTRA_TEAMS not already present in appData.teams (idempotent: keyed
// on team slug, and skipped if any rider slug already lives on another team).
function mergeExtraTeams() {
  if (!appData || !Array.isArray(appData.teams)) return;
  const haveTeam = new Set(appData.teams.map(t => t.slug));
  const haveRider = new Set(appData.teams.flatMap(t => (t.riders || []).map(r => r.slug)));
  for (const t of EXTRA_TEAMS) {
    if (haveTeam.has(t.slug)) continue;
    if ((t.riders || []).some(r => haveRider.has(r.slug))) continue;
    appData.teams.push(t);
  }
}

function mergeExtraRaces() {
  if (!appData) return;
  appData.live = appData.live || [];
  appData.upcoming = appData.upcoming || [];
  appData.recent = appData.recent || [];
  const have = new Set([...appData.live, ...appData.upcoming, ...appData.recent].map(r => r.slug));
  for (const r of EXTRA_RACES) {
    if (have.has(r.slug)) continue;
    const bucket = r.status === 'live' ? appData.live : r.status === 'upcoming' ? appData.upcoming : appData.recent;
    bucket.unshift(r);
  }
}

function renderRiderRow(r, teamId, idx, bib, isLeader) {
  // bib/isLeader passed by renderTeamCard; other callers (search) fall back to
  // a direct lookup so bibs show there too — but only while the Tour is live.
  // Once it finishes the Teams tab shows a plain roster with no bibs.
  if (bib == null && tourBibsActive()) bib = tourBibs[r.slug];
  const bibEl = (bib != null)
    ? `<span class="rider-bib${isLeader ? ' leader' : ''}" title="${isLeader ? 'Team leader — lowest bib' : 'Tour bib'}">${bib}</span>`
    : '';
  const natImg = r.nat
    ? `<img src="https://flagcdn.com/16x12/${(r.nat).toLowerCase()}.png" width="16" height="11" style="vertical-align:middle;margin-right:4px;border-radius:1px" loading="lazy">`
    : '';
  // Enrich from the full rider profile (birth date + photo), since data.json's
  // team roster only inlines a photo/dob for ~26% of riders.
  const prof = (riderProfilesData || {})[r.slug] || (appData.rider_profiles || {})[r.slug] || {};
  // getRiderPhoto (the curated rider_photos.json index) before prof.photo.
  const photoUrl = r.photo || getRiderPhoto(r.slug || '') || prof.photo || EXTRA_PHOTOS[r.slug];
  // referrerpolicy=no-referrer is REQUIRED: both photo CDNs (cyclingflash's
  // DigitalOcean space and procyclingstats) block hotlinking when a referrer is
  // sent, which was silently breaking every rider photo on GitHub Pages.
  const photo = photoUrl
    ? `<img class="rider-photo" src="${esc(photoUrl)}" alt="${esc(r.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
    : `<div class="rider-photo-ph">🚴</div>`;

  let dob = '';
  const dobVal = r.dob || prof.dob;
  if (dobVal) {
    const d = new Date(dobVal);
    const age = Math.floor((Date.now() - d) / (365.25 * 86400000));
    dob = `${d.getFullYear()} · ${age} yrs`;
  } else if (r.age) {
    dob = `${r.age} yrs`;
  }

  const slug = r.slug || '';
  const clickAttr = slug ? ` onclick="openRiderModal('${esc(slug)}')" style="cursor:pointer"` : '';

  return `<div class="rider-row clickable"${clickAttr}>
    ${bibEl}
    ${photo}
    <div class="rider-name-col">
      <div class="rider-name-text">${natImg}${esc(r.name)}${isLeader ? ' <span class="leader-star" title="Team leader">⭐</span>' : ''}</div>
      ${dob ? `<div class="rider-sub">${dob}</div>` : ''}
    </div>
  </div>`;
}

function toggleRider(uid) { document.getElementById(uid)?.classList.toggle('open'); }

let teamIdx = 0;

function renderTeamCard(team) {
  const id = `tc-${teamIdx++}`;
  const cat = (team.cat || '').toUpperCase();
  const catLabel = cat === 'UWT' ? '🌍 WorldTeam' : '🔵 ProTeam';
  const catCls   = cat === 'UWT' ? 'uwt' : 'pro';
  const jersey = team.jersey
    ? `<img class="team-jersey-thumb" src="${esc(team.jersey)}" alt="jersey" loading="lazy">`
    : `<div class="team-jersey-placeholder">👕</div>`;

  const riders = team.riders || [];
  // Annotate with Tour bib, then sort: Tour riders first by bib ascending
  // (lowest = leader), everyone else after in their original order. Bibs are
  // only shown while the Tour is live; once it finishes tourBibsActive() is
  // false, so the Teams tab reverts to a plain roster (no bibs, no leader star,
  // no "N in Tour" badge). The per-race Riders screen keeps its bibs regardless.
  const bibsOn = tourBibsActive();
  const annotated = riders.map(r => ({ r, bib: bibsOn ? tourBibs[r.slug] : undefined }));
  const inTour = annotated.filter(x => x.bib != null);
  const leaderBib = inTour.length ? Math.min(...inTour.map(x => x.bib)) : null;
  annotated.sort((a, b) => {
    if (a.bib != null && b.bib != null) return a.bib - b.bib;
    if (a.bib != null) return -1;
    if (b.bib != null) return 1;
    return 0;
  });
  const roster = annotated.map((x, i) => renderRiderRow(x.r, id, i, x.bib, x.bib != null && x.bib === leaderBib)).join('');
  const profiledCount = riders.filter(r => r.photo).length;
  const riderMeta = profiledCount < riders.length
    ? `${riders.length} riders (${riders.length - profiledCount} loading...)`
    : `${riders.length} riders`;
  const tourBadge = inTour.length
    ? `<span class="team-tour-badge" title="Riders in the ${esc(tourBibsMeta?.race || 'Tour')}">🚴 ${inTour.length} in ${esc(tourBibsMeta?.race || 'Tour')}</span>`
    : '';

  return `<div class="team-card ${catCls}${inTour.length ? ' in-tour' : ''}" id="${id}" data-cat="${cat}">
    <div class="team-header" onclick="toggleCard('${id}')">
      ${jersey}
      <div class="team-title">
        <div class="team-name-text">${esc(team.name)}</div>
        <div class="team-meta">${catLabel} &nbsp;·&nbsp; ${riderMeta}${tourBadge ? ` &nbsp;·&nbsp; ${tourBadge}` : ''}</div>
      </div>
      ${chevron('chevron')}
    </div>
    <div class="team-body">${roster}</div>
  </div>`;
}

function renderTeams(teams) {
  const el = document.getElementById('sec-teams');
  if (!teams || !teams.length) {
    el.innerHTML = '<p class="empty">No team data yet — run the scraper.</p>';
    return;
  }
  const uwt = teams.filter(t => t.cat === 'UWT');
  const pro = teams.filter(t => t.cat !== 'UWT');
  let html = '';
  if (uwt.length) html += `<div class="group-header">🌍 UCI WorldTeam (${uwt.length})</div>` + uwt.map(renderTeamCard).join('');
  if (pro.length) html += `<div class="group-header">🔵 UCI ProTeam (${pro.length})</div>`     + pro.map(renderTeamCard).join('');
  el.innerHTML = `
    <div class="rider-search-wrap">
      <span class="rider-search-icon">🔍</span>
      <input class="rider-search-input" id="riderSearch" type="search" placeholder="Search rider…" oninput="searchRiders(this.value).catch(console.error)">
    </div>
    <div id="rider-search-results" style="display:none;padding:0 14px 14px"></div>
    <div id="teams-list" style="padding:14px">${html}</div>`;
}

async function searchRiders(q) {
  const resultEl = document.getElementById('rider-search-results');
  const teamsEl  = document.getElementById('teams-list');
  q = q.trim().toLowerCase();
  if (q.length < 2) {
    resultEl.style.display = 'none';
    teamsEl.style.display = '';
    return;
  }
  teamsEl.style.display = 'none';
  resultEl.style.display = '';
  resultEl.innerHTML = '<p class="empty" style="padding:16px">Searching…</p>';

  // Build team lookup for rider → team name
  const riderTeam = {};
  for (const team of (appData.teams || [])) {
    for (const r of (team.riders || [])) {
      if (r.slug) riderTeam[r.slug] = team.name;
    }
  }

  // Search rider_profiles.json (all 1800 riders)
  const profiles = await loadRiderProfiles();
  const matches = [];
  for (const [slug, p] of Object.entries(profiles)) {
    if ((p.name||'').toLowerCase().includes(q)) {
      matches.push({
        slug,
        name:     p.name,
        nat:      p.nat,
        photo:    p.photo,
        dob:      p.dob,
        teamName: riderTeam[slug] || '',
      });
    }
  }
  matches.sort((a,b) => (a.name||'').localeCompare(b.name||''));

  resultEl.scrollIntoView({block: 'start', behavior: 'smooth'});

  if (!matches.length) {
    resultEl.innerHTML = '<p class="empty" style="padding:16px">No riders found.</p>';
    return;
  }

  resultEl.innerHTML = `<div class="group-header">${matches.length} rider${matches.length>1?'s':''} found</div>` +
    matches.slice(0, 50).map((r, i) => renderRiderRow(r, 'search', i)).join('');
}

let riderProfilesData = null;
let riderProfilesLoading = false;

// ── Slim photo index (slug→url, loaded on startup) ────────────────────────────
// rider_photos.json covers ~100% of the roster, but this used to load
// fire-and-forget: the Teams tab could render before it arrived (showing only
// the ~26% of riders whose photo is inlined in data.json) and never re-render.
// Exposed as an awaitable promise so loadData() can wait for it before teams.
let riderPhotosIndex = {};
const riderPhotosReady = (async () => {
  try {
    const r = await fetch('./rider_photos.json');
    if (r.ok) riderPhotosIndex = await r.json();
  } catch(e) {}
})();

function getRiderPhoto(slug) {
  if (!slug) return null;
  return riderPhotosIndex[slug] || (appData && appData.rider_profiles && appData.rider_profiles[slug] && appData.rider_profiles[slug].photo) || null;
}

let bestTeamsData = null;
async function loadBestTeams() {
  if (bestTeamsData) return bestTeamsData;
  try {
    const r = await fetch('./best_teams.json?t=' + Date.now(), {cache: 'no-cache'});
    if (r.ok) bestTeamsData = await r.json();
  } catch(e) {}
  return bestTeamsData;
}

        <span style="font-size:1.4rem">🏛️</span>
        <div style="flex:1">
          <div style="font-weight:800;font-size:.95rem;color:#a78bfa">Team Claudius</div>
          <div style="font-size:.72rem;color:var(--muted)">AI-picked fantasy opponent</div>
        </div>
      </div>
      <div style="padding:14px 16px;font-size:.82rem;color:var(--muted);text-align:center">Team Claudius is auto-built once all riders for this race are confirmed.</div>
    </div>`;
  }

  // If Team Claudius has already been added to the league, use that stored copy
  // (with its real created_at) rather than the live best_teams.json preview —
  // otherwise this panel's score can drift from what the League Table shows
  // (best_teams.json can be regenerated later, and passing created_at=null here
  // ignored the from-creation-date filter that computePoints/League Table use).
  const icTeam = iClaudiusGet(raceKey);
  const team = icTeam || raceEntry.team;
  if (!team) return '';

  // Team Claudius's actual roster is the one place a rival "squad" was ever
  // visible pre-reveal (the League Table never shows rider names for anyone).
  // Lock it the same way, until the race is actually over.
  const _raceObj = [...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])].find(r=>_raceKey(r)===raceKey);
  const _complete = raceIsComplete(_raceObj);

  const autoScore = computePoints(team.riders.map(r => r.name), icTeam ? icTeam.created_at : null, raceKey).total;
  const diff = myTotal - autoScore;
  let comparison = '';
  if (myTotal > 0 || autoScore > 0) {
    if (diff > 0)      comparison = `<span style="color:var(--live);font-weight:700">You lead by ${diff} pts 🏆</span>`;
    else if (diff < 0) comparison = `<span style="color:#ef4444;font-weight:700">Team Claudius leads by ${Math.abs(diff)} pts</span>`;
    else               comparison = `<span style="color:var(--muted);font-weight:700">Level — ${myTotal} pts each</span>`;
  }

  // Competitor rosters stay hidden — only Team Claudius's total score/comparison is shown.

  const summaryLine = `<span style="font-weight:700;color:var(--text)">${autoScore} pts · ${team.total_cost}cr</span>`;

  return `<div id="auto-team-panel" style="max-width:480px;margin:0 auto 24px;background:var(--surface);border-radius:12px;overflow:hidden;border:1px solid #7c3aed55">
    <div style="padding:14px 16px;border-bottom:1px solid var(--border)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
        <span style="font-size:1.4rem">🏛️</span>
        <div style="flex:1">
          <div style="font-weight:800;font-size:.95rem;color:#a78bfa">Team Claudius</div>
          <div style="font-size:.72rem;color:var(--muted)">Statistically optimal AI team</div>
        </div>
      </div>
      ${comparison ? `<div style="font-size:.85rem;margin-bottom:8px">${comparison}</div>` : ''}
      ${challengeBtn}
    </div>
    <div style="display:flex;justify-content:space-between;padding:8px 16px;background:var(--surface2);font-size:.78rem;color:var(--muted)">
      <span>${esc(raceEntry.name)}</span>
      ${summaryLine}
    </div>
  </div>`;
}

async function loadAndRenderAutoTeam(raceKey, myTotal) {
  const bt = await loadBestTeams();
  // Auto-generate Team Claudius when startlist is complete and not yet built
  if (bt && bt.races && bt.races[raceKey] && !iClaudiusGet(raceKey)) {
    const allRaces = [...(appData.live||[]),...(appData.upcoming||[]),...(appData.recent||[])];
    const race = allRaces.find(r => _raceKey(r) === raceKey);
    if (race && slStatus(race) === 'complete') {
      const raceEntry = bt.races[raceKey];
      if (raceEntry && raceEntry.team) {
        const team = raceEntry.team;
        iClaudiusSet(raceKey, {name:'Team Claudius',owner:'🤖 AI · Data-driven picks',riders:team.riders,
          created_at:new Date().toISOString(),isIClaudius:true,total_cost:team.total_cost});
        renderFantasy();
        return;
      }
    }
  }
  const panel = document.getElementById('auto-team-panel');
  if (panel) panel.outerHTML = renderAutoTeamPanel(bt, raceKey, myTotal);
}

async function loadRiderProfiles() {
  if (riderProfilesData) return riderProfilesData;
  if (riderProfilesLoading) {
    // Wait for in-flight load
    await new Promise(res => { const t = setInterval(() => { if (!riderProfilesLoading) { clearInterval(t); res(); } }, 100); });
    return riderProfilesData;
  }
  riderProfilesLoading = true;
  try {
    const r = await fetch('./rider_profiles.json');
    if (r.ok) riderProfilesData = (await r.json()).riders || {};
  } catch(e) { riderProfilesData = {}; }
  riderProfilesLoading = false;
  return riderProfilesData;
}

let pcsEnrichmentData = null;
async function loadPcsEnrichment() {
  if (pcsEnrichmentData) return pcsEnrichmentData;
  try {
    const r = await fetch('./pcs_enrichment.json', {cache: 'no-cache'});
    if (r.ok) pcsEnrichmentData = await r.json();
  } catch(e) {}
  return pcsEnrichmentData || {};
}

// Last-resort nationality lookup: scan already-loaded race data (result rows,
// classification tables, startlists) for this rider's flag code. The Following
// list shows a flag from its own stored record, so a rider whose profile and
// team-roster entry both lack `nat` appeared to *lose* their flag on drill-down.
function _natFromRaceData(slug) {
  const slugOf = r => (r.slug || (r.rider_url || '').replace('/profile/', '').replace(/^\/+/, '')).trim();
  const natOf  = r => r.nat_code || r.nat || '';
  for (const race of [...(appData.live||[]), ...(appData.upcoming||[]), ...(appData.recent||[])]) {
    const pools = [race.startlist || []];
    for (const s of (race.stages || [])) pools.push(s.top10 || []);
    for (const k of ['gc_top10','points_top10','kom_top10','youth_top10']) pools.push(race[k] || []);
    for (const pool of pools) {
      for (const r of pool) {
        if (slugOf(r) === slug && natOf(r)) return natOf(r);
      }
    }
  }
  return '';
}

async function openRiderModal(slug) {
  // Show modal immediately with loading state
  const modal = document.getElementById('riderModal');
  const content = document.getElementById('riderModalContent');
  content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--muted)">⏳ Loading…</div>';
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  const [profiles, enrich0] = await Promise.all([loadRiderProfiles(), loadPcsEnrichment()]);
  const profile = { ...(profiles[slug] || {}), ...((appData.rider_profiles || {})[slug] || {}) };
  const enrich  = enrich0[slug] || {};

  let baseInfo = null;
  for (const team of (appData.teams || [])) {
    const r = (team.riders || []).find(r => r.slug === slug);
    if (r) { baseInfo = {...r, teamName: team.name}; break; }
  }

  const name     = (profile || baseInfo || {}).name || slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  // Per-field fallback, not whole-object fallback: some riders have a
  // `profile` (from rider_profiles.json, via scrape_rider_profiles.py's
  // regex-based "Nationality" line parse) whose .nat is empty because that
  // parse didn't match on their particular page -- but `baseInfo` (from
  // data.json's team roster, populated by a more robust flag-alt-text /
  // JSON-LD path in scraper.py) usually has the correct code. Picking the
  // whole profile object over baseInfo whenever profile exists at all meant
  // these riders silently lost their flag even though the right value was
  // sitting right there in baseInfo.
  // Follow store keeps the nat captured when the rider was followed, which is
  // why the Following card had a flag the modal didn't; race data is the final
  // fallback so drill-down from results keeps the flag too.
  const followNat = ((followLoad() || []).find(f => f.slug === slug) || {}).nat || '';
  // natCode() normalises across sources and skips full-country-name values that
  // aren't valid flag codes (data.json stores "United Kingdom" etc., which used
  // to win here and kill the flag). Prefer the roster/rider_profiles codes, then
  // fall back to the (mapped) data.json name, follow record, and race data.
  const nat      = natCode(baseInfo && baseInfo.nat, profiles[slug] && profiles[slug].nat,
                    profile && profile.nat, followNat, _natFromRaceData(slug));
  const natName  = (profile || {}).nat_name || nat.toUpperCase();
  const photo    = (profile || {}).photo || (baseInfo || {}).photo || getRiderPhoto(slug) || EXTRA_PHOTOS[slug];
  const dob        = enrich.dob || (profile || {}).dob;
  const birthplace = enrich.birthplace || null;
  const wins     = (profile || {}).wins || [];
  const HISTORICAL_TEAMS = {
    'jacques-anquetil': [
      {year:1953,team:'C.C. Sotteville'},{year:1954,team:'La Perle-Hutchinson'},
      {year:1955,team:'Caminade-Hutchinson-Leroux'},{year:1956,team:'La Perle-Hutchinson'},
      {year:1957,team:'Helyett-Potin'},{year:1958,team:'Helyett-Potin'},
      {year:1959,team:'Helyett-Potin'},{year:1960,team:'Helyett-Potin'},
      {year:1961,team:'St Raphaël-Helyett-Hutchinson'},{year:1962,team:'St Raphaël-Helyett-Hutchinson'},
      {year:1963,team:'St Raphaël-Helyett-Hutchinson'},{year:1964,team:'Ford-France'},
      {year:1965,team:'Ford-France-Gitane'},{year:1966,team:'Bic'},
      {year:1967,team:'Bic'},{year:1968,team:'Bic'},{year:1969,team:'Bic'},
    ],
    'eddy-merckx': [
      {year:1961,team:'Faema-Guerra (amateur)'},{year:1962,team:'Faema-Guerra (amateur)'},
      {year:1963,team:'Solo-Superia'},{year:1964,team:'Solo-Superia'},
      {year:1965,team:'Peugeot-BP-Michelin'},{year:1966,team:'Peugeot-BP-Michelin'},
      {year:1967,team:'Peugeot-BP-Michelin'},{year:1968,team:'Faema'},
      {year:1969,team:'Faema'},{year:1970,team:'Molteni'},
      {year:1971,team:'Molteni'},{year:1972,team:'Molteni'},
      {year:1973,team:'Molteni'},{year:1974,team:'Molteni'},
      {year:1975,team:'Molteni'},{year:1976,team:'Fiat-France'},
      {year:1977,team:'Fiat-France'},
    ],
  };
  const teamHistory = (profile || {}).team_history || HISTORICAL_TEAMS[slug] || [];
  const currentYearTeam = (teamHistory.filter(t => t.year <= new Date().getFullYear()).sort((a,b) => b.year - a.year)[0] || {}).team || '';
  // Prefer live roster (data.json) over stale PCS team_history
  const teamName = (baseInfo || {}).teamName || currentYearTeam || '';
  const weight   = (profile || {}).weight;
  const height   = (profile || {}).height;

  const photoEl = photo
    ? `<img class="rider-modal-photo" src="${esc(photo)}" alt="${esc(name)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
    : `<div class="rider-modal-photo-ph">🚴</div>`;

  let meta = '';
  if (nat) meta += `<img src="https://flagcdn.com/16x12/${nat}.png" width="16" height="11" style="vertical-align:middle;margin-right:4px;border-radius:1px"> ${esc(natName)}`;
  if (birthplace) meta += (meta ? ' · ' : '') + `📍 ${esc(birthplace)}`;
  if (dob) {
    const age = Math.floor((Date.now() - new Date(dob + 'T00:00:00')) / (365.25*86400000));
    const dobFmt = dob.length === 10
      ? new Date(dob + 'T00:00:00').toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})
      : dob;
    meta += (meta ? '<br>' : '') + `${esc(dobFmt)}${(!isNaN(age) && age >= 14 && age <= 55) ? ` (age ${age})` : ''}`;
  }
  if (weight || height) {
    const wh = [weight ? weight + 'kg' : '', height ? height + 'm' : ''].filter(Boolean).join(' · ');
    meta += (meta ? ' · ' : '') + esc(wh);
  }
  if (teamName) meta += (meta ? '<br>' : '') + esc(teamName);

  // Specialty bars — prefer CyclingOracle co_stats (0–100), fall back to PCS specialties
  const coStats    = (profile || {}).co_stats;
  const specialtiesRaw = (profile || {}).specialties || {};
  // Two incompatible PCS specialty formats exist in the data:
  //  - legacy (rider_profiles.json, scrape_rider_profiles.py): plain numbers keyed
  //    by short names, e.g. {climber: 208, tt: 98}
  //  - newer (data.json via backfill_specialties.py/apply_specialties.py): {score,bar}
  //    objects keyed by PCS URL segments, e.g. {climbers: {score:208,bar:100}, 'time-trial': {...}}
  // Normalise both onto the canonical PCS_ORDER keys so rendering never sees a raw object.
  const SPEC_ALIASES = {
    climber: ['climber', 'climbers'],
    gc:      ['gc'],
    oneday:  ['oneday', 'one-day-races'],
    sprint:  ['sprint'],
    tt:      ['tt', 'time-trial'],
    hills:   ['hills'],
  };
  const specialties = {};
  for (const [canonKey, aliases] of Object.entries(SPEC_ALIASES)) {
    for (const alias of aliases) {
      const raw = specialtiesRaw[alias];
      if (raw == null) continue;
      const isObj = raw !== null && typeof raw === 'object';
      const score = isObj ? raw.score : raw;
      if (!Number.isFinite(score)) continue;
      specialties[canonKey] = { score, bar: isObj && Number.isFinite(raw.bar) ? raw.bar : null };
      break;
    }
  }
  // CyclingOracle layout: grouped by terrain / finish / TT
  const CO_ORDER = [
    { key:'average',      label:'Form',      color:'#e63946' },
    { key:'mountain',     label:'Mountain',  color:'#2a9d8f' },
    { key:'hill',         label:'Hills',     color:'#52b788' },
    { key:'flat',         label:'Flat',      color:'#8ecae6' },
    { key:'cobble',       label:'Cobbles',   color:'#adb5bd' },
    { key:'gc',           label:'GC',        color:'#c77dff' },
    { key:'onedaypoints', label:'One Day',   color:'#f4a261' },
    { key:'sprint',       label:'Sprint',    color:'#e9c46a' },
    { key:'timetrial',    label:'TT',        color:'#4361ee' },
    { key:'ttlong',       label:'TT Long',   color:'#4895ef' },
    { key:'ttshort',      label:'TT Short',  color:'#4cc9f0' },
    { key:'prologue',     label:'Prologue',  color:'#7b2d8b' },
  ];
  const PCS_ORDER = [
    { key: 'climber', label: 'Climber',    color: '#2a9d8f' },
    { key: 'gc',      label: 'GC',         color: '#e63946' },
    { key: 'oneday',  label: 'One Day',    color: '#f4a261' },
    { key: 'sprint',  label: 'Sprint',     color: '#e9c46a' },
    { key: 'tt',      label: 'Time Trial', color: '#4361ee' },
    { key: 'hills',   label: 'Hills',      color: '#8ecae6' },
  ];
  let specHTML;
  if (coStats) {
    // CyclingOracle scores — all on 0–100 scale
    specHTML = `<div class="spec-bars">${CO_ORDER.map(({key, label, color}) => {
        const score = coStats[key];
        if (score == null) return '';
        return `<div class="spec-row">
          <div class="spec-label">${label}</div>
          <div class="spec-track"><div class="spec-fill" style="width:${score}%;background:${color}"></div></div>
          <div class="spec-score">${score}</div>
        </div>`;
      }).join('')
    }<div style="font-size:.68rem;color:var(--muted);text-align:right;margin-top:4px">Performance rating · /100</div></div>`;
  } else if (Object.keys(specialties).length) {
    // PCS fallback
    const maxSpec = Math.max(1, ...Object.values(specialties).map(s => s.score).filter(Number.isFinite));
    specHTML = `<div class="spec-bars">${PCS_ORDER.map(({key, label, color}) => {
        const entry = specialties[key];
        if (!entry || !entry.score) return '';
        const bar = entry.bar != null ? entry.bar : Math.round((entry.score / maxSpec) * 100);
        return `<div class="spec-row">
          <div class="spec-label">${label}</div>
          <div class="spec-track"><div class="spec-fill" style="width:${bar}%;background:${color}"></div></div>
          <div class="spec-score">${entry.score.toLocaleString()}</div>
        </div>`;
      }).join('')
    }</div>`;
  } else {
    specHTML = `<p class="rider-modal-no-data">Specialty scores not available</p>`;
  }

  // Wins — scraper: {nr, race, class, date, cat}
  const winsHTML = wins.length
    ? wins.map(w => {
        const yr = (w.date || '').substring(0, 4) || (w.year || '');
        return `<div class="win-entry">
          <span class="win-year">${esc(String(yr))}</span>
          <span class="win-race">${esc(w.race || '')}</span>
          <span class="win-cat">${esc(w.class || w.cat || '')}</span>
        </div>`;
      }).join('')
    : `<p class="rider-modal-no-data">${profile ? 'No wins recorded' : 'Profile not yet fetched — run scrape_rider_profiles.py'}</p>`;

  const isFollowed = followLoad().some(f => f.slug === slug);
  const followBtnClass = isFollowed ? 'follow-modal-btn following' : 'follow-modal-btn';
  const followBtnLabel = isFollowed ? '⭐ Following' : '+ Follow';
  const followBtnOnclick = isFollowed
    ? `unfollowRider('${esc(slug)}','${esc(name)}')`
    : `followRider('${esc(slug)}','${esc(name)}','${esc(nat)}')`;

  // Team history
  const teamHistHTML = teamHistory.length
    ? `<div class="team-history-list">${teamHistory.map(t =>
        `<div class="team-hist-row">
          <span class="team-hist-year">${t.year}</span>
          <span class="team-hist-name">${esc(t.team)}</span>
        </div>`).join('')}</div>`
    : `<p class="rider-modal-no-data">${profile ? 'No team history recorded' : 'Profile not yet scraped'}</p>`;

  // Season results (current year)
  const seasonResults = (profile || {}).season_results || [];
  const currentYear = new Date().getFullYear();
  const srFiltered = seasonResults.filter(r => r.pcs_points > 0 || r.uci_points > 0);
  const hasUci = srFiltered.some(r => (r.uci_points || 0) > 0);
  const seasonHTML = srFiltered.length
    ? `<div class="season-results-list">
        <div class="season-results-header">
          <span>Date</span><span>Race / Stage</span><span>Pos</span>${hasUci ? '<span>UCI</span>' : ''}
        </div>
        ${srFiltered.map(r => {
          const d = r.date || '';
          const dateFmt = d.length >= 10
            ? new Date(d.substring(0,10) + 'T00:00:00').toLocaleDateString('en-GB', {month:'short',year:'numeric'})
            : d;
          return `<div class="season-result-row">
          <span class="sr-date">${esc(dateFmt)}</span>
          <span class="sr-race">${esc(r.race||'')}</span>
          <span class="sr-pos">${r.stage_pos != null ? r.stage_pos : ''}</span>
          ${hasUci ? `<span class="sr-pts">${(r.uci_points||0) > 0 ? r.uci_points : ''}</span>` : ''}
        </div>`;
        }).join('')}
      </div>`
    : `<p class="rider-modal-no-data">${profile ? 'No recorded results' : 'Profile not yet scraped'}</p>`;

  // Tabs: Palmares | Teams | Season
  content.innerHTML = `
    <div class="rider-modal-header">
      ${photoEl}
      <div>
        <div class="rider-modal-name">${esc(name)}</div>
        ${meta ? `<div class="rider-modal-meta">${meta}</div>` : ''}
        <button id="followModalBtn" class="${followBtnClass}" data-slug="${esc(slug)}" data-nat="${esc(nat)}" onclick="${followBtnOnclick}">${followBtnLabel}</button>
      </div>
    </div>
    <div class="rider-modal-section">⭐ Specialties</div>
    ${specHTML}
    <div class="rider-tabs">
      <button class="rider-tab active" onclick="switchRiderTab(this,'tab-palmares')">🏆 Palmares (${wins.length})</button>
      <button class="rider-tab" onclick="switchRiderTab(this,'tab-teams')">👕 Teams</button>
      <button class="rider-tab" onclick="switchRiderTab(this,'tab-season')">Career Results</button>
    </div>
    <div id="tab-palmares" class="rider-tab-panel active">${winsHTML}</div>
    <div id="tab-teams"    class="rider-tab-panel" style="display:none">${teamHistHTML}</div>
    <div id="tab-season"   class="rider-tab-panel" style="display:none">${seasonHTML}</div>
  `;
}

function switchRiderTab(btn, tabId) {
  btn.closest('.rider-modal, #riderModalContent').querySelectorAll('.rider-tab').forEach(b => b.classList.remove('active'));
  btn.closest('.rider-modal, #riderModalContent').querySelectorAll('.rider-tab-panel').forEach(p => { p.style.display='none'; p.classList.remove('active'); });
  btn.classList.add('active');
  const panel = document.getElementById(tabId);
  if (panel) { panel.style.display='block'; panel.classList.add('active'); }
}

function closeRiderModal(e) {
  if (!e || e.target === document.getElementById('riderModal')) {
    document.getElementById('riderModal').classList.remove('open');
    document.body.style.overflow = '';
  }
}
