function fDeleteTeam(){
  const team=fantasyLoad();if(!team)return;
  fVerifyPin(team,'delete your team',()=>{
    if(!confirm('Delete your team? This cannot be undone.'))return;
    fantasyDelete();draftClear();_fPicked=[];renderFantasy();
  });
}

function fDoSwap(inName,onDone){
  const team=fantasyLoad();if(!team)return;
  const transfersTotal=team.transfers_total!=null?team.transfers_total:TRANSFERS_TOTAL;
  if((team.transfers_used||0)>=transfersTotal){alert('No transfers remaining! You\'ve used '+transfersTotal+'/'+transfersTotal+' for this race.');return;}
  const inR=getAllRiders().find(r=>r.name===inName);if(!inR)return;
  if(team.riders.some(r=>r.name===inName&&r.name!==_fSwapOut)){alert(inName+' is already on your squad.');return;}
  // Outgoing rider's cost comes from their frozen price on this squad (not
  // today's live price) so a mid-race price swing on the rider you're
  // dropping can't throw off the budget math. Incoming rider gets today's
  // live price frozen onto them as part of this transfer.
  const outRider=team.riders.find(r=>r.name===_fSwapOut);
  const outCost=riderCostFor(outRider);
  const inCost=riderCost(inName);
  const currentCost=squadCost(team.riders);
  const newCost=currentCost-outCost+inCost;
  const _swapBudget=teamBudget(team,fantasyGetRace());
  if(newCost>_swapBudget){alert('Over budget! Swapping in '+inName+' ('+inCost+' cr) would take your squad to '+newCost+' cr — budget is '+_swapBudget+' cr.');return;}
  fVerifyPin(team,'confirm this transfer',()=>{
    team.riders=team.riders.map(r=>r.name===_fSwapOut?{...inR,cost:inCost}:r);
    team.transfers_used=(team.transfers_used||0)+1;
    team.transfers_total=transfersTotal;
    fantasySave(team);renderFantasy();
    if(onDone)onDone();
  });
}

// ── Swap modal ───────────────────────────────────────────────────────────────

function fOpenSwap(outName){
  const team=fantasyLoad();if(!team)return;
  const transfersTotal=team.transfers_total!=null?team.transfers_total:TRANSFERS_TOTAL;
  const transfersUsed=team.transfers_used||0;
  if(transfersUsed>=transfersTotal){alert('No transfers remaining! You\'ve used '+transfersUsed+'/'+transfersTotal+' for this race.');return;}
  _fSwapOut=outName;
  const box=fModal(
    '🔁 Swap out '+esc(outName),
    '<div id="fSwapBudgetLine" style="font-size:.76rem;color:var(--muted);margin-bottom:8px"></div>'
    +'<input id="fSwapSearch" type="text" placeholder="Search riders…" style="width:100%;padding:8px 10px;border-radius:6px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:.85rem;margin-bottom:8px;box-sizing:border-box">'
    +'<div id="fSwapList" style="max-height:320px;overflow-y:auto;border:1px solid var(--border);border-radius:8px"></div>'
  );
  const searchEl=box.querySelector('#fSwapSearch');
  if(searchEl){
    searchEl.addEventListener('input',()=>fRenderSwapList(searchEl.value,box));
    searchEl.focus();
  }
  fRenderSwapList('',box);
}

function fRenderSwapList(raw,box){
  const team=fantasyLoad();if(!team)return;
  const listEl=box.querySelector('#fSwapList');
  const budgetLine=box.querySelector('#fSwapBudgetLine');
  if(!listEl)return;
  const outRider=team.riders.find(r=>r.name===_fSwapOut);
  const outCost=riderCostFor(outRider);
  const totalCost=squadCost(team.riders);
  const _swapBudget=teamBudget(team,fantasyGetRace());
  const overage=Math.max(0,totalCost-_swapBudget);
  const spentWithoutOut=totalCost-outCost;
  const remaining=_swapBudget-spentWithoutOut;
  if(budgetLine){
    if(overage>0&&remaining<COST_FLOOR){
      // Dropping this rider can't fix the overage on its own -- the cheapest
      // possible replacement (COST_FLOOR) still leaves the squad over budget.
      // Point at a rider that actually *can* fix it instead of leaving the
      // list showing everything as unaffordable with no explanation (the
      // exact confusion that prompted this).
      const candidates=team.riders.filter(r=>r.name!==_fSwapOut&&riderCostFor(r)-COST_FLOOR>=overage).sort((a,b)=>riderCostFor(b)-riderCostFor(a));
      const suggestion=candidates.length?(' Try swapping out <b>'+esc(candidates[0].name)+'</b> ('+riderCostFor(candidates[0])+' cr) instead — close this and tap 🔁 next to them.'):'';
      budgetLine.innerHTML='<span style="color:var(--live)">Dropping '+esc(_fSwapOut)+' only frees '+remaining+' cr, but the cheapest possible rider costs '+COST_FLOOR+' cr — this swap can\'t close your '+overage+' cr overage on its own.'+suggestion+'</span>';
    } else {
      budgetLine.textContent='Dropping '+_fSwapOut+' ('+outCost+' cr) frees up to '+remaining+' cr for a replacement.';
    }
  }
  const q=(raw||'').trim().toLowerCase();
  const already=new Set(team.riders.filter(r=>r.name!==_fSwapOut).map(r=>r.name));
  let all=getRaceRiders().filter(r=>!already.has(r.name)&&r.name!==_fSwapOut);
  let matches;
  if(!q){
    matches=all.filter(r=>!r.restricted);
  } else {
    const starts=all.filter(r=>(r.name||'').toLowerCase().startsWith(q));
    const contains=all.filter(r=>!(r.name||'').toLowerCase().startsWith(q)&&(r.name||'').toLowerCase().includes(q));
    matches=[...starts,...contains];
  }
  if(!matches.length){listEl.innerHTML='<div style="padding:12px;color:var(--muted);font-size:.85rem">No riders found</div>';return;}
  listEl.innerHTML=matches.map(r=>{
    const c=riderCost(r.name);

      +(r.nat?flag(r.nat):'<span style="width:20px;display:inline-block"></span>')

function renderLeagueTable(teams,complete){
  const medals=['🥇','🥈','🥉'];

  const leaderPts=teams.length>0?teams[0].points:0;
  function fmtDate(iso){if(!iso)return'';try{const d=new Date(iso);return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}catch(e){return'';}}
  // While the race is live, everyone else's rank and score stay hidden --
  // only your own row shows real numbers. Prevents mid-race scores (or a
  // Team Claudius roster) from turning into a copy-the-leader strategy

function fExportTeam(){
  const team=fantasyLoad();if(!team)return;
  const{total}=computePoints((team.riders||[]).map(r=>r.name),team.created_at,fantasyGetRace());
  const code=btoa(unescape(encodeURIComponent(JSON.stringify({...team,points:total}))));
  navigator.clipboard&&navigator.clipboard.writeText(code).catch(()=>{});
  const box=fModal(
    '📤 Your Team Code',
    '<div style="font-size:.72rem;color:var(--muted);margin-bottom:8px">Share this with friends so they can import your team.</div>'
    +'<textarea readonly style="width:100%;height:80px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:.72rem;resize:none;word-break:break-all;font-family:monospace">'+esc(code)+'</textarea>'
    +'<div style="font-size:.75rem;color:#2dd36f;margin:6px 0">✓ Copied to clipboard</div>'
  );
  box.querySelector('button').textContent='Done';
}

function fDoImport(code){
  try{
    const raw=JSON.parse(decodeURIComponent(escape(atob(code.trim()))));
    if(!raw||!Array.isArray(raw.riders)||!raw.riders.length) throw new Error('bad');
    // Validate squad size — hard cap 8 riders max
    if(raw.riders.length>8){
      alert('❌ This team has '+raw.riders.length+' riders — max allowed is 8. Import rejected.');return;
    }
    // Validate budget using current rider pricing. Prefer the exported
    // team's own frozen budget (present on any team exported after this
    // field existed) over today's live raceBudget() recompute -- otherwise
    // a perfectly valid team could get rejected on import just because the
    // race's field/budget has moved since it was drafted.
    const cost=squadCost(raw.riders);
    const importBudget=typeof raw.budget==='number'?raw.budget:raceBudget(fantasyGetRace());
    if(cost>importBudget){
      alert('❌ This team costs '+cost+' credits (budget is '+importBudget+'). Import rejected.');return;
    }
    const t={name:raw.name||'Imported Team',owner:raw.owner||'',riders:raw.riders,
      created_at:raw.created_at||new Date().toISOString(),total_cost:cost,budget:importBudget};
    leagueAdd(t);
    renderFantasy();
    alert('✅ '+t.name+' added to your league ('+t.riders.length+' riders, '+cost+' credits)');
  }catch(e){alert('❌ Invalid code — check you pasted it correctly.');}
}

function fImportTeam(){
  fModal(
    '📥 Import a Team',
    '<div style="font-size:.82rem;color:var(--muted);margin-bottom:10px">Paste a team export code:</div>'
    +'<textarea id="fImportBox" style="width:100%;height:90px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:8px;color:var(--text);font-size:.72rem;font-family:monospace;resize:none;outline:none" placeholder="Paste code here…"></textarea>',
    function(){
      const box=document.getElementById('fImportBox');
      if(box)fDoImport(box.value);
    },'Import'
  );
}

function fModal(title,body,onConfirm,confirmLabel){
  const box=document.createElement('div');
  box.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;width:90%;max-width:380px;box-shadow:0 8px 32px rgba(0,0,0,.6)';
  const btns=onConfirm
    ?'<button id="fModalCancel" style="flex:1;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-weight:600;cursor:pointer">Cancel</button>'
     +'<button id="fModalOk" style="flex:1;padding:10px;background:var(--upcoming);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer">'+(confirmLabel||'OK')+'</button>'
    :'<button onclick="this.closest(\'[data-modal]\').remove()" style="width:100%;padding:10px;background:var(--upcoming);border:none;border-radius:8px;color:#fff;font-weight:700;cursor:pointer">'+(confirmLabel||'Close')+'</button>';
  box.innerHTML=
    '<div style="font-weight:700;font-size:1rem;margin-bottom:12px">'+title+'</div>'
   +'<div style="font-size:.88rem;line-height:1.5;color:var(--muted);margin-bottom:16px">'+body+'</div>'
   +'<div style="display:flex;gap:8px">'+btns+'</div>';
  box.setAttribute('data-modal','1');
  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9998';
  document.body.append(overlay,box);
  const close=()=>{overlay.remove();box.remove();};
  overlay.addEventListener('click',close);
  const cancelBtn=box.querySelector('#fModalCancel');
  if(cancelBtn) cancelBtn.addEventListener('click',close);
  const okBtn=box.querySelector('#fModalOk');
  if(okBtn) okBtn.addEventListener('click',()=>{if(onConfirm)onConfirm();close();});
  box._overlay=overlay;
  box._close=close;
  return box;
}

// ── Subscriber export ─────────────────────────────────────────────────────────
function exportSubscribers(){
  const all=[];
  const seen=new Set();
  function addTeam(t,source){
    if(!t||!t.email)return;
    const e=t.email.trim().toLowerCase();
    if(!e||seen.has(e))return;
    seen.add(e);
    all.push({email:t.email.trim(),name:t.owner||'',team:t.name||'',race:t._race||'',source,added:t.created_at||new Date().toISOString()});
  }
  addTeam(fantasyLoad(),'own');
  for(const t of leagueLoad()) addTeam(t,'imported');
  if(!all.length){
    alert('No emails saved yet — team owners need to add an email when creating their team.');
    return;
  }
  const json=JSON.stringify(all,null,2);
  if(window.showSaveFilePicker){
    window.showSaveFilePicker({
      suggestedName:'subscribers.json',
      types:[{description:'JSON',accept:{'application/json':['.json']}}]
    }).then(async fh=>{
      const w=await fh.createWritable();
      await w.write(json);
      await w.close();
      localStorage.removeItem('uci_subscribers_dirty');
      alert('✅ Notification list saved — your friends will receive race alerts.');
      renderFantasy();
    }).catch(()=>{});
    return;
  }
  // Fallback: trigger download
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='subscribers.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  localStorage.removeItem('uci_subscribers_dirty');
  alert('✅ Downloaded — save this file to your UCI Calendar folder to enable race alerts.');
  renderFantasy();
}

// Categories use CyclingOracle co_stats keys (0–100 scale).
// Falls back to PCS specialties (rescaled) when co_stats is absent.
const RANKING_CATS = [
  { key:'average',      label:'In Form',   icon:'🔥', desc:'Current form — shape score based on recent results' },
  { key:'mountain',     label:'Climbers',  icon:'⛰️', desc:'Mountain climbing ability' },
  { key:'sprint',       label:'Sprinters', icon:'⚡', desc:'Sprint finish ability' },
  { key:'gc',           label:'GC',        icon:'🏆', desc:'Stage race GC ability' },
  { key:'onedaypoints', label:'Classics',  icon:'🔶', desc:'One-day race specialists' },
  { key:'timetrial',    label:'TT',        icon:'🕐', desc:'Time trial ability' },
  { key:'hill',         label:'Puncheurs', icon:'💥', desc:'Hilly terrain specialists' },
  { key:'cobble',       label:'Cobbles',   icon:'🪨', desc:'Cobblestone specialists — Spring classics' },
];
let rankingsCurCat  = 'average';
let rankingsProfiles = null;
let rankingsAgeMap   = null;   // slug → age (from appData.teams)

async function loadRankings() {
  const el = document.getElementById('sec-rankings');
  if (rankingsProfiles) { renderRankings(); return; }
  el.innerHTML = '<div class="rankings-loading">⏳ Loading rider data…</div>';
  try {
    const r = await fetch('./rider_profiles.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    rankingsProfiles = data.riders || data;
    if (!rankingsProfiles || typeof rankingsProfiles !== 'object') throw new Error('Bad data');
    await loadPcsEnrichment(); // ensure men's peloton filter is ready
    // Build age map from already-loaded team rosters
    rankingsAgeMap = {};
    for (const team of (appData && appData.teams) || []) {
      for (const rider of team.riders || []) {
        if (rider.slug && rider.age) rankingsAgeMap[rider.slug] = parseInt(rider.age) || 0;
      }
    }

  } catch(e) {
    el.innerHTML = `<div class="rankings-loading">⚠️ Could not load rider data<br><small>${esc(e.message)}</small></div>`;
    return;
  }
  renderRankings();
}

// PCS specialty key → CO stat key (for fallback scoring)
const PCS_TO_CO = { climber:'mountain', gc:'gc', oneday:'onedaypoints', sprint:'sprint', tt:'timetrial', hills:'hill' };

function getRankingScore(profile, key) {
  // Prefer CyclingOracle co_stats (0–100 scale)
  const co = profile.co_stats;
  if (co && co[key] != null) return co[key];
  // Fallback: PCS specialties rescaled to 0–100
  const sp = profile.specialties || {};
  // Find which PCS key maps to this CO key
  const pcsKey = Object.entries(PCS_TO_CO).find(([,v]) => v === key);
  if (pcsKey) {
    const raw = sp[pcsKey[0]] || 0;
    return Math.min(100, Math.round(raw / 100)); // PCS scale ~0–10000 → 0–100
  }
  return 0;
}

function recentWins(profile) {
  const cutoff = (new Date().getFullYear() - 3) + '-01-01';
  return (profile.wins || []).filter(w => (w.date||'') >= cutoff).length;
}
function qualityScore(profile) {
  // Primary: sum pcs_points from top-5 finishes in last 3 years (rewards big-race results).
  // Fallback: if season_results is empty/missing (scraper gap), use recent wins × 50pts each
  // so riders like Vingegaard aren't silently penalised by missing data.
  const cutoff = (new Date().getFullYear() - 3) + '-01-01';
  let total = 0;
  for (const r of profile.season_results || []) {
    if ((r.date || '') < cutoff) continue;
    if (r.stage_pos && r.stage_pos <= 5 && (r.pcs_points || 0) > 0) total += r.pcs_points;
  }
  if (total === 0) {
    // Fallback: count recent wins × 50 pts — degrades gracefully when results data is absent
    const wins = (profile.wins || []).filter(w => (w.date || '') >= cutoff).length;
    total = wins * 50;
  }
  return total;
}

function setRankingCat(key) {
  rankingsCurCat = key;
  renderRankings();
}

function renderRankings() {
  const el = document.getElementById('sec-rankings');
  const profiles = rankingsProfiles;
  if (!profiles) return;

  const catBar = `<div class="rankings-cat-bar">${
    RANKING_CATS.map(c =>
      `<button class="rankings-cat-btn${c.key===rankingsCurCat?' active':''}" onclick="setRankingCat('${c.key}')">${c.icon} ${c.label}</button>`
    ).join('')
  }</div>`;

  const cat = RANKING_CATS.find(c=>c.key===rankingsCurCat);

  // Ranking rules:
  //  • Primary sort: CyclingOracle co_stats score (0–100), or PCS fallback
  //  • Tie-break: qualityScore (recent top-5 race points)
  //  • Riders >35 excluded; restricted to current active roster
  //  • Minimum score of 1 to filter out riders with no data for this category
  const rosterSlugs = rankingsAgeMap ? new Set(Object.keys(rankingsAgeMap)) : null;
  // Check how many profiles have co_stats for banner display
  const coCount = Object.values(profiles).filter(p => p.co_stats).length;
  const ranked = Object.entries(profiles)
    .filter(([slug]) => !rosterSlugs || rosterSlugs.has(slug))
    .filter(([slug]) => { const a = rankingsAgeMap ? rankingsAgeMap[slug] : null; return a && a <= 35; })
    .map(([slug, p]) => ({ slug, p, spec: getRankingScore(p, rankingsCurCat), wins: recentWins(p) }))
    .filter(x => x.spec >= 1)
    .sort((a,b) => b.spec - a.spec || qualityScore(b.p) - qualityScore(a.p))
    .slice(0, 30);

  const MEDALS = ['🥇','🥈','🥉'];
  const rows = ranked.map((x, i) => {
    const name = x.p.name || x.slug.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
    const nat  = (x.p.nat||'').toLowerCase();
    const flag = nat ? `<img src="https://flagcdn.com/16x12/${nat}.png" width="16" height="11" style="vertical-align:middle;border-radius:1px" onerror="this.style.display='none'">` : '';
    const medal = i < 3 ? `<span class="rankings-medal">${MEDALS[i]}</span>` : `<span class="rankings-pos">${i+1}</span>`;
    const winsEl = x.wins > 0 ? `<span class="rankings-wins">${x.wins}W</span>` : '';
    // Score bar — fill proportional to score (CO: 0–100, show as coloured pill)
    const barW = Math.round(x.spec);
    const barColor = barW >= 90 ? '#e63946' : barW >= 75 ? '#f4a261' : '#4361ee';
    return `<div class="rankings-row" onclick="openRiderModal('${esc(x.slug)}')">
      ${medal}
      <span class="rankings-flag">${flag}</span>
      <span class="rankings-name">${esc(name)}</span>
      ${winsEl}
      <span class="rankings-score" title="Score: ${x.spec}/100" style="color:${barColor};font-weight:600">${x.spec}</span>
    </div>`;
  }).join('');

  const sourceNote = coCount > 100
    ? `Performance data · ${coCount} riders · age ≤35`
    : `⚠️ Live scores need a data refresh · fallback stats active`;

  el.innerHTML = catBar
    + `<div class="rankings-subtitle">${cat.desc} · ${sourceNote}</div>`
    + `<div class="rankings-list">${rows || '<p style="padding:20px;color:var(--muted)">No data yet — refresh pending</p>'}</div>`;
}

    ${sections.map(sec => `
    <div class="help-section">
      <div class="help-section-title">${esc(sec.title)}</div>
      ${sec.rows.map(([term, def]) => `
      <div class="help-row">
        <div class="help-term">${esc(term)}</div>
        <div class="help-def">${esc(def)}</div>
      </div>`).join('')}
    </div>`).join('')}
  </div>`;

  el.innerHTML = html;
}

</script>
</body>
</html>
